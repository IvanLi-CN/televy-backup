[package]
name = "televybackup-snapshot-helper"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "televybackup_snapshot_helper"
path = "src/lib.rs"

[[bin]]
name = "televybackup-snapshot-helper"
path = "src/main.rs"

[dependencies]
libc = "0.2"
plist = "=1.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
