[package]
name = "televybackup-snapshot-access"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[lib]
name = "televybackup_snapshot_access"
path = "src/lib.rs"

[[bin]]
name = "televybackup-snapshot-access"
path = "src/main.rs"

[[bin]]
name = "televybackup-snapshot-mount-helper"
path = "src/bin/televybackup-snapshot-mount-helper.rs"

[dependencies]
base64 = "0.22"
libc = "0.2"
plist = "=1.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4"] }
ignore = "0.4"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
