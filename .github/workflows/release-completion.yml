name: Release completion

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open in-repository product PR to validate
        required: true
        type: string

concurrency:
  group: release-completion-${{ github.event.pull_request.number || inputs.pr_number || github.event.merge_group.head_sha || github.ref }}
  queue: max

permissions:
  checks: read
  contents: read
  pull-requests: read

jobs:
  release-completion:
    name: Release completion
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout trusted base
        if: github.event_name != 'merge_group'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha || 'main' }}
          fetch-depth: 0

      - name: Resolve pull request context
        id: pr
        if: github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PATH: ${{ github.event_path }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number || '' }}
        run: |
          set -euo pipefail
          pr_number="${INPUT_PR_NUMBER}"
          if [[ -z "${pr_number}" ]]; then
            pr_number="$(jq -r '.pull_request.number // empty' "${EVENT_PATH}")"
          fi
          [[ "${pr_number}" =~ ^[0-9]+$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > "${RUNNER_TEMP}/pull-request.json"
          test "$(jq -r '.state' "${RUNNER_TEMP}/pull-request.json")" = open
          test "$(jq -r '.base.ref' "${RUNNER_TEMP}/pull-request.json")" = main
          test "$(jq -r '.head.repo.full_name // empty' "${RUNNER_TEMP}/pull-request.json")" = "${GITHUB_REPOSITORY}"
          head_ref="$(jq -r '.head.ref' "${RUNNER_TEMP}/pull-request.json")"
          git check-ref-format --branch "${head_ref}" >/dev/null
          {
            echo "number=${pr_number}"
            echo "head_sha=$(jq -r '.head.sha' "${RUNNER_TEMP}/pull-request.json")"
            echo "base_sha=$(jq -r '.base.sha' "${RUNNER_TEMP}/pull-request.json")"
            echo "head_ref=${head_ref}"
          } >> "$GITHUB_OUTPUT"
          jq '.labels' "${RUNNER_TEMP}/pull-request.json" > "${RUNNER_TEMP}/labels.json"

      - name: Fetch pull request head
        if: github.event_name != 'merge_group'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: git fetch --no-tags origin "${HEAD_SHA}"

      - name: Checkout trusted merge-group gate scripts
        if: github.event_name == 'merge_group'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.merge_group.base_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch immutable release identity refs
        run: git fetch --force --tags origin

      - name: Verify dispatched workflow uses trusted main checkout
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/${EXPECTED_HEAD_REF}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"

      - name: Verify VERSION and release completion
        if: github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          validate_current_pr() {
            local current_pr_path="$1"
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${current_pr_path}"
            python3 - "${current_pr_path}" <<'PY'
          import json
          import os
          import sys

          current = json.load(open(sys.argv[1], encoding="utf-8"))
          if current.get("state") != "open" or current.get("base", {}).get("ref") != "main":
              raise SystemExit("current PR is not an open PR targeting main")
          if current.get("head", {}).get("sha") != os.environ["HEAD_SHA"]:
              raise SystemExit("current PR head changed while Release completion was queued")
          if current.get("base", {}).get("sha") != os.environ["BASE_SHA"]:
              raise SystemExit("current PR base changed while Release completion was queued")
          PY
          }
          validate_current_pr "${RUNNER_TEMP}/current-pr.json"
          jq '.labels' "${RUNNER_TEMP}/current-pr.json" > "${RUNNER_TEMP}/labels.json"
          deadline=$((SECONDS + 1800))
          while :; do
            gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100" > "${RUNNER_TEMP}/source-checks.json"
            state="$(python3 - "${RUNNER_TEMP}/source-checks.json" <<'PY'
          import json
          import sys

          required = {
              "Release intent label gate",
              "quality",
              "macOS Swift tests",
              "arm64 native package",
              "x86_64 native package",
              "Universal 2 assembly",
          }
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          latest = {}
          for row in payload.get("check_runs", []):
              name = row.get("name")
              if not name:
                  continue
              timestamp = row.get("completed_at") or row.get("started_at") or ""
              if name not in latest or timestamp > latest[name][0]:
                  latest[name] = (timestamp, row)
          missing = sorted(name for name in required if name not in latest)
          pending = sorted(name for name in required if name in latest and latest[name][1].get("status") != "completed")
          failed = sorted(name for name in required if name in latest and latest[name][1].get("status") == "completed" and latest[name][1].get("conclusion") != "success")
          if failed:
              print("failed:" + ",".join(failed))
          elif missing or pending:
              print("pending:" + ",".join(missing + pending))
          else:
              print("ready")
          PY
          )"
            case "${state}" in
              ready) break ;;
              failed:*) echo "source PR checks failed: ${state#failed:}" >&2; exit 1 ;;
              pending:*)
                if (( SECONDS >= deadline )); then
                  echo "timed out waiting for source PR checks: ${state#pending:}" >&2
                  exit 1
                fi
                sleep 10
                ;;
              *) echo "unexpected source check state: ${state}" >&2; exit 1 ;;
            esac
          done
          validate_current_pr "${RUNNER_TEMP}/current-pr-final.json"
          jq '.labels' "${RUNNER_TEMP}/current-pr-final.json" > "${RUNNER_TEMP}/labels.json"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100" > "${RUNNER_TEMP}/source-checks.json"
          product_release="$(jq -r 'any(.[]; .name == "type:major" or .name == "type:minor" or .name == "type:patch")' "${RUNNER_TEMP}/labels.json")"
          if [[ "${product_release}" == true ]]; then
            prepared_json="$(python3 .github/scripts/release_chain.py find-prepared --commit "${HEAD_SHA}" --base "${BASE_SHA}" 2>/dev/null || true)"
            preparation_sha="$(printf '%s' "${prepared_json}" | jq -r .preparationSha)"
            if [[ -z "${prepared_json}" ]]; then
              echo "product release is missing a valid VERSION preparation commit" >&2
              exit 1
            fi
            gh api "repos/${GITHUB_REPOSITORY}/commits/${preparation_sha}" > "${RUNNER_TEMP}/github-verification.json"
            jq -e --arg commit "${preparation_sha}" \
              '.sha == $commit and .commit.verification.verified == true' \
              "${RUNNER_TEMP}/github-verification.json" >/dev/null
          fi
          completion_args=(
            --repo-root .
            --commit "${HEAD_SHA}"
            --base "${BASE_SHA}"
            --labels-json "${RUNNER_TEMP}/labels.json"
            --checks-json "${RUNNER_TEMP}/source-checks.json"
          )
          if [[ "${product_release}" == true ]] && \
             python3 .github/scripts/release_completion.py --help 2>&1 | grep -Fq -- "--github-verification-json"; then
            completion_args+=(--github-verification-json "${RUNNER_TEMP}/github-verification.json")
          fi
          if [[ -n "${prepared_json}" ]]; then
            release_mode="$(printf '%s' "${prepared_json}" | jq -r .mode)"
            reservation_source_sha="$(git show -s --format=%B "${preparation_sha}" | sed -n 's/^Release-Reservation-Source-SHA: //p' | head -1)"
            if [[ -z "${reservation_source_sha}" ]]; then
              reservation_source_sha="$(printf '%s' "${prepared_json}" | jq -r '.reservationSourceSha // .sourceSha')"
            fi
            jq -n \
              --arg ref "$(printf '%s' "${prepared_json}" | jq -r .reservationRef)" \
              --arg sourceSha "${reservation_source_sha}" \
              --arg version "$(printf '%s' "${prepared_json}" | jq -r .version)" \
              --arg channel "$(printf '%s' "${prepared_json}" | jq -r .channel | sed 's/^channel://')" \
              --arg reservationId "$(printf '%s' "${prepared_json}" | jq -r .reservationId)" \
              --arg owner "$(printf '%s' "${prepared_json}" | jq -r .reservationOwner)" \
              --arg claimKey "$(printf '%s' "${prepared_json}" | jq -r .claimKey)" \
              --arg boundaryToken "$(printf '%s' "${prepared_json}" | jq -r .boundaryToken)" \
              '{ref:$ref,sourceSha:$sourceSha,version:$version,channel:$channel,reservationId:$reservationId,"Reservation-Owner":$owner,"Reservation-Claim-Key":$claimKey,"Reservation-Boundary-Token":$boundaryToken}' \
              > "${RUNNER_TEMP}/reservation.json"
            python3 - "${RUNNER_TEMP}/reservation.json" <<'PY'
          import json
          import os
          import pathlib
          import sys
          sys.path.insert(0, '.github/scripts')
          import release_reservation
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          release_reservation.verify_github_reservation(
              value,
              repository=os.environ['GITHUB_REPOSITORY'],
              token=os.environ['GH_TOKEN'],
              api_root=os.environ.get('GITHUB_API_URL', 'https://api.github.com'),
          )
          PY
            completion_args+=(--release-mode "${release_mode}")
            if [[ "${release_mode}" == version-only-release-pr ]]; then
              covered_merge_sha="$(printf '%s' "${prepared_json}" | jq -r .coveredMergeSha)"
              gh api \
                -H "Accept: application/vnd.github+json" \
                "repos/${GITHUB_REPOSITORY}/commits/${covered_merge_sha}/pulls" \
                > "${RUNNER_TEMP}/covered-merge-pulls.json"
              completion_args+=(
                --covered-merge-sha "${covered_merge_sha}"
                --covered-merge-proof-json "${RUNNER_TEMP}/covered-merge-pulls.json"
              )
            fi
          fi
          python3 .github/scripts/release_completion.py "${completion_args[@]}" \
            --allow-migration \
            --migration-version 0.9.2 \
            --reservation-json "${RUNNER_TEMP}/reservation.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --token "${GH_TOKEN}" \
            --api-root "${GITHUB_API_URL}" \
            --require-github-verification

      - name: Validate merge-group release completion
        if: github.event_name == 'merge_group'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: bash ./.github/scripts/merge-group-release-gate.sh completion
