name: Release completion

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  merge_group:

concurrency:
  group: release-completion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  checks: read
  contents: read
  pull-requests: read

jobs:
  release-completion:
    name: Release completion
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch pull request head
        run: git fetch --no-tags origin "${{ github.event.pull_request.head.sha }}"

      - name: Verify VERSION and release completion
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          jq '.pull_request.labels' "${GITHUB_EVENT_PATH}" > "${RUNNER_TEMP}/labels.json"
          verification_sha="${HEAD_SHA}"
          if prepared_json="$(python3 .github/scripts/release_chain.py verify-prepared --commit "${HEAD_SHA}" 2>/dev/null)"; then
            verification_sha="$(printf '%s' "${prepared_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sourceSha"])')"
          fi
          deadline=$((SECONDS + 540))
          while :; do
            gh api "repos/${GITHUB_REPOSITORY}/commits/${verification_sha}/check-runs?filter=latest&per_page=100" > "${RUNNER_TEMP}/source-checks.json"
            state="$(python3 - "${RUNNER_TEMP}/source-checks.json" <<'PY'
          import json
          import sys

          required = {
              "Release intent label gate",
              "quality",
              "macOS Swift tests",
              "arm64 native package",
              "x86_64 native package",
              "Universal 2 assembly",
          }
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          latest = {}
          for row in payload.get("check_runs", []):
              name = row.get("name")
              if not name:
                  continue
              timestamp = row.get("completed_at") or row.get("started_at") or ""
              if name not in latest or timestamp > latest[name][0]:
                  latest[name] = (timestamp, row)
          missing = sorted(name for name in required if name not in latest)
          pending = sorted(name for name in required if name in latest and latest[name][1].get("status") != "completed")
          failed = sorted(name for name in required if name in latest and latest[name][1].get("status") == "completed" and latest[name][1].get("conclusion") != "success")
          if failed:
              print("failed:" + ",".join(failed))
          elif missing or pending:
              print("pending:" + ",".join(missing + pending))
          else:
              print("ready")
          PY
          )"
            case "${state}" in
              ready) break ;;
              failed:*) echo "source PR checks failed: ${state#failed:}" >&2; exit 1 ;;
              pending:*)
                if (( SECONDS >= deadline )); then
                  echo "timed out waiting for source PR checks: ${state#pending:}" >&2
                  exit 1
                fi
                sleep 10
                ;;
              *) echo "unexpected source check state: ${state}" >&2; exit 1 ;;
            esac
          done
          python3 .github/scripts/release_completion.py \
            --repo-root . \
            --commit "${HEAD_SHA}" \
            --base "${BASE_SHA}" \
            --labels-json "${RUNNER_TEMP}/labels.json" \
            --checks-json "${RUNNER_TEMP}/source-checks.json" \
            --allow-migration \
            --migration-version 0.9.2
