name: macOS package matrix

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or ref to package; defaults to the triggering commit
        required: false
        type: string

permissions:
  contents: read
  checks: read

jobs:
  classify:
    name: Classify package preparation
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
      source_sha: ${{ steps.classify.outputs.source_sha }}
      verification_sha: ${{ steps.classify.outputs.verification_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: classify
        run: |
          if python3 .github/scripts/release_chain.py verify-prepared --commit HEAD >/dev/null 2>&1; then
            echo "kind=prepared" >> "$GITHUB_OUTPUT"
            verification_sha="$(python3 .github/scripts/release_chain.py find-prepared --commit HEAD | python3 -c 'import json,sys; print(json.load(sys.stdin)["sourceSha"])')"
          else
            echo "kind=source" >> "$GITHUB_OUTPUT"
            verification_sha="$(git rev-parse HEAD)"
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "verification_sha=${verification_sha}" >> "$GITHUB_OUTPUT"

  arm64:
    needs: classify
    if: needs.classify.result == 'success'
    name: arm64 native package
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          fetch-depth: 0
      - name: Verify prepared release source
        if: needs.classify.outputs.kind == 'prepared'
        run: python3 .github/scripts/release_chain.py verify-prepared --commit HEAD
      - name: Verify source arm64 package check
        if: needs.classify.outputs.kind == 'prepared'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.classify.outputs.verification_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/check-runs?filter=latest&per_page=100" \
            | jq -e 'any(.check_runs[]; .name == "arm64 native package" and .status == "completed" and .conclusion == "success")' >/dev/null
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        if: needs.classify.outputs.kind == 'source'
        with:
          toolchain: 1.91.0
          targets: aarch64-apple-darwin
      - name: Cache macOS arm64 build dependencies
        if: needs.classify.outputs.kind == 'source'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pip
            ~/Library/Caches/pip
            target
            crates/mtproto-helper/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-macos-${{ hashFiles('Cargo.lock', 'crates/mtproto-helper/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-macos-
      - name: Build arm64 package (up to 2 attempts)
        if: needs.classify.outputs.kind == 'source'
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if bash scripts/macos/package-release.sh --mode development --arch arm64 --output-dir dist/arm64; then
              exit 0
            fi
            if [[ "$attempt" -eq 2 ]]; then
              echo "arm64 package build failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "arm64 package build failed; retrying (attempt 2/2)" >&2
          done
      - if: needs.classify.outputs.kind == 'source'
        run: bash scripts/macos/verify-app-icon-assets.sh assets/brand/macos/TelevyBackup.iconset macos/TelevyBackupApp/Resources/TelevyBackup.icns dist/arm64/TelevyBackup.app
      - if: needs.classify.outputs.kind == 'source'
        env:
          DMG_EVIDENCE_FILE: ${{ runner.temp }}/dmg-layout-arm64-events.jsonl
        run: bash scripts/macos/verify-dmg-layout.sh --dmg "$(find dist/arm64 -maxdepth 1 -name 'TelevyBackup-*-arm64.dmg' -print -quit)"
      - if: needs.classify.outputs.kind == 'source'
        run: python3 .github/scripts/verify-dmg-evidence.py --evidence "${{ runner.temp }}/dmg-layout-arm64-events.jsonl" --asset-dir dist/arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: needs.classify.outputs.kind == 'source'
        with:
          name: package-ci-arm64
          path: dist/arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && needs.classify.outputs.kind == 'source'
        with:
          name: package-ci-arm64-dmg-verification
          path: ${{ runner.temp }}/dmg-layout-arm64-events.jsonl
          if-no-files-found: error

  x86_64:
    needs: classify
    if: needs.classify.result == 'success'
    name: x86_64 native package
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          fetch-depth: 0
      - name: Verify prepared release source
        if: needs.classify.outputs.kind == 'prepared'
        run: python3 .github/scripts/release_chain.py verify-prepared --commit HEAD
      - name: Verify source x86_64 package check
        if: needs.classify.outputs.kind == 'prepared'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.classify.outputs.verification_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/check-runs?filter=latest&per_page=100" \
            | jq -e 'any(.check_runs[]; .name == "x86_64 native package" and .status == "completed" and .conclusion == "success")' >/dev/null
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        if: needs.classify.outputs.kind == 'source'
        with:
          toolchain: 1.91.0
          targets: x86_64-apple-darwin
      - name: Cache macOS x86_64 build dependencies
        if: needs.classify.outputs.kind == 'source'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pip
            ~/Library/Caches/pip
            target
            crates/mtproto-helper/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-macos-${{ hashFiles('Cargo.lock', 'crates/mtproto-helper/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-macos-
      - name: Build x86_64 package (up to 2 attempts)
        if: needs.classify.outputs.kind == 'source'
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if bash scripts/macos/package-release.sh --mode development --arch x86_64 --output-dir dist/x86_64; then
              exit 0
            fi
            if [[ "$attempt" -eq 2 ]]; then
              echo "x86_64 package build failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "x86_64 package build failed; retrying (attempt 2/2)" >&2
          done
      - if: needs.classify.outputs.kind == 'source'
        run: bash scripts/macos/verify-app-icon-assets.sh assets/brand/macos/TelevyBackup.iconset macos/TelevyBackupApp/Resources/TelevyBackup.icns dist/x86_64/TelevyBackup.app
      - if: needs.classify.outputs.kind == 'source'
        env:
          DMG_EVIDENCE_FILE: ${{ runner.temp }}/dmg-layout-x86_64-events.jsonl
        run: bash scripts/macos/verify-dmg-layout.sh --dmg "$(find dist/x86_64 -maxdepth 1 -name 'TelevyBackup-*-x86_64.dmg' -print -quit)"
      - if: needs.classify.outputs.kind == 'source'
        run: python3 .github/scripts/verify-dmg-evidence.py --evidence "${{ runner.temp }}/dmg-layout-x86_64-events.jsonl" --asset-dir dist/x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: needs.classify.outputs.kind == 'source'
        with:
          name: package-ci-x86_64
          path: dist/x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && needs.classify.outputs.kind == 'source'
        with:
          name: package-ci-x86_64-dmg-verification
          path: ${{ runner.temp }}/dmg-layout-x86_64-events.jsonl
          if-no-files-found: error

  universal2:
    name: Universal 2 assembly
    runs-on: macos-15
    timeout-minutes: 10
    needs: [classify, arm64, x86_64]
    if: needs.classify.result == 'success'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.classify.outputs.source_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        if: needs.classify.outputs.kind == 'source'
        with:
          toolchain: 1.91.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.classify.outputs.kind == 'source'
        with:
          name: package-ci-arm64
          path: dist/arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.classify.outputs.kind == 'source'
        with:
          name: package-ci-x86_64
          path: dist/x86_64
      - name: Verify prepared release source
        if: needs.classify.outputs.kind == 'prepared'
        run: python3 .github/scripts/release_chain.py verify-prepared --commit HEAD
      - name: Verify source Universal 2 package check
        if: needs.classify.outputs.kind == 'prepared'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.classify.outputs.verification_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/check-runs?filter=latest&per_page=100" \
            | jq -e 'any(.check_runs[]; .name == "Universal 2 assembly" and .status == "completed" and .conclusion == "success")' >/dev/null
      - name: Assemble, hash, and inspect
        if: needs.classify.outputs.kind == 'source'
        env:
          RUST_TOOLCHAIN: 1.91.0
        run: |
          set -euo pipefail
          mkdir -p dist/final
          arm_app="$(find dist/arm64 -maxdepth 1 -type d -name '*.app' -print -quit)"
          x86_app="$(find dist/x86_64 -maxdepth 1 -type d -name '*.app' -print -quit)"
          bash scripts/macos/assemble-universal.sh --mode development --arm64-app "$arm_app" --x86_64-app "$x86_app" --output-dir dist/final
          cp dist/arm64/TelevyBackup-*-arm64.dmg dist/final/
          cp dist/x86_64/TelevyBackup-*-x86_64.dmg dist/final/
          cp dist/arm64/televybackup-tools-*-arm64.tar.gz dist/final/
          cp dist/x86_64/televybackup-tools-*-x86_64.tar.gz dist/final/
          bash scripts/macos/generate-release-manifest.sh --mode development --asset-dir dist/final --source-commit "$(git rev-parse HEAD)" --packaging-commit "$GITHUB_SHA" --output dist/final/BUILD-MANIFEST.json
          DMG_EVIDENCE_FILE="${RUNNER_TEMP}/dmg-release-events.jsonl" \
            bash scripts/macos/verify-release-assets.sh --mode development --asset-dir dist/final --expected-source-commit "$(git rev-parse HEAD)" --expected-packaging-commit "$GITHUB_SHA"
          python3 .github/scripts/verify-dmg-evidence.py \
            --evidence "${RUNNER_TEMP}/dmg-release-events.jsonl" \
            --asset-dir dist/final
      - name: Verify daemon-owned WebDAV service
        if: needs.classify.outputs.kind == 'source'
        run: bash scripts/macos/verify-webdav-snapshot-browsing.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: needs.classify.outputs.kind == 'source'
        with:
          name: package-ci-universal2
          path: dist/final
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && needs.classify.outputs.kind == 'source'
        with:
          name: package-ci-universal2-dmg-verification
          path: ${{ runner.temp }}/dmg-release-events.jsonl
          if-no-files-found: error
