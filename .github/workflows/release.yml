          done
      - name: Verify reused Snapshot Access identity
        if: needs.resolve.outputs.helper_source_mode == 'reuse'
        run: bash "$TELEVYBACKUP_POLICY_VERIFY_COMPONENT_IDENTITY" --reference "$TELEVYBACKUP_SNAPSHOT_ACCESS_BUNDLE" --candidate "dist/x86_64/TelevyBackup.app/Contents/Library/LoginItems/TelevyBackup Snapshot Access.app" --manifest "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-package-x86_64
          path: dist/x86_64

  assemble:
    name: Assemble Universal 2 package
    needs: [resolve, build-arm64, build-x86_64]
    if: needs.resolve.outputs.enabled == 'true'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.merge_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-package-arm64
          path: dist/arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-package-x86_64
          path: dist/x86_64
      - name: Download immutable Snapshot Access helper source
        if: needs.resolve.outputs.helper_source_mode == 'reuse'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: snapshot-helper-source
          path: ${{ runner.temp }}/snapshot-helper
      - name: Extract and verify immutable Snapshot Access helper
        if: needs.resolve.outputs.helper_source_mode == 'reuse'
        env:
          HELPER_SOURCE_TAG: ${{ needs.resolve.outputs.helper_source_tag }}
          HELPER_SOURCE_COMMIT: ${{ needs.resolve.outputs.helper_source_commit }}
          POLICY_SHA: ${{ needs.resolve.outputs.policy_sha }}
        run: |
          set -euo pipefail
          helper_version="${HELPER_SOURCE_TAG#v}"
          python3 .github/scripts/release_helper.py verify-assets \
            --asset-dir "$RUNNER_TEMP/snapshot-helper" \
            --lock packaging/macos/snapshot-components.lock.json \
            --source-tag "$HELPER_SOURCE_TAG" \
            --expected-source-commit "$HELPER_SOURCE_COMMIT"
          bash scripts/macos/extract-snapshot-access-helper.sh \
            --dmg "$RUNNER_TEMP/snapshot-helper/TelevyBackup-${helper_version}.dmg" \
            --output-dir "$RUNNER_TEMP/snapshot-helper"
          test -n "${POLICY_SHA}"
          git fetch --force origin main
          git cat-file -e "${POLICY_SHA}^{commit}"
          policy_verify_component_identity="$RUNNER_TEMP/verify-component-identity.sh"
          git show "${POLICY_SHA}:scripts/macos/verify-component-identity.sh" > "${policy_verify_component_identity}"
          chmod 755 "${policy_verify_component_identity}"
          echo "TELEVYBACKUP_POLICY_VERIFY_COMPONENT_IDENTITY=${policy_verify_component_identity}" >> "$GITHUB_ENV"
          bash "${policy_verify_component_identity}" \
            --reference "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" \
            --candidate "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" \
            --manifest "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json"
      - name: Assemble and validate final assets
        env:
          RUST_TOOLCHAIN: 1.91.0
          HELPER_SOURCE_MODE: ${{ needs.resolve.outputs.helper_source_mode }}
          HELPER_SOURCE_TAG: ${{ needs.resolve.outputs.helper_source_tag }}
          POLICY_SHA: ${{ needs.resolve.outputs.policy_sha }}
        run: |
          set -euo pipefail
          mkdir -p dist/final
          case "${HELPER_SOURCE_MODE}" in
            reuse) export TELEVYBACKUP_SNAPSHOT_ACCESS_SOURCE=rc1-universal-artifact ;;
            bootstrap) export TELEVYBACKUP_SNAPSHOT_ACCESS_SOURCE=one-time-bootstrap-universal-build ;;
            *) echo "invalid resolved helper source mode: ${HELPER_SOURCE_MODE}" >&2; exit 1 ;;
          esac
          arm_app="$(find dist/arm64 -maxdepth 1 -type d -name '*.app' -print -quit)"
          x86_app="$(find dist/x86_64 -maxdepth 1 -type d -name '*.app' -print -quit)"
          bash scripts/macos/assemble-universal.sh --mode release --arm64-app "$arm_app" --x86_64-app "$x86_app" --output-dir dist/final
          cp dist/arm64/TelevyBackup-*-arm64.dmg dist/final/
          cp dist/x86_64/TelevyBackup-*-x86_64.dmg dist/final/
          cp dist/arm64/televybackup-tools-*-arm64.tar.gz dist/final/
          cp dist/x86_64/televybackup-tools-*-x86_64.tar.gz dist/final/
          bash scripts/macos/generate-release-manifest.sh --mode release --asset-dir dist/final --source-commit "${{ needs.resolve.outputs.merge_sha }}" --packaging-commit "${POLICY_SHA}" --output dist/final/BUILD-MANIFEST.json
          # Keep product inputs on the recovered merge checkout, but evaluate the
          # release asset policy from the exact trusted main commit resolved above.
          test -n "${POLICY_SHA}"
          git fetch --force origin main
          git cat-file -e "${POLICY_SHA}^{commit}"
          policy_checkout="${RUNNER_TEMP}/release-policy"
          git worktree add --detach "${policy_checkout}" "${POLICY_SHA}"
          policy_cleanup() {
            git worktree remove --force "${policy_checkout}" >/dev/null 2>&1 || true
          }
          trap policy_cleanup EXIT
          # VERSION is the recovered product input; policy code and its lock remain
          # materialized from the exact trusted policy commit.
          cp "$GITHUB_WORKSPACE/VERSION" "${policy_checkout}/VERSION"
          policy_verify_release_assets="${policy_checkout}/scripts/macos/verify-release-assets.sh"
          policy_verify_app_icon_assets="${policy_checkout}/scripts/macos/verify-app-icon-assets.sh"
          (
            cd "${policy_checkout}"
            DMG_EVIDENCE_FILE="${RUNNER_TEMP}/dmg-release-events.jsonl" \
              "${policy_verify_release_assets}" --mode release --asset-dir "$GITHUB_WORKSPACE/dist/final" --expected-source-commit "${{ needs.resolve.outputs.merge_sha }}" --expected-packaging-commit "${POLICY_SHA}"
          )
          bash "${policy_verify_app_icon_assets}" \
            "${policy_checkout}/assets/brand/macos/TelevyBackup.iconset" \
            "$GITHUB_WORKSPACE/dist/final/TelevyBackup.app/Contents/Resources/TelevyBackup.icns" \
            "$GITHUB_WORKSPACE/dist/final/TelevyBackup.app" \
            "${policy_checkout}/assets/brand/macos/Assets.xcassets" \
            "${policy_checkout}/assets/brand/macos/previews"
          if [[ "${HELPER_SOURCE_MODE}" == reuse ]]; then
            bash "${policy_checkout}/scripts/macos/verify-component-identity.sh" \
              --reference "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" \
              --candidate "dist/final/TelevyBackup.app/Contents/Library/LoginItems/TelevyBackup Snapshot Access.app" \
              --manifest "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets
          path: dist/final
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-dmg-verification
          path: ${{ runner.temp }}/dmg-release-events.jsonl
          if-no-files-found: error

  macos-acceptance:
    name: Require macOS RC acceptance for stable
    needs: [resolve, assemble]
    if: needs.resolve.outputs.enabled == 'true' && needs.resolve.outputs.channel == 'prod'
    runs-on: macos-15
    permissions:
      contents: write
    environment:
      name: macos-release-acceptance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.policy_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: release-assets
      - name: Download and bind RC release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          core_version="${{ needs.resolve.outputs.version }}"
          for rc_number in 1 2; do
            rc_version="${core_version}-rc.${rc_number}"
            rc_tag="v${rc_version}"
            rc_dir="release-rc/rc${rc_number}"
            mkdir -p "${rc_dir}"
            gh release download "${rc_tag}" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "TelevyBackup-${rc_version}.dmg" \
              --pattern "BUILD-MANIFEST.json" \
              --pattern "SHA256SUMS" \
              --dir "${rc_dir}"
            git fetch --force origin "refs/tags/${rc_tag}:refs/tags/${rc_tag}"
            python3 .github/scripts/release_chain.py verify-tag-provenance --tag "${rc_tag}"
            source_commit="$(git rev-list -n 1 "${rc_tag}^{commit}")"
            echo "RC${rc_number}_SOURCE_COMMIT=${source_commit}" >> "$GITHUB_ENV"
          done
      - name: Verify downloaded RC DMG layouts
        run: |
          set -euo pipefail
          core_version="${{ needs.resolve.outputs.version }}"
          for rc_number in 1 2; do
            bash scripts/macos/verify-dmg-layout.sh \
              --dmg "release-rc/rc${rc_number}/TelevyBackup-${core_version}-rc.${rc_number}.dmg"
          done
      - name: Verify manual RC1 to RC2 acceptance evidence
        env:
          ACCEPTANCE_EVIDENCE: ${{ vars.TELEVYBACKUP_MACOS_RC_ACCEPTANCE_EVIDENCE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          core_version="${{ needs.resolve.outputs.version }}"
          rc1_tag="v${core_version}-rc.1"
          rc2_tag="v${core_version}-rc.2"
          screenshot_dir="${RUNNER_TEMP}/finder-acceptance-screenshots"
          mkdir -p "${screenshot_dir}"
          screenshot_names=()
          while IFS= read -r screenshot_name; do
            [[ -n "${screenshot_name}" ]] && screenshot_names+=("${screenshot_name}")
          done < <(python3 - "${ACCEPTANCE_EVIDENCE}" <<'PY'
          import json
          import pathlib
          import re
          import sys

          records = json.loads(sys.argv[1]).get("finder_acceptance")
          if not isinstance(records, list) or len(records) != 2:
              raise SystemExit("finder_acceptance must contain exactly two records")
          names = []
          for record in records:
              name = record.get("screenshot") if isinstance(record, dict) else None
              if (not isinstance(name, str) or not name or name != pathlib.Path(name).name
                      or name.startswith(".") or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", name)):
                  raise SystemExit("finder acceptance screenshot names must be safe basenames")
              names.append(name)
          if len(set(names)) != len(names):
              raise SystemExit("finder acceptance screenshot names must be distinct")
          print("\n".join(names))
          PY
          )
          for screenshot_name in "${screenshot_names[@]}"; do
            gh release download "${rc2_tag}" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "${screenshot_name}" \
              --dir "${screenshot_dir}"
          done
          rc1_json="$(gh release view "$rc1_tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)"
          rc2_json="$(gh release view "$rc2_tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)"
          python3 - "$rc1_json" "$rc2_json" <<'PY'
          import json, sys
          for raw in sys.argv[1:]:
              state = json.loads(raw)
              assert state["isDraft"] is False
              assert state["isPrerelease"] is True
          PY
          python3 .github/scripts/verify-macos-rc-acceptance.py \
            --evidence "$ACCEPTANCE_EVIDENCE" \
            --manifest release-assets/BUILD-MANIFEST.json \
            --checksums release-assets/SHA256SUMS \
            --stable-dmg "release-assets/TelevyBackup-${core_version}.dmg" \
            --stable-version "$core_version" \
            --rc1-tag "$rc1_tag" \
            --rc2-tag "$rc2_tag" \
            --stable-source-commit "${{ needs.resolve.outputs.merge_sha }}" \
            --rc1-manifest release-rc/rc1/BUILD-MANIFEST.json \
            --rc1-checksums release-rc/rc1/SHA256SUMS \
            --rc1-dmg "release-rc/rc1/TelevyBackup-${core_version}-rc.1.dmg" \
            --rc1-source-commit "$RC1_SOURCE_COMMIT" \
            --rc2-manifest release-rc/rc2/BUILD-MANIFEST.json \
            --rc2-checksums release-rc/rc2/SHA256SUMS \
            --rc2-dmg "release-rc/rc2/TelevyBackup-${core_version}-rc.2.dmg" \
            --rc2-source-commit "$RC2_SOURCE_COMMIT" \
            --screenshot-dir "$screenshot_dir"

  publish:
    name: Publish GitHub Release
    needs: [resolve, assemble, macos-acceptance]
    if: >-
      always() && needs.resolve.outputs.enabled == 'true' &&
      needs.assemble.result == 'success' &&
      (needs.resolve.outputs.channel != 'prod' || needs.macos-acceptance.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_TAG: ${{ needs.resolve.outputs.tag }}
      PRODUCT_VERSION: ${{ needs.resolve.outputs.version }}
      PRODUCT_CHANNEL: ${{ needs.resolve.outputs.channel }}
      RELEASE_SHA: ${{ needs.resolve.outputs.merge_sha }}
      RELEASE_STATE: ${{ needs.resolve.outputs.release_state }}
      RESERVATION_ID: ${{ needs.resolve.outputs.reservation_id }}
      RESERVATION_REF: ${{ needs.resolve.outputs.reservation_ref }}
      RESERVATION_OWNER: ${{ needs.resolve.outputs.reservation_owner }}
      CLAIM_KEY: ${{ needs.resolve.outputs.claim_key }}
      BOUNDARY_TOKEN: ${{ needs.resolve.outputs.boundary_token }}
      BOUND_IDENTITY: ${{ needs.resolve.outputs.bound_identity }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.policy_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-intent
          path: release-intent
      - name: Create or verify immutable product tag
        run: |
          set -euo pipefail
          git fetch --force origin main '+refs/tags/*:refs/tags/*'
          if [[ "${BOUND_IDENTITY}" != present ]]; then
            python3 .github/scripts/release_chain.py verify-release-sequence --version "${PRODUCT_VERSION}" --expected-sha "${RELEASE_SHA}"
          fi
          tag_json="$(python3 .github/scripts/release_chain.py verify-tag --version "${PRODUCT_VERSION}" --expected-sha "${RELEASE_SHA}" --allow-existing)"
          status="$(printf '%s' "${tag_json}" | jq -r .status)"
          if [[ "${status}" == available ]]; then
            tag_object_sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag="${PRODUCT_TAG}" -f message="${PRODUCT_TAG}" \
              -f object="${RELEASE_SHA}" -f type=commit --jq '.sha')"
            if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${PRODUCT_TAG}" -f sha="${tag_object_sha}" >/dev/null; then
              git fetch --force origin "refs/tags/${PRODUCT_TAG}:refs/tags/${PRODUCT_TAG}"
            fi
          fi
          git fetch --force origin "refs/tags/${PRODUCT_TAG}:refs/tags/${PRODUCT_TAG}"
          python3 .github/scripts/release_chain.py verify-tag --version "${PRODUCT_VERSION}" --expected-sha "${RELEASE_SHA}" --allow-existing
      - name: Create or update GitHub Release
        run: |
          set -euo pipefail
          runtime_state="${RELEASE_STATE}"
          release_output=""
          if release_output="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PRODUCT_TAG}" 2>&1)"; then
            is_draft="$(printf '%s' "${release_output}" | jq -r '.draft | tostring')"
            is_prerelease="$(printf '%s' "${release_output}" | jq -r '.prerelease | tostring')"
            is_latest=false
            expected_prerelease=false
            expected_latest=false
            if [[ "${PRODUCT_CHANNEL}" != prod ]]; then
              expected_prerelease=true
            elif [[ "${is_draft}" == false ]]; then
              latest_output=""
              if ! latest_output="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" 2>&1)"; then
                printf '%s\n' "${latest_output}" >&2
                echo "release_state_conflict: unable to resolve latest GitHub Release" >&2
                exit 1
              fi
              latest_tag="$(printf '%s' "${latest_output}" | jq -r '.tag_name // empty')"
              if [[ -z "${latest_tag}" ]]; then
                echo "release_state_conflict: latest GitHub Release has no tag" >&2
                exit 1
              fi
              if [[ "${latest_tag}" == "${PRODUCT_TAG}" ]]; then
                is_latest=true
              fi
              expected_latest=true
            fi
            if [[ "${is_prerelease}" != "${expected_prerelease}" || "${is_latest}" != "${expected_latest}" ]]; then
              echo "release_state_conflict: GitHub Release channel flags do not match ${PRODUCT_CHANNEL}" >&2
              exit 1
            fi
            case "${is_draft}" in
              true) runtime_state=draft ;;
              false) runtime_state=published ;;
              *) echo "release_state_conflict: invalid GitHub Release state" >&2; exit 1 ;;
            esac
          else
            if ! printf '%s' "${release_output}" | grep -qiE '404|not found'; then
              printf '%s\n' "${release_output}" >&2
              echo "release_state_conflict: unable to resolve GitHub Release state" >&2
              exit 1
            fi
          fi
          if [[ "${runtime_state}" == published ]]; then
            echo "Product release became published for ${PRODUCT_TAG}; no asset overwrite"
          else
            release_files=()
            release_asset_list="${RUNNER_TEMP}/release-asset-list.txt"
            python3 - "release-assets" > "${release_asset_list}" <<'PY'
          import json
          import os
          import re
          import stat
          import sys

          asset_dir = sys.argv[1]
          manifest_path = os.path.join(asset_dir, "BUILD-MANIFEST.json")
          with open(manifest_path, encoding="utf-8") as handle:
              manifest = json.load(handle)
          expected = {"BUILD-MANIFEST.json", "SHA256SUMS"}
          for asset in manifest.get("assets", []):
              name = asset.get("name") if isinstance(asset, dict) else None
              if not isinstance(name, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", name):
                  raise SystemExit("BUILD-MANIFEST.json contains an unsafe release asset name")
              if name in expected:
                  raise SystemExit(f"BUILD-MANIFEST.json contains a reserved release asset name: {name}")
              expected.add(name)
          actual = set(os.listdir(asset_dir))
          if actual != expected:
              extra = sorted(actual - expected)
              missing = sorted(expected - actual)
              raise SystemExit(
                  f"release-assets set does not match BUILD-MANIFEST.json: extra={extra!r} missing={missing!r}"
              )
          for name in sorted(expected):
              path = os.path.join(asset_dir, name)
              if not stat.S_ISREG(os.lstat(path).st_mode):
                  raise SystemExit(f"release asset must be a regular file: {name}")
              print(name)
          PY
            while IFS= read -r asset_name; do release_files+=("release-assets/${asset_name}"); done < "${release_asset_list}"
            ((${#release_files[@]} > 0))
            if [[ "${runtime_state}" == missing ]]; then
              flags=(--draft --verify-tag --title "${PRODUCT_TAG}" --generate-notes)
              if [[ "${PRODUCT_CHANNEL}" != prod ]]; then
                flags+=(--prerelease --latest=false)
              else
                flags+=(--latest=true)
              fi
              gh release create "${PRODUCT_TAG}" "${flags[@]}"
              runtime_state=draft
            fi
            if [[ "${runtime_state}" == draft ]]; then
              latest_release=""
              if ! latest_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PRODUCT_TAG}" 2>&1)"; then
                printf '%s\n' "${latest_release}" >&2
                echo "release_state_conflict: unable to recheck draft Release state" >&2
                exit 1
              fi
              if [[ "$(printf '%s' "${latest_release}" | jq -r '.draft | tostring')" != true ]]; then
                echo "release_state_conflict: Release became published before asset upload" >&2
                exit 1
              fi
              upload_missing_release_assets() {
                local asset asset_name expected_digest existing_count existing_digest current_release
                for asset in "${release_files[@]}"; do
                  asset_name="$(basename "${asset}")"
                  expected_digest="$(shasum -a 256 "${asset}" | awk '{print $1}')"
                  current_release=""
                  if ! current_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PRODUCT_TAG}" 2>&1)"; then
                    printf '%s\n' "${current_release}" >&2
                    echo "release_state_conflict: unable to read draft Release before ${asset_name}" >&2
                    return 1
                  fi
                  if [[ "$(printf '%s' "${current_release}" | jq -r '.draft | tostring')" != true ]]; then
                    echo "release_state_conflict: Release became published before inspecting ${asset_name}" >&2
                    return 1
                  fi
                  existing_count="$(printf '%s' "${current_release}" | jq --arg name "${asset_name}" '[.assets[]? | select(.name == $name)] | length')"
                  if [[ "${existing_count}" != 0 && "${existing_count}" != 1 ]]; then
                    echo "release_state_conflict: duplicate Release assets named ${asset_name}" >&2
                    return 1
                  fi
                  if [[ "${existing_count}" == 1 ]]; then
                    existing_digest="$(printf '%s' "${current_release}" | jq -r --arg name "${asset_name}" '.assets[] | select(.name == $name) | .digest // empty')"
                    if [[ "${existing_digest}" != "sha256:${expected_digest}" ]]; then
                      echo "release_state_conflict: existing asset digest mismatch for ${asset_name}" >&2
                      return 1
                    fi
                    echo "reusing matching draft Release asset ${asset_name}"
                  else
                    # GitHub's asset upload API has no conditional draft precondition;
                    # the immediate state check, no-clobber upload, and final recheck
                    # fail closed for races that cannot be made atomic remotely.
                    gh release upload "${PRODUCT_TAG}" "${asset}"
                  fi
                done
              }
              upload_missing_release_assets
              final_release=""
              if ! final_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PRODUCT_TAG}" 2>&1)"; then
                printf '%s\n' "${final_release}" >&2
                echo "release_state_conflict: unable to verify draft Release after asset upload" >&2
                exit 1
              fi
              if [[ "$(printf '%s' "${final_release}" | jq -r '.draft | tostring')" != true ]]; then
                echo "release_state_conflict: Release became published during asset upload" >&2
                exit 1
              fi
              expected_assets='[]'
              for asset in "${release_files[@]}"; do
                asset_name="$(basename "${asset}")"
                expected_digest="$(shasum -a 256 "${asset}" | awk '{print $1}')"
                expected_assets="$(printf '%s' "${expected_assets}" | jq -c --arg name "${asset_name}" --arg digest "sha256:${expected_digest}" '. + [{name: $name, digest: $digest}]')"
              done
              expected_assets="$(printf '%s' "${expected_assets}" | jq -c 'sort_by(.name)')"
              actual_assets="$(printf '%s' "${final_release}" | jq -c '[.assets[]? | {name, digest}] | sort_by(.name)')"
              if [[ "${actual_assets}" != "${expected_assets}" ]]; then
                echo "release_state_conflict: final Release asset set or digest does not match release-assets" >&2
                exit 1
              fi
              if [[ "${PRODUCT_CHANNEL}" == prod ]]; then
                gh release edit "${PRODUCT_TAG}" --draft=false --latest=true
              else
                gh release edit "${PRODUCT_TAG}" --draft=false --prerelease --latest=false
              fi
            fi
          fi
      - name: Append consumed receipt
        run: |
          set -euo pipefail
          python3 .github/scripts/release_reservation.py receipt \
            --state consumed --version "${PRODUCT_VERSION}" --merge-sha "${RELEASE_SHA}" \
            --reservation-id "${RESERVATION_ID}" --owner "${RESERVATION_OWNER}" \
            --claim-key "${CLAIM_KEY}" --boundary-token "${BOUNDARY_TOKEN}" \
            --reservation-ref "${RESERVATION_REF}" --repository "${GITHUB_REPOSITORY}" \
            --token "${GH_TOKEN}" --api-root "${GITHUB_API_URL}"

  skipped:
    name: Release skipped
    needs: resolve
    if: needs.resolve.outputs.enabled != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Release skipped: ${{ needs.resolve.outputs.reason }} (${{ needs.resolve.outputs.identity_status }})"
