name: Release Product

on:
  workflow_run:
    workflows: [CI (main)]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Release operation
        required: true
        type: choice
        options: [recover]
        default: recover
      commit_sha:
        description: Existing merged main SHA to recover
        required: true
        type: string
      helper_mode:
        description: Helper source mode; bootstrap requires an explicit recovery when no approved Release exists
        required: false
        type: choice
        options: [auto, bootstrap]
        default: auto

concurrency:
  group: release-product-main
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    name: Resolve merged product identity
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      enabled: ${{ steps.release.outputs.enabled }}
      identity_status: ${{ steps.release.outputs.identity_status }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      preparation_commit_sha: ${{ steps.release.outputs.preparation_commit_sha }}
      merge_sha: ${{ steps.release.outputs.merge_sha }}
      policy_sha: ${{ steps.release.outputs.policy_sha }}
      merge_commit_sha: ${{ steps.release.outputs.merge_commit_sha }}
      head_sha: ${{ steps.release.outputs.head_sha }}
      labels: ${{ steps.release.outputs.labels }}
      components: ${{ steps.release.outputs.components }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
      release_mode: ${{ steps.release.outputs.release_mode }}
      reason: ${{ steps.release.outputs.reason }}
      release_state: ${{ steps.release.outputs.release_state }}
      tag_status: ${{ steps.release.outputs.tag_status }}
      helper_source_mode: ${{ steps.release.outputs.helper_source_mode }}
      reservation_id: ${{ steps.release.outputs.reservation_id }}
      reservation_ref: ${{ steps.release.outputs.reservation_ref }}
      reservation_owner: ${{ steps.release.outputs.reservation_owner }}
      claim_key: ${{ steps.release.outputs.claim_key }}
      boundary_token: ${{ steps.release.outputs.boundary_token }}
      release_type: ${{ steps.release.outputs.release_type }}
      covered_merge_sha: ${{ steps.release.outputs.covered_merge_sha }}
      bound_identity: ${{ steps.release.outputs.bound_identity }}
      pull_request: ${{ steps.release.outputs.pull_request }}
      helper_source_tag: ${{ steps.release.outputs.helper_source_tag }}
      helper_source_commit: ${{ steps.release.outputs.helper_source_commit }}
      helper_source_artifact_digest: ${{ steps.upload-helper-source.outputs.artifact-digest }}
    steps:
      - name: Resolve current trusted main SHA
        id: trusted-main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${main_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "sha=${main_sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout main history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.trusted-main.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and bind immutable merged identity
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event || 'workflow_dispatch' }}
          TARGET_INPUT: ${{ github.event.workflow_run.head_sha || inputs.commit_sha }}
          OPERATION: ${{ inputs.operation || 'publish' }}
          HELPER_MODE: ${{ inputs.helper_mode || 'auto' }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin main '+refs/tags/*:refs/tags/*'
          main_sha="$(git rev-parse origin/main)"
          policy_sha="$(git rev-parse HEAD)"
          test "${policy_sha}" = "${main_sha}"
          echo "policy_sha=${policy_sha}" >> "$GITHUB_OUTPUT"
          test -n "${TARGET_INPUT}"
          if [[ "${EVENT_NAME}" == workflow_run ]]; then
            test "${WORKFLOW_CONCLUSION}" = success
            test "${WORKFLOW_EVENT}" = push
            test "${TARGET_INPUT}" = "${main_sha}"
          else
            test "${OPERATION}" = recover
            git merge-base --is-ancestor "${TARGET_INPUT}" "${main_sha}"
          fi
          # Keep the trusted main checkout for release policy scripts. TARGET_INPUT
          # is the historical product identity and remains the package ref through
          # the resolved outputs; recovery inputs may predate current policy helpers.
          prepared_json="$(python3 .github/scripts/release_chain.py verify-merged --commit "${TARGET_INPUT}")"
          prepared="$(printf '%s' "${prepared_json}" | jq -r .prepared)"
          if [[ "${prepared}" != true ]]; then
            {
              echo "enabled=false"
              echo "identity_status=no-identity"
              echo "source_sha=${TARGET_INPUT}"
              echo "merge_sha=${TARGET_INPUT}"
              echo "bound_identity=missing"
              echo "reason=$(printf '%s' "${prepared_json}" | jq -r '.reason // "no_identity"')"
            } >> "$GITHUB_OUTPUT"
            echo "RELEASE_NO_IDENTITY=${TARGET_INPUT}"
            exit 0
          fi
          merge_sha="$(printf '%s' "${prepared_json}" | jq -r .mergeSha)"
          source_sha="$(printf '%s' "${prepared_json}" | jq -r .sourceSha)"
          preparation_sha="$(printf '%s' "${prepared_json}" | jq -r .preparationSha)"
          version="$(printf '%s' "${prepared_json}" | jq -r .version)"
          tag="$(printf '%s' "${prepared_json}" | jq -r .tag)"
          channel="$(printf '%s' "${prepared_json}" | jq -r .channel | sed 's/^channel://')"
          release_mode="$(printf '%s' "${prepared_json}" | jq -r .mode)"
          reservation_id="$(printf '%s' "${prepared_json}" | jq -r .reservationId)"
          reservation_ref="$(printf '%s' "${prepared_json}" | jq -r .reservationRef)"
          reservation_owner="$(printf '%s' "${prepared_json}" | jq -r .reservationOwner)"
          claim_key="$(printf '%s' "${prepared_json}" | jq -r .claimKey)"
          boundary_token="$(printf '%s' "${prepared_json}" | jq -r .boundaryToken)"
          release_type="$(printf '%s' "${prepared_json}" | jq -r .type)"
          covered_merge_sha="$(printf '%s' "${prepared_json}" | jq -r .coveredMergeSha)"
          pull_request="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${merge_sha}/pulls?per_page=100" | python3 -c 'import json,sys; merge,preparation=sys.argv[1:]; rows=json.load(sys.stdin); matches=[row.get("number") for row in rows if row.get("merge_commit_sha") == merge and row.get("head", {}).get("sha") == preparation and row.get("number") is not None]; print(matches[0] if len(matches) == 1 else "")' "${merge_sha}" "${preparation_sha}")"
          test -n "${pull_request}"
          pull_request_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pull_request}")"
          test "$(printf '%s' "${pull_request_json}" | jq -r '.merge_commit_sha // empty')" = "${merge_sha}"
          pull_request_head_sha="$(printf '%s' "${pull_request_json}" | jq -r '.head.sha')"
          test "${pull_request_head_sha}" = "${preparation_sha}"
          labels_json="$(printf '%s' "${pull_request_json}" | jq -c '[.labels[].name]')"
          components_json="$(printf '%s' "${labels_json}" | jq -c '[.[] | select(startswith("component:"))]')"
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${preparation_sha}" --jq '.commit.verification.verified')"
          test "${verified}" = true
          reservation_json="${RUNNER_TEMP}/reservation.json"
          jq -n \
            --arg ref "${reservation_ref}" --arg sourceSha "$(printf '%s' "${prepared_json}" | jq -r '.reservationSourceSha // .sourceSha')" --arg version "${version}" \
            --arg channel "${channel}" --arg reservationId "${reservation_id}" --arg owner "${reservation_owner}" \
            --arg claimKey "${claim_key}" --arg boundaryToken "${boundary_token}" \
            '{ref:$ref,sourceSha:$sourceSha,version:$version,channel:$channel,reservationId:$reservationId,"Reservation-Owner":$owner,"Reservation-Claim-Key":$claimKey,"Reservation-Boundary-Token":$boundaryToken}' \
            > "${reservation_json}"
          python3 - "${reservation_json}" <<'PY'
          import json
          import pathlib
          import re
          import sys
          sys.path.insert(0, '.github/scripts')
          import release_reservation
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          release_reservation.verify_github_reservation(
              value,
              repository=__import__('os').environ['GITHUB_REPOSITORY'],
              token=__import__('os').environ['GH_TOKEN'],
              api_root=__import__('os').environ.get('GITHUB_API_URL', 'https://api.github.com'),
          )
          PY
          case "${HELPER_MODE}" in
            auto|bootstrap) ;;
            *) echo "invalid helper mode: ${HELPER_MODE}" >&2; exit 1 ;;
          esac

          bound_state=missing
          bound_ref="refs/tags/release-bound/v${version}/${merge_sha}"
          bound_ref_path="${bound_ref#refs/}"
          bound_output=""
          if bound_output="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${bound_ref_path}" --jq '.object.sha' 2>&1)"; then
            if [[ ! "${bound_output}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "release_state_conflict: bound receipt target is not a full commit SHA" >&2
              exit 1
            fi
            python3 - "${version}" "${merge_sha}" "${reservation_id}" "${reservation_owner}" \
              "${claim_key}" "${boundary_token}" "${reservation_ref}" "${GITHUB_REPOSITORY}" \
              "${GH_TOKEN}" "${GITHUB_API_URL}" <<'PY'
          import sys
          sys.path.insert(0, '.github/scripts')
          import release_reservation
          release_reservation.verify_github_receipt(
              state='bound', version=sys.argv[1], merge_sha=sys.argv[2], reservation_id=sys.argv[3],
              owner=sys.argv[4], claim_key=sys.argv[5], boundary_token=sys.argv[6],
              reservation_ref_value=sys.argv[7], repository=sys.argv[8], token=sys.argv[9], api_root=sys.argv[10],
          )
          PY
            bound_state=present
          else
            if ! printf '%s' "${bound_output}" | grep -qiE '404|not found'; then
              printf '%s\n' "${bound_output}" >&2
              echo "release_state_conflict: unable to resolve bound receipt state" >&2
              exit 1
            fi
          fi

          if [[ "${bound_state}" == present ]]; then
            # A same-SHA recovery reuses its already-bound identity and must not
            # be rejected because a newer product tag now exists.
            tag_status=matching
          else
            sequence_json="$(python3 .github/scripts/release_chain.py verify-release-sequence --version "${version}" --expected-sha "${merge_sha}")"
            tag_status="$(printf '%s' "${sequence_json}" | jq -r .status)"
          fi
          release_state=missing
          release_output=""
          if release_output="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>&1)"; then
            if [[ "${tag_status}" != matching ]]; then
              echo "release_state_conflict: Release exists without a matching product tag" >&2
              exit 1
            fi
            is_draft="$(printf '%s' "${release_output}" | jq -r '.draft | tostring')"
            is_prerelease="$(printf '%s' "${release_output}" | jq -r '.prerelease | tostring')"
            is_latest=false
            expected_prerelease=false
            expected_latest=false
            if [[ "${channel}" != prod ]]; then
              expected_prerelease=true
            elif [[ "${is_draft}" == false ]]; then
              latest_output=""
              if ! latest_output="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" 2>&1)"; then
                printf '%s\n' "${latest_output}" >&2
                echo "release_state_conflict: unable to resolve latest GitHub Release" >&2
                exit 1
              fi
              latest_tag="$(printf '%s' "${latest_output}" | jq -r '.tag_name // empty')"
              if [[ -z "${latest_tag}" ]]; then
                echo "release_state_conflict: latest GitHub Release has no tag" >&2
                exit 1
              fi
              if [[ "${latest_tag}" == "${tag}" ]]; then
                is_latest=true
              fi
              expected_latest=true
            fi
            if [[ "${is_prerelease}" != "${expected_prerelease}" || "${is_latest}" != "${expected_latest}" ]]; then
              echo "release_state_conflict: GitHub Release channel flags do not match ${channel}" >&2
              exit 1
            fi
            case "${is_draft}" in
              true) release_state=draft ;;
              false) release_state=published ;;
              *) echo "release_state_conflict: invalid GitHub Release state" >&2; exit 1 ;;
            esac
          else
            if ! printf '%s' "${release_output}" | grep -qiE '404|not found'; then
              printf '%s\n' "${release_output}" >&2
              echo "release_state_conflict: unable to resolve GitHub Release state" >&2
              exit 1
            fi
          fi

          consumed_state=missing
          consumed_ref="refs/tags/release-consumed/v${version}/${merge_sha}"
          consumed_ref_path="${consumed_ref#refs/}"
          consumed_output=""
          if consumed_output="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${consumed_ref_path}" --jq '.object.sha' 2>&1)"; then
            if [[ ! "${consumed_output}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "release_state_conflict: consumed receipt target is not a full commit SHA" >&2
              exit 1
            fi
            python3 - "${version}" "${merge_sha}" "${reservation_id}" "${reservation_owner}" \
              "${claim_key}" "${boundary_token}" "${reservation_ref}" "${GITHUB_REPOSITORY}" \
              "${GH_TOKEN}" "${GITHUB_API_URL}" <<'PY'
          import sys
          sys.path.insert(0, '.github/scripts')
          import release_reservation
          release_reservation.verify_github_receipt(
              state='consumed', version=sys.argv[1], merge_sha=sys.argv[2], reservation_id=sys.argv[3],
              owner=sys.argv[4], claim_key=sys.argv[5], boundary_token=sys.argv[6],
              reservation_ref_value=sys.argv[7], repository=sys.argv[8], token=sys.argv[9], api_root=sys.argv[10],
          )
          PY
            consumed_state=present
          else
            if ! printf '%s' "${consumed_output}" | grep -qiE '404|not found'; then
              printf '%s\n' "${consumed_output}" >&2
              echo "release_state_conflict: unable to resolve consumed receipt state" >&2
              exit 1
            fi
          fi

          helper_source_tag=""
          helper_source_mode=""
          helper_source_commit=""
          if [[ "${consumed_state}" == present ]]; then
            if [[ "${tag_status}" != matching ]]; then
              echo "release_state_conflict: consumed receipt exists without a matching product tag" >&2
              exit 1
            fi
            if [[ "${release_state}" == draft ]]; then
              echo "release_state_conflict: consumed receipt exists for a draft Release" >&2
              exit 1
            fi
            release_state=published
            enabled=false
            reason=already_consumed
            echo "RELEASE_TERMINAL state=consumed version=${version} merge_sha=${merge_sha}"
          else
            if [[ "${EVENT_NAME}" == workflow_dispatch ]]; then
              echo "RELEASE_RECOVERY_BOUND_REPAIR version=${version} merge_sha=${merge_sha}"
            fi
            python3 .github/scripts/release_reservation.py receipt \
              --state bound --version "${version}" --merge-sha "${merge_sha}" \
              --reservation-id "${reservation_id}" --owner "${reservation_owner}" \
              --claim-key "${claim_key}" --boundary-token "${boundary_token}" \
              --reservation-ref "${reservation_ref}" --repository "${GITHUB_REPOSITORY}" \
              --token "${GH_TOKEN}" --api-root "${GITHUB_API_URL}" >/dev/null
            bound_state=present
            if [[ "${release_state}" == published ]]; then
              python3 .github/scripts/release_reservation.py receipt \
                --state consumed --version "${version}" --merge-sha "${merge_sha}" \
                --reservation-id "${reservation_id}" --owner "${reservation_owner}" \
                --claim-key "${claim_key}" --boundary-token "${boundary_token}" \
                --reservation-ref "${reservation_ref}" --repository "${GITHUB_REPOSITORY}" \
                --token "${GH_TOKEN}" --api-root "${GITHUB_API_URL}" >/dev/null
              enabled=false
              reason=already_published
            else
              bootstrap_helper_tag="$(python3 -c 'import json; print(json.load(open("packaging/macos/snapshot-components.lock.json", encoding="utf-8"))["bootstrap_release_tag"])')"
              release_list_json="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease,publishedAt)"
              helper_candidates_json="$(printf '%s' "${release_list_json}" | python3 .github/scripts/release_helper.py candidates --version "${version}" --bootstrap-tag "${bootstrap_helper_tag}")"
              source_download_dir="${RUNNER_TEMP}/snapshot-helper-downloads"
              source_artifact_dir="${RUNNER_TEMP}/snapshot-helper-source"
              mkdir -p "${source_download_dir}" "${source_artifact_dir}"
              while IFS= read -r candidate; do
                [[ -n "${candidate}" ]] || continue
                source_release_json=""
                if ! source_release_json="$(gh release view "${candidate}" --json isDraft,isPrerelease,assets 2>&1)"; then
                  if printf '%s' "${source_release_json}" | grep -qiE '404|not found'; then
                    echo "helper candidate is unavailable: ${candidate}"
                    continue
                  fi
                  printf '%s\n' "${source_release_json}" >&2
                  echo "unable to resolve helper candidate Release: ${candidate}" >&2
                  exit 1
                fi
                source_is_draft="$(printf '%s' "${source_release_json}" | jq -r '.isDraft | tostring')"
                source_is_prerelease="$(printf '%s' "${source_release_json}" | jq -r '.isPrerelease | tostring')"
                if [[ "${source_is_draft}" != false || "${source_is_prerelease}" != true ]]; then
                  echo "skipping non-approved helper candidate: ${candidate}"
                  continue
                fi
                helper_version="${candidate#v}"
                missing_assets="$(printf '%s' "${source_release_json}" | python3 -c 'import json,sys; names={a.get("name") for a in json.load(sys.stdin).get("assets", []) if isinstance(a,dict)}; print("\n".join(name for name in sys.argv[1:] if name not in names))' "TelevyBackup-${helper_version}.dmg" "BUILD-MANIFEST.json" "SHA256SUMS")"
                if [[ -n "${missing_assets}" ]]; then
                  echo "skipping helper candidate with incomplete assets: ${candidate}"
                  continue
                fi
                if ! git fetch --force origin "refs/tags/${candidate}:refs/tags/${candidate}" || \
                  ! python3 .github/scripts/release_chain.py verify-tag-provenance --tag "${candidate}"; then
                  echo "skipping helper candidate without protected annotated-tag provenance: ${candidate}"
                  continue
                fi
                candidate_asset_dir="${source_download_dir}/${helper_version}"
                mkdir -p "${candidate_asset_dir}"
                if ! gh release download "${candidate}" --repo "$GITHUB_REPOSITORY" \
                  --pattern "TelevyBackup-${helper_version}.dmg" \
                  --pattern "BUILD-MANIFEST.json" --pattern "SHA256SUMS" \
                  --dir "${candidate_asset_dir}"; then
                  echo "skipping helper candidate whose assets could not be downloaded: ${candidate}"
                  continue
                fi
                source_tag_commit="$(git rev-list -n 1 "${candidate}^{commit}" 2>/dev/null || true)"
                if [[ -z "${source_tag_commit}" ]]; then
                  echo "skipping helper candidate without a resolvable tag commit: ${candidate}"
                  continue
                fi
                if ! python3 .github/scripts/release_helper.py verify-assets \
                  --asset-dir "${candidate_asset_dir}" \
                  --lock packaging/macos/snapshot-components.lock.json \
                  --source-tag "${candidate}" \
                  --expected-source-commit "${source_tag_commit}"; then
                  echo "skipping helper candidate with incompatible immutable assets: ${candidate}"
                  continue
                fi
                cp "${candidate_asset_dir}/TelevyBackup-${helper_version}.dmg" "${source_artifact_dir}/"
                cp "${candidate_asset_dir}/BUILD-MANIFEST.json" "${source_artifact_dir}/"
                cp "${candidate_asset_dir}/SHA256SUMS" "${source_artifact_dir}/"
                helper_source_tag="${candidate}"
                helper_source_commit="${source_tag_commit}"
                helper_source_mode="reuse"
                echo "approved Snapshot Access helper source: ${helper_source_tag}"
                break
              done < <(printf '%s' "${helper_candidates_json}" | jq -r '.candidates[]')
              if [[ -n "${helper_source_tag}" ]]; then
                if [[ "${HELPER_MODE}" == bootstrap ]]; then
                  echo "approved helper Release exists; refusing one-time bootstrap: ${helper_source_tag}" >&2
                  exit 1
                fi
              elif [[ "${HELPER_MODE}" == bootstrap ]]; then
                helper_source_mode="bootstrap"
                echo "SNAPSHOT_ACCESS_HELPER_MODE=one-time-bootstrap version=${version} reason=no-approved-helper-release"
              else
                echo "no approved Snapshot Access helper Release; rerun same-SHA recovery with helper_mode=bootstrap" >&2
                exit 1
              fi
              if [[ "${channel}" == prod && "${helper_source_mode}" == bootstrap ]]; then
                echo "stable release requires a previously published RC Universal Snapshot Access helper" >&2
                exit 1
              fi
              enabled=true
              reason=product_identity
            fi
          fi
          {
            echo "enabled=${enabled}"
            echo "identity_status=resolved"
            echo "source_sha=${source_sha}"
            echo "preparation_commit_sha=${preparation_sha}"
            echo "merge_sha=${merge_sha}"
            echo "merge_commit_sha=${merge_sha}"
            echo "head_sha=${pull_request_head_sha}"
            echo "labels=${labels_json}"
            echo "components=${components_json}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "channel=${channel}"
            echo "release_mode=${release_mode}"
            echo "reason=${reason}"
            echo "release_state=${release_state}"
            echo "tag_status=${tag_status}"
            echo "helper_source_mode=${helper_source_mode}"
            echo "reservation_id=${reservation_id}"
            echo "reservation_ref=${reservation_ref}"
            echo "reservation_owner=${reservation_owner}"
            echo "claim_key=${claim_key}"
            echo "boundary_token=${boundary_token}"
            echo "release_type=${release_type}"
            echo "covered_merge_sha=${covered_merge_sha}"
            echo "bound_identity=${bound_state}"
            echo "pull_request=${pull_request}"
            echo "helper_source_tag=${helper_source_tag}"
            echo "helper_source_commit=${helper_source_commit}"
          } >> "$GITHUB_OUTPUT"
          echo "RELEASE_IDENTITY status=resolved version=${version} channel=${channel} merge_sha=${merge_sha} tag=${tag} reservation_ref=${reservation_ref}"

      - name: Upload immutable helper source
        if: steps.release.outputs.identity_status == 'resolved' && steps.release.outputs.helper_source_mode == 'reuse'
        id: upload-helper-source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snapshot-helper-source
          path: ${{ runner.temp }}/snapshot-helper-source
          if-no-files-found: error

      - name: Write release intent snapshot
        if: steps.release.outputs.identity_status == 'resolved'
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          PREPARATION_SHA: ${{ steps.release.outputs.preparation_commit_sha }}
          MERGE_SHA: ${{ steps.release.outputs.merge_sha }}
          HEAD_SHA: ${{ steps.release.outputs.head_sha }}
          LABELS_JSON: ${{ steps.release.outputs.labels }}
          COMPONENTS_JSON: ${{ steps.release.outputs.components }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_MODE: ${{ steps.release.outputs.release_mode }}
          RESERVATION_ID: ${{ steps.release.outputs.reservation_id }}
          RESERVATION_REF: ${{ steps.release.outputs.reservation_ref }}
          OWNER: ${{ steps.release.outputs.reservation_owner }}
          CLAIM_KEY: ${{ steps.release.outputs.claim_key }}
          BOUNDARY_TOKEN: ${{ steps.release.outputs.boundary_token }}
          RELEASE_TYPE: ${{ steps.release.outputs.release_type }}
          COVERED_MERGE_SHA: ${{ steps.release.outputs.covered_merge_sha }}
          HELPER_SOURCE_MODE: ${{ steps.release.outputs.helper_source_mode }}
          HELPER_SOURCE_TAG: ${{ steps.release.outputs.helper_source_tag }}
          HELPER_SOURCE_COMMIT: ${{ steps.release.outputs.helper_source_commit }}
          HELPER_SOURCE_ARTIFACT_DIGEST: ${{ steps.upload-helper-source.outputs.artifact-digest }}
          PULL_REQUEST: ${{ steps.release.outputs.pull_request }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          jq -n \
            --arg source_sha "${SOURCE_SHA}" --arg merge_sha "${MERGE_SHA}" --arg version "${VERSION}" \
            --arg channel "${CHANNEL}" --arg mode "${RELEASE_MODE}" --arg reservation_id "${RESERVATION_ID}" \
            --arg reservation_ref "${RESERVATION_REF}" --arg owner "${OWNER}" --arg claim_key "${CLAIM_KEY}" \
            --arg boundary_token "${BOUNDARY_TOKEN}" --arg run_url "${RUN_URL}" --arg run_id "${GITHUB_RUN_ID}" --arg run_attempt "${GITHUB_RUN_ATTEMPT}" --arg release_type "${RELEASE_TYPE}" \
            --arg preparation_sha "${PREPARATION_SHA}" --arg covered_merge_sha "${COVERED_MERGE_SHA}" --arg pull_request "${PULL_REQUEST}" \
            --arg head_sha "${HEAD_SHA}" --argjson labels "${LABELS_JSON}" --argjson components "${COMPONENTS_JSON}" \
            --arg tag_owner "protected-release-automation" \
            --arg helper_source_mode "${HELPER_SOURCE_MODE}" --arg helper_source_tag "${HELPER_SOURCE_TAG}" \
            --arg helper_source_commit "${HELPER_SOURCE_COMMIT}" --arg helper_source_artifact_digest "${HELPER_SOURCE_ARTIFACT_DIGEST}" \
            '{schema_version:1,pull_request:$pull_request,source_sha:$source_sha,merge_sha:$merge_sha,merge_commit_sha:$merge_sha,head_sha:$head_sha,branch_head:$merge_sha,release_mode:$mode,preparation_commit_sha:$preparation_sha,covered_merge_sha:$covered_merge_sha,labels:$labels,type:$release_type,channel:$channel,components:$components,version:$version,tag:("v"+$version),tag_target_sha:$merge_sha,tag_owner:$tag_owner,helper:{mode:$helper_source_mode,source_tag:$helper_source_tag,source_commit:$helper_source_commit,artifact_digest:$helper_source_artifact_digest},reservation:{id:$reservation_id,ref:$reservation_ref,owner:$owner,claim_key:$claim_key,boundary_token:$boundary_token,state:"bound",merge_commit_sha:$merge_sha},provenance:{signature:"github-native-verified",signature_verified:true,provenance_verified:true,tag_owner:$tag_owner,identity:"release_chain_and_reservation_refs"},artifact_names:(if $helper_source_mode == "reuse" then ["snapshot-helper-source","release-package-arm64","release-package-x86_64","release-assets"] else ["release-package-arm64","release-package-x86_64","release-assets"] end),run_id:$run_id,run_attempt:$run_attempt,run_url:$run_url,recovery_instruction:("workflow_dispatch operation=recover commit_sha="+$merge_sha+" helper_mode=bootstrap only when no-approved-helper-release")}' \
            > release-intent.json

      - name: Upload locked release intent
        if: steps.release.outputs.identity_status == 'resolved'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-intent
          path: release-intent.json
          if-no-files-found: error

  build-arm64:
    name: Build arm64 package
    needs: resolve
    if: needs.resolve.outputs.enabled == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.merge_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.91.0
          targets: aarch64-apple-darwin
      - name: Cache macOS arm64 build dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pip
            ~/Library/Caches/pip
            target
            crates/mtproto-helper/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-macos-${{ hashFiles('Cargo.lock', 'crates/mtproto-helper/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-macos-
      - name: Download immutable Snapshot Access helper source
        if: needs.resolve.outputs.helper_source_mode == 'reuse'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: snapshot-helper-source
          path: ${{ runner.temp }}/snapshot-helper
      - name: Extract and verify immutable Snapshot Access helper
        if: needs.resolve.outputs.helper_source_mode == 'reuse'
        env:
          HELPER_SOURCE_TAG: ${{ needs.resolve.outputs.helper_source_tag }}
          HELPER_SOURCE_COMMIT: ${{ needs.resolve.outputs.helper_source_commit }}
          POLICY_SHA: ${{ needs.resolve.outputs.policy_sha }}
        run: |
          set -euo pipefail
          helper_version="${HELPER_SOURCE_TAG#v}"
          python3 .github/scripts/release_helper.py verify-assets \
            --asset-dir "$RUNNER_TEMP/snapshot-helper" \
            --lock packaging/macos/snapshot-components.lock.json \
            --source-tag "$HELPER_SOURCE_TAG" \
            --expected-source-commit "$HELPER_SOURCE_COMMIT"
          bash scripts/macos/extract-snapshot-access-helper.sh \
            --dmg "$RUNNER_TEMP/snapshot-helper/TelevyBackup-${helper_version}.dmg" \
            --output-dir "$RUNNER_TEMP/snapshot-helper"
          test -n "${POLICY_SHA}"
          git fetch --force origin main
          git cat-file -e "${POLICY_SHA}^{commit}"
          policy_verify_component_identity="$RUNNER_TEMP/verify-component-identity.sh"
          git show "${POLICY_SHA}:scripts/macos/verify-component-identity.sh" > "${policy_verify_component_identity}"
          chmod 755 "${policy_verify_component_identity}"
          echo "TELEVYBACKUP_POLICY_VERIFY_COMPONENT_IDENTITY=${policy_verify_component_identity}" >> "$GITHUB_ENV"
          bash "${policy_verify_component_identity}" \
            --reference "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" \
            --candidate "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" \
            --manifest "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json"
          echo "TELEVYBACKUP_SNAPSHOT_ACCESS_BUNDLE=$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" >> "$GITHUB_ENV"
      - name: Build arm64 package (up to 2 attempts)
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if bash scripts/macos/package-release.sh --mode release --arch arm64 --output-dir dist/arm64; then
              exit 0
            fi
            if [[ "$attempt" -eq 2 ]]; then
              echo "arm64 package build failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "arm64 package build failed; retrying (attempt 2/2)" >&2
          done
      - name: Verify reused Snapshot Access identity
        if: needs.resolve.outputs.helper_source_mode == 'reuse'
        run: bash "$TELEVYBACKUP_POLICY_VERIFY_COMPONENT_IDENTITY" --reference "$TELEVYBACKUP_SNAPSHOT_ACCESS_BUNDLE" --candidate "dist/arm64/TelevyBackup.app/Contents/Library/LoginItems/TelevyBackup Snapshot Access.app" --manifest "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-package-arm64
          path: dist/arm64

  build-x86_64:
