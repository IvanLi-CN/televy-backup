name: Release Product

on:
  workflow_run:
    workflows: [CI (main)]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Release operation
        required: true
        type: choice
        options: [recover]
        default: recover
      commit_sha:
        description: Merged main SHA to recover
        required: true
        type: string

concurrency:
  group: release-product-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    name: Resolve merged product release
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.release.outputs.enabled }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
      reason: ${{ steps.release.outputs.reason }}
      release_state: ${{ steps.release.outputs.release_state }}
      tag_status: ${{ steps.release.outputs.tag_status }}
      helper_source_tag: ${{ steps.release.outputs.helper_source_tag }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable merged identity
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event || 'workflow_dispatch' }}
          TARGET_INPUT: ${{ github.event.workflow_run.head_sha || inputs.commit_sha }}
          OPERATION: ${{ inputs.operation || 'publish' }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin main --tags
          main_sha="$(git rev-parse origin/main)"
          test -n "${TARGET_INPUT}"
          if [[ "${EVENT_NAME}" == workflow_run ]]; then
            test "${WORKFLOW_CONCLUSION}" = success
            test "${WORKFLOW_EVENT}" = push
            test "${TARGET_INPUT}" = "${main_sha}"
          else
            test "${OPERATION}" = recover
            git merge-base --is-ancestor "${TARGET_INPUT}" "${main_sha}"
          fi
          git checkout --detach "${TARGET_INPUT}"
          prepared_json="$(python3 .github/scripts/release_chain.py verify-merged --commit "${TARGET_INPUT}")"
          prepared="$(printf '%s' "${prepared_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("prepared", "false"))')"
          if [[ "${prepared}" != true ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=$(printf '%s' "${prepared_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("reason", "not_product_merge"))')" >> "$GITHUB_OUTPUT"
            echo "Product release skipped for ${TARGET_INPUT}: ${prepared_json}"
            exit 0
          fi
          version="$(printf '%s' "${prepared_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          tag="$(printf '%s' "${prepared_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag"])')"
          channel="$(python3 scripts/product-version.py --mode release --source-sha "${TARGET_INPUT}" --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["channel"])')"
          test "${version}" = "$(python3 scripts/product-version.py --mode release --source-sha "${TARGET_INPUT}")"
          helper_source_tag=""
          core_version="${version%%-rc.*}"
          if [[ "${channel}" == rc ]]; then
            rc_number="${version##*-rc.}"
            if ((rc_number > 1)); then
              helper_source_tag="v${core_version}-rc.1"
            fi
          else
            helper_source_tag="v${core_version}-rc.1"
          fi
          if [[ -n "${helper_source_tag}" ]]; then
            helper_version="${helper_source_tag#v}"
            source_release_json="$(gh release view "${helper_source_tag}" --json isDraft,isPrerelease,assets)"
            source_is_draft="$(printf '%s' "${source_release_json}" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())')"
            source_is_prerelease="$(printf '%s' "${source_release_json}" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["isPrerelease"]).lower())')"
            if [[ "${source_is_draft}" != false || "${source_is_prerelease}" != true ]]; then
              echo "helper source must be a published prerelease: ${helper_source_tag}" >&2
              exit 1
            fi
            printf '%s' "${source_release_json}" | python3 -c 'import json,sys; names={a["name"] for a in json.load(sys.stdin)["assets"]}; expected=sys.argv[1:]; missing=[name for name in expected if name not in names]; print("\n".join(missing)); sys.exit(bool(missing))' "TelevyBackup-${helper_version}.dmg" "BUILD-MANIFEST.json" "SHA256SUMS" || {
              echo "helper source release is missing its Universal DMG, BUILD-MANIFEST.json, or SHA256SUMS: ${helper_source_tag}" >&2
              exit 1
            }
          elif [[ "${channel}" == stable ]]; then
            echo "stable release requires a previously published RC Universal Snapshot Access helper" >&2
            exit 1
          fi
          sequence_json="$(python3 .github/scripts/release_chain.py verify-release-sequence --version "${version}" --expected-sha "${TARGET_INPUT}")"
          tag_status="$(printf '%s' "${sequence_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          release_state=missing
          release_output=""
          if release_output="$(gh release view "${tag}" --json isDraft 2>&1)"; then
            if [[ "${tag_status}" != matching ]]; then
              echo "release_state_conflict: Release exists without a matching product tag" >&2
              exit 1
            fi
            is_draft="$(printf '%s' "${release_output}" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())')"
            case "${is_draft}" in
              true) release_state=draft ;;
              false) release_state=published ;;
              *) echo "release_state_conflict: invalid GitHub Release state" >&2; exit 1 ;;
            esac
          else
            if ! printf '%s' "${release_output}" | grep -qiE '404|not found'; then
              printf '%s\n' "${release_output}" >&2
              echo "release_state_conflict: unable to resolve GitHub Release state" >&2
              exit 1
            fi
          fi
          if [[ "${release_state}" == published ]]; then
            {
              echo "enabled=false"
              echo "source_sha=${TARGET_INPUT}"
              echo "version=${version}"
              echo "tag=${tag}"
              echo "channel=${channel}"
              echo "reason=already_published"
              echo "release_state=published"
              echo "tag_status=${tag_status}"
              echo "helper_source_tag=${helper_source_tag}"
            } >> "$GITHUB_OUTPUT"
            echo "Product release already published for ${tag}; no rebuild or asset overwrite"
            exit 0
          fi
          {
            echo "enabled=true"
            echo "source_sha=${TARGET_INPUT}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "channel=${channel}"
            echo "reason=product_merge"
            echo "release_state=${release_state}"
            echo "tag_status=${tag_status}"
            echo "helper_source_tag=${helper_source_tag}"
          } >> "$GITHUB_OUTPUT"
          echo "RELEASE_TARGET_SHA=${TARGET_INPUT} RELEASE_VERSION=${version} RELEASE_TAG=${tag}"

  build-arm64:
    name: Build arm64 package
    needs: resolve
    if: needs.resolve.outputs.enabled == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0
          targets: aarch64-apple-darwin
      - name: Fetch approved Snapshot Access helper
        if: needs.resolve.outputs.helper_source_tag != ''
        env:
          HELPER_SOURCE_TAG: ${{ needs.resolve.outputs.helper_source_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper_version="${HELPER_SOURCE_TAG#v}"
          mkdir -p "$RUNNER_TEMP/snapshot-helper-mount" "$RUNNER_TEMP/snapshot-helper"
          gh release download "$HELPER_SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "TelevyBackup-${helper_version}.dmg" --pattern "BUILD-MANIFEST.json" --pattern "SHA256SUMS" --dir "$RUNNER_TEMP/snapshot-helper"
          source_tag_commit="$(git rev-list -n 1 "${HELPER_SOURCE_TAG}^{commit}")"
          python3 - "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json" "$RUNNER_TEMP/snapshot-helper/SHA256SUMS" "$RUNNER_TEMP/snapshot-helper/TelevyBackup-${helper_version}.dmg" "$helper_version" "$source_tag_commit" <<'PY'
          import hashlib, json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          assert manifest["release_version"] == sys.argv[4]
          assert manifest["source_commit"] == sys.argv[5]
          name = sys.argv[3].rsplit('/', 1)[-1]
          asset = next(item for item in manifest["assets"] if item["name"] == name)
          with open(sys.argv[3], "rb") as handle:
              data = handle.read()
          digest = hashlib.sha256(data).hexdigest()
          assert asset["sha256"] == digest
          assert asset["bytes"] == len(data)
          checksum = next(line.split()[0] for line in open(sys.argv[2], encoding="utf-8") if line.rstrip().endswith("  " + name))
          assert checksum == digest
          PY
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/snapshot-helper-mount" "$RUNNER_TEMP/snapshot-helper/TelevyBackup-${helper_version}.dmg"
          ditto "$RUNNER_TEMP/snapshot-helper-mount/TelevyBackup.app/Contents/Library/LoginItems/TelevyBackup Snapshot Access.app" "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app"
          hdiutil detach "$RUNNER_TEMP/snapshot-helper-mount"
          bash scripts/macos/verify-component-identity.sh \
            --reference "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" \
            --candidate "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" \
            --manifest "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json"
          echo "TELEVYBACKUP_SNAPSHOT_ACCESS_BUNDLE=$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" >> "$GITHUB_ENV"
      - run: bash scripts/macos/package-release.sh --mode release --arch arm64 --output-dir dist/arm64
      - name: Verify reused Snapshot Access identity
        if: needs.resolve.outputs.helper_source_tag != ''
        run: bash scripts/macos/verify-component-identity.sh --reference "$TELEVYBACKUP_SNAPSHOT_ACCESS_BUNDLE" --candidate "dist/arm64/TelevyBackup.app/Contents/Library/LoginItems/TelevyBackup Snapshot Access.app" --manifest "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package-arm64
          path: dist/arm64

  build-x86_64:
    name: Build x86_64 package
    needs: resolve
    if: needs.resolve.outputs.enabled == 'true'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0
          targets: x86_64-apple-darwin
      - name: Fetch approved Snapshot Access helper
        if: needs.resolve.outputs.helper_source_tag != ''
        env:
          HELPER_SOURCE_TAG: ${{ needs.resolve.outputs.helper_source_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper_version="${HELPER_SOURCE_TAG#v}"
          mkdir -p "$RUNNER_TEMP/snapshot-helper-mount" "$RUNNER_TEMP/snapshot-helper"
          gh release download "$HELPER_SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "TelevyBackup-${helper_version}.dmg" --pattern "BUILD-MANIFEST.json" --pattern "SHA256SUMS" --dir "$RUNNER_TEMP/snapshot-helper"
          source_tag_commit="$(git rev-list -n 1 "${HELPER_SOURCE_TAG}^{commit}")"
          python3 - "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json" "$RUNNER_TEMP/snapshot-helper/SHA256SUMS" "$RUNNER_TEMP/snapshot-helper/TelevyBackup-${helper_version}.dmg" "$helper_version" "$source_tag_commit" <<'PY'
          import hashlib, json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          assert manifest["release_version"] == sys.argv[4]
          assert manifest["source_commit"] == sys.argv[5]
          name = sys.argv[3].rsplit('/', 1)[-1]
          asset = next(item for item in manifest["assets"] if item["name"] == name)
          with open(sys.argv[3], "rb") as handle:
              data = handle.read()
          digest = hashlib.sha256(data).hexdigest()
          assert asset["sha256"] == digest
          assert asset["bytes"] == len(data)
          checksum = next(line.split()[0] for line in open(sys.argv[2], encoding="utf-8") if line.rstrip().endswith("  " + name))
          assert checksum == digest
          PY
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/snapshot-helper-mount" "$RUNNER_TEMP/snapshot-helper/TelevyBackup-${helper_version}.dmg"
          ditto "$RUNNER_TEMP/snapshot-helper-mount/TelevyBackup.app/Contents/Library/LoginItems/TelevyBackup Snapshot Access.app" "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app"
          hdiutil detach "$RUNNER_TEMP/snapshot-helper-mount"
          bash scripts/macos/verify-component-identity.sh \
            --reference "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" \
            --candidate "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" \
            --manifest "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json"
          echo "TELEVYBACKUP_SNAPSHOT_ACCESS_BUNDLE=$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" >> "$GITHUB_ENV"
      - run: bash scripts/macos/package-release.sh --mode release --arch x86_64 --output-dir dist/x86_64
      - name: Verify reused Snapshot Access identity
        if: needs.resolve.outputs.helper_source_tag != ''
        run: bash scripts/macos/verify-component-identity.sh --reference "$TELEVYBACKUP_SNAPSHOT_ACCESS_BUNDLE" --candidate "dist/x86_64/TelevyBackup.app/Contents/Library/LoginItems/TelevyBackup Snapshot Access.app" --manifest "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-package-x86_64
          path: dist/x86_64

  assemble:
    name: Assemble Universal 2 package
    needs: [resolve, build-arm64, build-x86_64]
    if: needs.resolve.outputs.enabled == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-package-arm64
          path: dist/arm64
      - uses: actions/download-artifact@v4
        with:
          name: release-package-x86_64
          path: dist/x86_64
      - name: Fetch approved Snapshot Access helper for final assembly
        if: needs.resolve.outputs.helper_source_tag != ''
        env:
          HELPER_SOURCE_TAG: ${{ needs.resolve.outputs.helper_source_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helper_version="${HELPER_SOURCE_TAG#v}"
          mkdir -p "$RUNNER_TEMP/snapshot-helper-mount" "$RUNNER_TEMP/snapshot-helper"
          gh release download "$HELPER_SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "TelevyBackup-${helper_version}.dmg" --pattern "BUILD-MANIFEST.json" --pattern "SHA256SUMS" --dir "$RUNNER_TEMP/snapshot-helper"
          source_tag_commit="$(git rev-list -n 1 "${HELPER_SOURCE_TAG}^{commit}")"
          python3 - "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json" "$RUNNER_TEMP/snapshot-helper/SHA256SUMS" "$RUNNER_TEMP/snapshot-helper/TelevyBackup-${helper_version}.dmg" "$helper_version" "$source_tag_commit" <<'PY'
          import hashlib, json, sys
          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          assert manifest["release_version"] == sys.argv[4]
          assert manifest["source_commit"] == sys.argv[5]
          name = sys.argv[3].rsplit('/', 1)[-1]
          asset = next(item for item in manifest["assets"] if item["name"] == name)
          with open(sys.argv[3], "rb") as handle:
              data = handle.read()
          digest = hashlib.sha256(data).hexdigest()
          assert asset["sha256"] == digest
          assert asset["bytes"] == len(data)
          checksum = next(line.split()[0] for line in open(sys.argv[2], encoding="utf-8") if line.rstrip().endswith("  " + name))
          assert checksum == digest
          PY
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/snapshot-helper-mount" "$RUNNER_TEMP/snapshot-helper/TelevyBackup-${helper_version}.dmg"
          ditto "$RUNNER_TEMP/snapshot-helper-mount/TelevyBackup.app/Contents/Library/LoginItems/TelevyBackup Snapshot Access.app" "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app"
          hdiutil detach "$RUNNER_TEMP/snapshot-helper-mount"
          bash scripts/macos/verify-component-identity.sh \
            --reference "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" \
            --candidate "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" \
            --manifest "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json"
      - name: Assemble and validate final assets
        env:
          RUST_TOOLCHAIN: 1.91.0
          HELPER_SOURCE_TAG: ${{ needs.resolve.outputs.helper_source_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist/final
          arm_app="$(find dist/arm64 -maxdepth 1 -type d -name '*.app' -print -quit)"
          x86_app="$(find dist/x86_64 -maxdepth 1 -type d -name '*.app' -print -quit)"
          bash scripts/macos/assemble-universal.sh --mode release --arm64-app "$arm_app" --x86_64-app "$x86_app" --output-dir dist/final
          cp dist/arm64/TelevyBackup-*-arm64.dmg dist/final/
          cp dist/x86_64/TelevyBackup-*-x86_64.dmg dist/final/
          cp dist/arm64/televybackup-tools-*-arm64.tar.gz dist/final/
          cp dist/x86_64/televybackup-tools-*-x86_64.tar.gz dist/final/
          bash scripts/macos/generate-release-manifest.sh --mode release --asset-dir dist/final --source-commit "${{ needs.resolve.outputs.source_sha }}" --packaging-commit "$GITHUB_SHA" --output dist/final/BUILD-MANIFEST.json
          bash scripts/macos/verify-release-assets.sh --mode release --asset-dir dist/final
          if [[ -n "${HELPER_SOURCE_TAG}" ]]; then
            bash scripts/macos/verify-component-identity.sh \
              --reference "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" \
              --candidate "dist/final/TelevyBackup.app/Contents/Library/LoginItems/TelevyBackup Snapshot Access.app" \
              --manifest "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/final

  macos-acceptance:
    name: Require macOS RC acceptance for stable
    needs: [resolve, assemble]
    if: needs.resolve.outputs.enabled == 'true' && needs.resolve.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    environment:
      name: macos-release-acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Verify manual RC1 to RC2 acceptance evidence
        env:
          ACCEPTANCE_EVIDENCE: ${{ vars.TELEVYBACKUP_MACOS_RC_ACCEPTANCE_EVIDENCE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          core_version="${{ needs.resolve.outputs.version }}"
          rc1_tag="v${core_version}-rc.1"
          rc2_tag="v${core_version}-rc.2"
          rc1_json="$(gh release view "$rc1_tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)"
          rc2_json="$(gh release view "$rc2_tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)"
          python3 - "$rc1_json" "$rc2_json" <<'PY'
          import json, sys
          for raw in sys.argv[1:]:
              state = json.loads(raw)
              assert state["isDraft"] is False
              assert state["isPrerelease"] is True
          PY
          python3 .github/scripts/verify-macos-rc-acceptance.py \
            --evidence "$ACCEPTANCE_EVIDENCE" \
            --manifest release-assets/BUILD-MANIFEST.json \
            --stable-version "$core_version" \
            --rc1-tag "$rc1_tag" \
            --rc2-tag "$rc2_tag"

  publish:
    name: Publish GitHub Release
    needs: [resolve, assemble, macos-acceptance]
    if: >-
      always() && needs.resolve.outputs.enabled == 'true' &&
      needs.assemble.result == 'success' &&
      (needs.resolve.outputs.channel != 'stable' || needs.macos-acceptance.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_TAG: ${{ needs.resolve.outputs.tag }}
      PRODUCT_VERSION: ${{ needs.resolve.outputs.version }}
      PRODUCT_CHANNEL: ${{ needs.resolve.outputs.channel }}
      RELEASE_SHA: ${{ needs.resolve.outputs.source_sha }}
      RELEASE_STATE: ${{ needs.resolve.outputs.release_state }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Create or verify immutable tag
        run: |
          set -euo pipefail
          git fetch --force origin main --tags
          python3 .github/scripts/release_chain.py verify-release-sequence --version "${PRODUCT_VERSION}" --expected-sha "${RELEASE_SHA}"
          tag_args=(verify-tag --version "${PRODUCT_VERSION}" --expected-sha "${RELEASE_SHA}" --allow-existing)
          tag_json="$(python3 .github/scripts/release_chain.py "${tag_args[@]}")"
          status="$(printf '%s' "${tag_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          if [[ "${status}" == available ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${PRODUCT_TAG}" "${RELEASE_SHA}" -m "${PRODUCT_TAG}"
            git push origin "refs/tags/${PRODUCT_TAG}"
          fi
          python3 .github/scripts/release_chain.py verify-tag --version "${PRODUCT_VERSION}" --expected-sha "${RELEASE_SHA}" --allow-existing
      - name: Create or update GitHub Release
        run: |
          set -euo pipefail
          runtime_state="${RELEASE_STATE}"
          release_output=""
          if release_output="$(gh release view "${PRODUCT_TAG}" --json isDraft 2>&1)"; then
            is_draft="$(printf '%s' "${release_output}" | python3 -c 'import json,sys; print(str(json.load(sys.stdin)["isDraft"]).lower())')"
            case "${is_draft}" in
              true) runtime_state=draft ;;
              false) runtime_state=published ;;
              *) echo "release_state_conflict: invalid GitHub Release state" >&2; exit 1 ;;
            esac
          else
            if ! printf '%s' "${release_output}" | grep -qiE '404|not found'; then
              printf '%s\n' "${release_output}" >&2
              echo "release_state_conflict: unable to resolve GitHub Release state" >&2
              exit 1
            fi
          fi
          if [[ "${runtime_state}" == published ]]; then
            echo "Product release became published for ${PRODUCT_TAG}; no asset overwrite"
            exit 0
          fi
          release_files=()
          while IFS= read -r -d '' asset; do
            release_files+=("$asset")
          done < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          ((${#release_files[@]} > 0))
          if [[ "${runtime_state}" == draft ]]; then
            gh release upload "${PRODUCT_TAG}" "${release_files[@]}" --clobber
            gh release edit "${PRODUCT_TAG}" --draft=false
          else
            test "${runtime_state}" = missing
            flags=(--verify-tag --title "${PRODUCT_TAG}" --generate-notes)
            [[ "${PRODUCT_CHANNEL}" == rc ]] && flags+=(--prerelease)
            gh release create "${PRODUCT_TAG}" "${release_files[@]}" "${flags[@]}"
          fi
  skipped:
    name: Release skipped
    needs: resolve
    if: needs.resolve.outputs.enabled != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Release skipped: ${{ needs.resolve.outputs.reason }}"
