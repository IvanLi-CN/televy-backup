name: Release Product

on:
  workflow_run:
    workflows: [CI (main)]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Release operation
        required: true
        type: choice
        options: [recover]
        default: recover
      commit_sha:
        description: Merged main SHA to recover
        required: true
        type: string

concurrency:
  group: release-product-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  resolve:
    name: Resolve merged product release
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.release.outputs.enabled }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
      pr_number: ${{ steps.release.outputs.pr_number }}
      reason: ${{ steps.release.outputs.reason }}
    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable merged identity
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event || 'workflow_dispatch' }}
          TARGET_INPUT: ${{ github.event.workflow_run.head_sha || inputs.commit_sha }}
          OPERATION: ${{ inputs.operation || 'publish' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin main --tags
          main_sha="$(git rev-parse origin/main)"
          test -n "${TARGET_INPUT}"
          if [[ "${EVENT_NAME}" == workflow_run ]]; then
            test "${WORKFLOW_CONCLUSION}" = success
            test "${WORKFLOW_EVENT}" = push
            test "${TARGET_INPUT}" = "${main_sha}"
          else
            test "${OPERATION}" = recover
            git merge-base --is-ancestor "${TARGET_INPUT}" "${main_sha}"
          fi
          git checkout --detach "${TARGET_INPUT}"
          prepared_json="$(python3 .github/scripts/release_chain.py verify-merged --commit "${TARGET_INPUT}")"
          prepared="$(printf '%s' "${prepared_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("prepared", "false"))')"
          if [[ "${prepared}" != true ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=$(printf '%s' "${prepared_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("reason", "not_product_merge"))')" >> "$GITHUB_OUTPUT"
            echo "Product release skipped for ${TARGET_INPUT}: ${prepared_json}"
            exit 0
          fi
          version="$(printf '%s' "${prepared_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          tag="$(printf '%s' "${prepared_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag"])')"
          channel="$(python3 scripts/product-version.py --mode release --source-sha "${TARGET_INPUT}" --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["channel"])')"
          test "${version}" = "$(python3 scripts/product-version.py --mode release --source-sha "${TARGET_INPUT}")"
          pr_number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_INPUT}/pulls" --jq '.[0].number // empty' || true)"
          {
            echo "enabled=true"
            echo "source_sha=${TARGET_INPUT}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "channel=${channel}"
            echo "pr_number=${pr_number}"
            echo "reason=product_merge"
          } >> "$GITHUB_OUTPUT"
          echo "RELEASE_TARGET_SHA=${TARGET_INPUT} RELEASE_VERSION=${version} RELEASE_TAG=${tag}"
          tag_args=(verify-tag --version "${version}" --expected-sha "${TARGET_INPUT}")
          [[ "${OPERATION}" == recover ]] && tag_args+=(--allow-existing)
          python3 .github/scripts/release_chain.py "${tag_args[@]}"

  build-arm64:
    name: Build arm64 package
    needs: resolve
    if: needs.resolve.outputs.enabled == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0
          targets: aarch64-apple-darwin
      - run: bash scripts/macos/package-release.sh --mode release --arch arm64 --output-dir dist/arm64
      - uses: actions/upload-artifact@v4
        with:
          name: release-package-arm64
          path: dist/arm64

  build-x86_64:
    name: Build x86_64 package
    needs: resolve
    if: needs.resolve.outputs.enabled == 'true'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0
          targets: x86_64-apple-darwin
      - run: bash scripts/macos/package-release.sh --mode release --arch x86_64 --output-dir dist/x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: release-package-x86_64
          path: dist/x86_64

  assemble:
    name: Assemble Universal 2 package
    needs: [resolve, build-arm64, build-x86_64]
    if: needs.resolve.outputs.enabled == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-package-arm64
          path: dist/arm64
      - uses: actions/download-artifact@v4
        with:
          name: release-package-x86_64
          path: dist/x86_64
      - name: Assemble and validate final assets
        env:
          RUST_TOOLCHAIN: 1.91.0
        run: |
          set -euo pipefail
          mkdir -p dist/final
          arm_app="$(find dist/arm64 -maxdepth 1 -type d -name '*.app' -print -quit)"
          x86_app="$(find dist/x86_64 -maxdepth 1 -type d -name '*.app' -print -quit)"
          bash scripts/macos/assemble-universal.sh --mode release --arm64-app "$arm_app" --x86_64-app "$x86_app" --output-dir dist/final
          cp dist/arm64/TelevyBackup-*-arm64.dmg dist/final/
          cp dist/x86_64/TelevyBackup-*-x86_64.dmg dist/final/
          cp dist/arm64/televybackup-tools-*-arm64.tar.gz dist/final/
          cp dist/x86_64/televybackup-tools-*-x86_64.tar.gz dist/final/
          bash scripts/macos/generate-release-manifest.sh --mode release --asset-dir dist/final --source-commit "${{ needs.resolve.outputs.source_sha }}" --packaging-commit "$GITHUB_SHA" --output dist/final/BUILD-MANIFEST.json
          bash scripts/macos/verify-release-assets.sh --mode release --asset-dir dist/final
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/final

  publish:
    name: Publish GitHub Release
    needs: [resolve, assemble]
    if: needs.resolve.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_TAG: ${{ needs.resolve.outputs.tag }}
      PRODUCT_VERSION: ${{ needs.resolve.outputs.version }}
      PRODUCT_CHANNEL: ${{ needs.resolve.outputs.channel }}
      RELEASE_SHA: ${{ needs.resolve.outputs.source_sha }}
      PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
      OPERATION: ${{ inputs.operation || 'publish' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets
      - name: Create or verify immutable tag
        run: |
          set -euo pipefail
          tag_args=(verify-tag --version "${PRODUCT_VERSION}" --expected-sha "${RELEASE_SHA}")
          [[ "${OPERATION}" == recover ]] && tag_args+=(--allow-existing)
          tag_json="$(python3 .github/scripts/release_chain.py "${tag_args[@]}")"
          status="$(printf '%s' "${tag_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          if [[ "${status}" == available ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${PRODUCT_TAG}" "${RELEASE_SHA}" -m "${PRODUCT_TAG}"
            git push origin "refs/tags/${PRODUCT_TAG}"
          fi
          python3 .github/scripts/release_chain.py verify-tag --version "${PRODUCT_VERSION}" --expected-sha "${RELEASE_SHA}" --allow-existing
      - name: Create or update GitHub Release
        run: |
          set -euo pipefail
          release_files=()
          while IFS= read -r -d '' asset; do
            release_files+=("$asset")
          done < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          ((${#release_files[@]} > 0))
          if gh release view "${PRODUCT_TAG}" >/dev/null 2>&1; then
            gh release upload "${PRODUCT_TAG}" "${release_files[@]}" --clobber
          else
            flags=(--verify-tag --title "${PRODUCT_TAG}" --generate-notes)
            [[ "${PRODUCT_CHANNEL}" == rc ]] && flags+=(--prerelease)
            gh release create "${PRODUCT_TAG}" "${release_files[@]}" "${flags[@]}"
          fi
      - name: Upsert PR release version comment
        if: env.PR_NUMBER != ''
        run: |
          set -euo pipefail
          marker='<!-- televybackup-release-version-comment -->'
          body="${marker}
          Released TelevyBackup ${PRODUCT_VERSION} (${PRODUCT_CHANNEL}) from merge ${RELEASE_SHA}.
          Tag: ${PRODUCT_TAG}"
          comment_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --jq '.[] | select(.body | contains("<!-- televybackup-release-version-comment -->")) | .id' | head -n 1 || true)"
          if [[ -n "${comment_id}" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -f body="${body}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${body}"
          fi

  skipped:
    name: Release skipped
    needs: resolve
    if: needs.resolve.outputs.enabled != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Release skipped: ${{ needs.resolve.outputs.reason }}"
