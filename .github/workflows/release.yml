name: Release Product

on:
  workflow_run:
    workflows: [CI (main)]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Release operation
        required: true
        type: choice
        options: [recover]
        default: recover
      commit_sha:
        description: Existing merged main SHA to recover
        required: true
        type: string
      helper_mode:
        description: Helper source mode; bootstrap requires an explicit recovery when no approved Release exists
        required: false
        type: choice
        options: [auto, bootstrap]
        default: auto

concurrency:
  group: release-product-main
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    name: Resolve merged product identity
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    outputs:
      enabled: ${{ steps.release.outputs.enabled }}
      identity_status: ${{ steps.release.outputs.identity_status }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      preparation_commit_sha: ${{ steps.release.outputs.preparation_commit_sha }}
      merge_sha: ${{ steps.release.outputs.merge_sha }}
      policy_sha: ${{ steps.release.outputs.policy_sha }}
      execution_policy_sha: ${{ steps.release.outputs.execution_policy_sha }}
      packaging_policy_sha: ${{ steps.release.outputs.packaging_policy_sha }}
      merge_commit_sha: ${{ steps.release.outputs.merge_commit_sha }}
      head_sha: ${{ steps.release.outputs.head_sha }}
      release_target: ${{ steps.release.outputs.release_target }}
      policy: ${{ steps.release.outputs.policy }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}
      release_mode: ${{ steps.release.outputs.release_mode }}
      reason: ${{ steps.release.outputs.reason }}
      release_state: ${{ steps.release.outputs.release_state }}
      tag_status: ${{ steps.release.outputs.tag_status }}
      helper_source_mode: ${{ steps.release.outputs.helper_source_mode }}
      reservation_id: ${{ steps.release.outputs.reservation_id }}
      reservation_ref: ${{ steps.release.outputs.reservation_ref }}
      reservation_owner: ${{ steps.release.outputs.reservation_owner }}
      claim_key: ${{ steps.release.outputs.claim_key }}
      boundary_token: ${{ steps.release.outputs.boundary_token }}
      covered_merge_sha: ${{ steps.release.outputs.covered_merge_sha }}
      bound_identity: ${{ steps.release.outputs.bound_identity }}
      pull_request: ${{ steps.release.outputs.pull_request }}
      helper_source_tag: ${{ steps.release.outputs.helper_source_tag }}
      helper_source_commit: ${{ steps.release.outputs.helper_source_commit }}
      helper_source_artifact_digest: ${{ steps.upload-helper-source.outputs.artifact-digest }}
      reuse_artifacts: ${{ steps.release.outputs.reuse_artifacts }}
      recovery_run_id: ${{ steps.release.outputs.recovery_run_id }}
      recovery_artifact_digest: ${{ steps.release.outputs.recovery_artifact_digest }}
      recovery_artifact_url: ${{ steps.release.outputs.recovery_artifact_url }}
      recovery_policy_sha: ${{ steps.release.outputs.recovery_policy_sha }}
      source_artifact_name: ${{ steps.release.outputs.source_artifact_name }}
      release_assets_artifact_name: ${{ steps.release.outputs.release_assets_artifact_name }}
    steps:
      - name: Resolve current trusted main SHA
        id: trusted-main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${main_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "sha=${main_sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout main history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.trusted-main.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and bind immutable merged identity
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event || 'workflow_dispatch' }}
          TARGET_INPUT: ${{ github.event.workflow_run.head_sha || inputs.commit_sha }}
          OPERATION: ${{ inputs.operation || 'publish' }}
          HELPER_MODE: ${{ inputs.helper_mode || 'auto' }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin main '+refs/tags/*:refs/tags/*'
          main_sha="$(git rev-parse origin/main)"
          policy_sha="$(git rev-parse HEAD)"
          test "${policy_sha}" = "${main_sha}"
          execution_policy_sha="${policy_sha}"
          packaging_policy_sha="${policy_sha}"
          echo "policy_sha=${policy_sha}" >> "$GITHUB_OUTPUT"
          test -n "${TARGET_INPUT}"
          if [[ "${EVENT_NAME}" == workflow_run ]]; then
            test "${WORKFLOW_CONCLUSION}" = success
            test "${WORKFLOW_EVENT}" = push
            test "${TARGET_INPUT}" = "${main_sha}"
          else
            test "${OPERATION}" = recover
            git merge-base --is-ancestor "${TARGET_INPUT}" "${main_sha}"
          fi
          # Keep the trusted main checkout for release policy scripts. TARGET_INPUT
          # is the historical product identity and remains the package ref through
          # the resolved outputs; recovery inputs may predate current policy helpers.
          merged_prs_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET_INPUT}/pulls?per_page=100")"
          pull_request="$(printf '%s' "${merged_prs_json}" | python3 -c 'import json,sys; merge=sys.argv[1]; rows=json.load(sys.stdin); matches=[row.get("number") for row in rows if row.get("merge_commit_sha") == merge and row.get("number") is not None]; print(matches[0] if len(matches) == 1 else "")' "${TARGET_INPUT}")"
          if [[ -z "${pull_request}" ]]; then
            prepared_json='{"prepared":"false","reason":"merged_pr_not_found"}'
          else
            [[ "${pull_request}" =~ ^[0-9]+$ ]]
            pull_request_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pull_request}")"
            test "$(printf '%s' "${pull_request_json}" | jq -r '.state // empty')" = closed
            test "$(printf '%s' "${pull_request_json}" | jq -r '.merged_at // empty')" != ""
            test "$(printf '%s' "${pull_request_json}" | jq -r '.base.ref // empty')" = main
            test "$(printf '%s' "${pull_request_json}" | jq -r '.base.repo.full_name // empty')" = "${GITHUB_REPOSITORY}"
            test "$(printf '%s' "${pull_request_json}" | jq -r '.merge_commit_sha // empty')" = "${TARGET_INPUT}"
            pull_request_head_sha="$(printf '%s' "${pull_request_json}" | jq -r '.head.sha // empty')"
            [[ "${pull_request_head_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
            git fetch --force origin "refs/pull/${pull_request}/head:refs/remotes/origin/release-pr-${pull_request}"
            test "$(git rev-parse "refs/remotes/origin/release-pr-${pull_request}^{commit}")" = "${pull_request_head_sha}"
            prepared_json="$(python3 .github/scripts/release_chain.py verify-merged --commit "${TARGET_INPUT}" --pr-head "${pull_request_head_sha}")"
          fi
          prepared="$(printf '%s' "${prepared_json}" | jq -r .prepared)"
          if [[ "${prepared}" != true ]]; then
            {
              echo "enabled=false"
              echo "identity_status=no-identity"
              echo "source_sha=${TARGET_INPUT}"
              echo "merge_sha=${TARGET_INPUT}"
              echo "bound_identity=missing"
              echo "reason=$(printf '%s' "${prepared_json}" | jq -r '.reason // "no_identity"')"
            } >> "$GITHUB_OUTPUT"
            echo "RELEASE_NO_IDENTITY=${TARGET_INPUT}"
            exit 0
          fi
          merge_sha="$(printf '%s' "${prepared_json}" | jq -r .mergeSha)"
          source_sha="$(printf '%s' "${prepared_json}" | jq -r .sourceSha)"
          preparation_sha="$(printf '%s' "${prepared_json}" | jq -r .preparationSha)"
          version="$(printf '%s' "${prepared_json}" | jq -r .version)"
          tag="$(printf '%s' "${prepared_json}" | jq -r .tag)"
          channel="$(printf '%s' "${prepared_json}" | jq -r .channel | sed 's/^channel://')"
          release_mode="$(printf '%s' "${prepared_json}" | jq -r .mode)"
          reservation_id="$(printf '%s' "${prepared_json}" | jq -r .reservationId)"
          reservation_ref="$(printf '%s' "${prepared_json}" | jq -r .reservationRef)"
          reservation_owner="$(printf '%s' "${prepared_json}" | jq -r .reservationOwner)"
          claim_key="$(printf '%s' "${prepared_json}" | jq -r .claimKey)"
          boundary_token="$(printf '%s' "${prepared_json}" | jq -r .boundaryToken)"
          release_target="$(printf '%s' "${prepared_json}" | jq -r .releaseTarget)"
          policy="$(printf '%s' "${prepared_json}" | jq -r .policy)"
          covered_merge_sha="$(printf '%s' "${prepared_json}" | jq -r .coveredMergeSha)"
          git merge-base --is-ancestor "${preparation_sha}" "${pull_request_head_sha}"
          verified="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${preparation_sha}" --jq '.commit.verification.verified')"
          test "${verified}" = true
          reservation_json="${RUNNER_TEMP}/reservation.json"
          jq -n \
            --arg ref "${reservation_ref}" --arg sourceSha "$(printf '%s' "${prepared_json}" | jq -r '.reservationSourceSha // .sourceSha')" --arg version "${version}" \
            --arg releaseTarget "${release_target}" --arg policy "${policy}" \
            --arg channel "${channel}" --arg reservationId "${reservation_id}" --arg owner "${reservation_owner}" \
            --arg claimKey "${claim_key}" --arg boundaryToken "${boundary_token}" \
            '{ref:$ref,sourceSha:$sourceSha,version:$version,channel:$channel,releaseTarget:$releaseTarget,policy:$policy,reservationId:$reservationId,"Reservation-Owner":$owner,"Reservation-Claim-Key":$claimKey,"Reservation-Boundary-Token":$boundaryToken}' \
            > "${reservation_json}"
          python3 - "${reservation_json}" <<'PY'
          import json
          import pathlib
          import re
          import sys
          sys.path.insert(0, '.github/scripts')
          import release_reservation
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          release_reservation.verify_github_reservation(
              value,
              repository=__import__('os').environ['GITHUB_REPOSITORY'],
              token=__import__('os').environ['GH_TOKEN'],
              api_root=__import__('os').environ.get('GITHUB_API_URL', 'https://api.github.com'),
          )
          PY
          case "${HELPER_MODE}" in
            auto|bootstrap) ;;
            *) echo "invalid helper mode: ${HELPER_MODE}" >&2; exit 1 ;;
          esac

          bound_state=missing
          existing_bound_state=missing
          bound_ref="refs/tags/release-bound/v${version}/${merge_sha}"
          bound_ref_path="${bound_ref#refs/}"
          bound_output=""
          if bound_output="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${bound_ref_path}" --jq '.object.sha' 2>&1)"; then
            if [[ ! "${bound_output}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "release_state_conflict: bound receipt target is not a full commit SHA" >&2
              exit 1
            fi
            python3 - "${version}" "${merge_sha}" "${reservation_id}" "${reservation_owner}" \
              "${claim_key}" "${boundary_token}" "${reservation_ref}" "${GITHUB_REPOSITORY}" \
              "${GH_TOKEN}" "${GITHUB_API_URL}" "${pull_request_head_sha}" <<'PY'
          import sys
          sys.path.insert(0, '.github/scripts')
          import release_reservation
          release_reservation.verify_github_receipt(
              state='bound', version=sys.argv[1], merge_sha=sys.argv[2], reservation_id=sys.argv[3],
              owner=sys.argv[4], claim_key=sys.argv[5], boundary_token=sys.argv[6],
              reservation_ref_value=sys.argv[7], repository=sys.argv[8], token=sys.argv[9], api_root=sys.argv[10],
              pr_head_sha=sys.argv[11],
          )
          PY
            bound_state=present
            existing_bound_state=present
          else
            if ! printf '%s' "${bound_output}" | grep -qiE '404|not found'; then
              printf '%s\n' "${bound_output}" >&2
              echo "release_state_conflict: unable to resolve bound receipt state" >&2
              exit 1
            fi
          fi

          if [[ "${bound_state}" == present ]]; then
            # A same-SHA recovery reuses its already-bound identity and must not
            # be rejected because a newer product tag now exists.
            tag_status=matching
          else
            sequence_json="$(python3 .github/scripts/release_chain.py verify-release-sequence --version "${version}" --expected-sha "${merge_sha}")"
            tag_status="$(printf '%s' "${sequence_json}" | jq -r .status)"
          fi
          release_state=missing
          release_output=""
          if release_output="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>&1)"; then
            if [[ "${tag_status}" != matching ]]; then
              echo "release_state_conflict: Release exists without a matching product tag" >&2
              exit 1
            fi
            is_draft="$(printf '%s' "${release_output}" | jq -r '.draft | tostring')"
            is_prerelease="$(printf '%s' "${release_output}" | jq -r '.prerelease | tostring')"
            is_latest=false
            expected_prerelease=false
            expected_latest=false
            if [[ "${channel}" != prod ]]; then
              expected_prerelease=true
            elif [[ "${is_draft}" == false ]]; then
              latest_output=""
              if ! latest_output="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" 2>&1)"; then
                printf '%s\n' "${latest_output}" >&2
                echo "release_state_conflict: unable to resolve latest GitHub Release" >&2
                exit 1
              fi
              latest_tag="$(printf '%s' "${latest_output}" | jq -r '.tag_name // empty')"
              if [[ -z "${latest_tag}" ]]; then
                echo "release_state_conflict: latest GitHub Release has no tag" >&2
                exit 1
              fi
              if [[ "${latest_tag}" == "${tag}" ]]; then
                is_latest=true
              fi
              expected_latest=true
            fi
            if [[ "${is_prerelease}" != "${expected_prerelease}" || "${is_latest}" != "${expected_latest}" ]]; then
              echo "release_state_conflict: GitHub Release channel flags do not match ${channel}" >&2
              exit 1
            fi
            case "${is_draft}" in
              true) release_state=draft ;;
              false) release_state=published ;;
              *) echo "release_state_conflict: invalid GitHub Release state" >&2; exit 1 ;;
            esac
          else
            if ! printf '%s' "${release_output}" | grep -qiE '404|not found'; then
              printf '%s\n' "${release_output}" >&2
              echo "release_state_conflict: unable to resolve GitHub Release state" >&2
              exit 1
            fi
          fi

          consumed_state=missing
          consumed_ref="refs/tags/release-consumed/v${version}/${merge_sha}"
          consumed_ref_path="${consumed_ref#refs/}"
          consumed_output=""
          if consumed_output="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/${consumed_ref_path}" --jq '.object.sha' 2>&1)"; then
            if [[ ! "${consumed_output}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "release_state_conflict: consumed receipt target is not a full commit SHA" >&2
              exit 1
            fi
            python3 - "${version}" "${merge_sha}" "${reservation_id}" "${reservation_owner}" \
              "${claim_key}" "${boundary_token}" "${reservation_ref}" "${GITHUB_REPOSITORY}" \
              "${GH_TOKEN}" "${GITHUB_API_URL}" "${pull_request_head_sha}" <<'PY'
          import sys
          sys.path.insert(0, '.github/scripts')
          import release_reservation
          release_reservation.verify_github_receipt(
              state='consumed', version=sys.argv[1], merge_sha=sys.argv[2], reservation_id=sys.argv[3],
              owner=sys.argv[4], claim_key=sys.argv[5], boundary_token=sys.argv[6],
              reservation_ref_value=sys.argv[7], repository=sys.argv[8], token=sys.argv[9], api_root=sys.argv[10],
              pr_head_sha=sys.argv[11],
          )
          PY
            consumed_state=present
          else
            if ! printf '%s' "${consumed_output}" | grep -qiE '404|not found'; then
              printf '%s\n' "${consumed_output}" >&2
              echo "release_state_conflict: unable to resolve consumed receipt state" >&2
              exit 1
            fi
          fi

          recovery_run_id=""
          recovery_artifact_id=""
          recovery_artifact_digest=""
          recovery_artifact_url=""
          recovery_policy_sha=""
          recovery_helper_source_mode=""
          recovery_helper_source_tag=""
          recovery_helper_source_commit=""
          source_artifact_name="release-assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_assets_artifact_name="${source_artifact_name}"
          reuse_artifacts=false
          if [[ "${consumed_state}" != present && "${release_state}" != published && "${existing_bound_state}" == present ]]; then
            release_workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml" --jq '.id')"
            artifact_receipt_json=""
            artifact_receipt_status=0
            if artifact_receipt_json="$(python3 .github/scripts/release_reservation.py verify-artifact-receipt \
              --state finalized --version "${version}" --merge-sha "${merge_sha}" \
              --repository "${GITHUB_REPOSITORY}" --token "${GH_TOKEN}" --api-root "${GITHUB_API_URL}" 2>&1)"; then
              :
            else
              artifact_receipt_status=$?
              if [[ "${artifact_receipt_status}" != 2 ]]; then
                printf '%s\n' "${artifact_receipt_json}" >&2
                echo "same-identity recovery has an invalid finalized artifact receipt" >&2
                exit 1
              fi
              artifact_receipt_json=""
            fi

            pending_receipt_json=""
            if [[ -z "${artifact_receipt_json}" ]]; then
              pending_receipt_status=0
              if pending_receipt_json="$(python3 .github/scripts/release_reservation.py verify-artifact-receipt \
                --state pending --version "${version}" --merge-sha "${merge_sha}" \
                --repository "${GITHUB_REPOSITORY}" --token "${GH_TOKEN}" --api-root "${GITHUB_API_URL}" 2>&1)"; then
                :
              else
                pending_receipt_status=$?
                printf '%s\n' "${pending_receipt_json}" >&2
                if [[ "${pending_receipt_status}" == 2 ]]; then
                  echo "same-identity recovery cannot prove whether release-assets was ever recorded" >&2
                else
                  echo "same-identity recovery has an invalid pending artifact receipt" >&2
                fi
                exit 1
              fi

              inspect_pending_artifact_receipt() {
                local candidate_json="$1"
                local candidate_run_id candidate_run_attempt candidate_policy_sha
                local candidate_run_json candidate_head_sha artifacts_json assets_row expired_assets_count
                local candidate_artifact_name artifact_id artifact_digest candidate_artifact_json
                candidate_run_id="$(printf '%s' "${candidate_json}" | jq -r '."Release-Run-Id"')"
                candidate_run_attempt="$(printf '%s' "${candidate_json}" | jq -r '."Release-Run-Attempt"')"
                candidate_policy_sha="$(printf '%s' "${candidate_json}" | jq -r '."Release-Packaging-Policy-SHA"')"
                candidate_artifact_name="$(printf '%s' "${candidate_json}" | jq -r '."Release-Artifact-Name"')"
                candidate_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}")" || return 3
                candidate_head_sha="$(printf '%s' "${candidate_run_json}" | jq -r '.head_sha // empty')"
                [[ "${candidate_head_sha}" =~ ^[0-9a-fA-F]{40}$ ]] || return 3
                jq -e \
                  --arg repository "${GITHUB_REPOSITORY}" \
                  --arg workflow_id "${release_workflow_id}" \
                  --arg current_run_id "${GITHUB_RUN_ID}" \
                  --arg candidate_attempt "${candidate_run_attempt}" \
                  --arg current_attempt "${GITHUB_RUN_ATTEMPT}" \
                  '(.head_branch == "main") and (.event == "workflow_run" or .event == "workflow_dispatch") and (.status == "completed" or ((.id | tostring) == $current_run_id and ($candidate_attempt | tonumber) < ($current_attempt | tonumber))) and ((.workflow_id | tostring) == $workflow_id) and (.path == ".github/workflows/release.yml") and (.repository.full_name == $repository)' \
                  <<<"${candidate_run_json}" >/dev/null || return 3
                git cat-file -e "${candidate_head_sha}^{commit}" || return 3
                git merge-base --is-ancestor "${candidate_head_sha}" "${main_sha}" || return 3
                artifacts_json="${RUNNER_TEMP}/recovery-artifacts-${candidate_run_id}-${candidate_run_attempt}.json"
                gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_run_id}/artifacts?per_page=100" \
                  | jq '{artifacts: [.[].artifacts[]?]}' > "${artifacts_json}" || return 3
                assets_row="$(jq -c --arg artifact_name "${candidate_artifact_name}" '[.artifacts[]? | select(.name == $artifact_name and .expired == false)] | if length > 0 then .[0] else empty end' "${artifacts_json}")"
                expired_assets_count="$(jq --arg artifact_name "${candidate_artifact_name}" '[.artifacts[]? | select(.name == $artifact_name and .expired == true)] | length' "${artifacts_json}")"
                if [[ -z "${assets_row}" ]]; then
                  [[ "${expired_assets_count}" == 0 ]] || return 2
                  return 1
                fi
                artifact_id="$(printf '%s' "${assets_row}" | jq -r '.id | tostring')"
                artifact_digest="$(printf '%s' "${assets_row}" | jq -r '.digest // empty')"
                [[ "${artifact_id}" =~ ^[1-9][0-9]*$ ]] || return 3
                [[ "${artifact_digest}" =~ ^sha256:[0-9a-fA-F]{64}$ ]] || return 3
                candidate_artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}")" || return 3
                jq -e \
                  --arg run_id "${candidate_run_id}" \
                  --arg artifact_name "${candidate_artifact_name}" \
                  --arg artifact_digest "${artifact_digest}" \
                  '.name == $artifact_name and .expired == false and (.workflow_run.id | tostring) == $run_id and .digest == $artifact_digest and (.archive_download_url | type == "string" and length > 0)' \
                  <<<"${candidate_artifact_json}" >/dev/null || return 3
                recovery_run_id="${candidate_run_id}"
                recovery_artifact_id="${artifact_id}"
                recovery_artifact_digest="${artifact_digest}"
                recovery_policy_sha="${candidate_policy_sha}"
                recovery_helper_source_mode="reuse"
                recovery_helper_source_tag=""
                recovery_helper_source_commit=""
                recovery_artifact_url="$(printf '%s' "${candidate_artifact_json}" | jq -r '.archive_download_url')"
                return 0
              }

              saw_expired_artifact=false
              pending_status=1
              if inspect_pending_artifact_receipt "${pending_receipt_json}"; then
                pending_status=0
              else
                pending_status=$?
              fi
              if [[ "${pending_status}" == 0 ]]; then
                artifact_receipt_json="$(python3 .github/scripts/release_reservation.py artifact-receipt \
                  --state finalized --version "${version}" --merge-sha "${merge_sha}" \
                  --run-id "${recovery_run_id}" --run-attempt "$(printf '%s' "${pending_receipt_json}" | jq -r '."Release-Run-Attempt"')" \
                  --packaging-policy-sha "${recovery_policy_sha}" --artifact-id "${recovery_artifact_id}" \
                  --artifact-digest "${recovery_artifact_digest}" --helper-mode reuse \
                  --artifact-name "$(printf '%s' "${pending_receipt_json}" | jq -r '."Release-Artifact-Name"')" \
                  --repository "${GITHUB_REPOSITORY}" --token "${GH_TOKEN}" --api-root "${GITHUB_API_URL}")"
              elif [[ "${pending_status}" == 2 ]]; then
                saw_expired_artifact=true
              elif [[ "${pending_status}" != 1 ]]; then
                echo "same-identity recovery has an invalid pending artifact source" >&2
                exit 1
              fi

              if [[ -z "${artifact_receipt_json}" ]]; then
                attempt_refs="$(git for-each-ref --format='%(refname)' "refs/tags/release-artifact-attempts/v${version}/${merge_sha}")"
                while IFS= read -r attempt_ref; do
                  [[ -n "${attempt_ref}" ]] || continue
                  attempt_value="${attempt_ref##*/}"
                  attempt_parent="${attempt_ref%/*}"
                  attempt_run_id="${attempt_parent##*/}"
                  attempt_json="$(python3 .github/scripts/release_reservation.py verify-artifact-receipt \
                    --state attempt --version "${version}" --merge-sha "${merge_sha}" \
                    --run-id "${attempt_run_id}" --run-attempt "${attempt_value}" --local-root . 2>&1)" || {
                    printf '%s\n' "${attempt_json}" >&2
                    echo "same-identity recovery has an invalid artifact attempt receipt" >&2
                    exit 1
                  }
                  attempt_status=1
                  if inspect_pending_artifact_receipt "${attempt_json}"; then
                    attempt_status=0
                  else
                    attempt_status=$?
                  fi
                  if [[ "${attempt_status}" == 0 ]]; then
                    artifact_receipt_json="$(python3 .github/scripts/release_reservation.py artifact-receipt \
                      --state finalized --version "${version}" --merge-sha "${merge_sha}" \
                      --run-id "${recovery_run_id}" --run-attempt "${attempt_value}" \
                      --packaging-policy-sha "${recovery_policy_sha}" --artifact-id "${recovery_artifact_id}" \
                      --artifact-digest "${recovery_artifact_digest}" --helper-mode reuse \
                      --artifact-name "$(printf '%s' "${attempt_json}" | jq -r '."Release-Artifact-Name"')" \
                      --repository "${GITHUB_REPOSITORY}" --token "${GH_TOKEN}" --api-root "${GITHUB_API_URL}")"
                    break
                  elif [[ "${attempt_status}" == 2 ]]; then
                    saw_expired_artifact=true
                  elif [[ "${attempt_status}" != 1 ]]; then
                    echo "same-identity recovery has an invalid artifact attempt source" >&2
                    exit 1
                  fi
                done <<<"${attempt_refs}"
              fi
              if [[ -z "${artifact_receipt_json}" ]]; then
                if [[ "${saw_expired_artifact}" == true ]]; then
                  echo "same-identity recovery requires an unexpired prior release-assets artifact" >&2
                  exit 1
                fi
                echo "same-identity recovery has no prior immutable release-assets artifact; rebuilding pre-artifact output"
              fi
            fi

            if [[ -n "${artifact_receipt_json}" ]]; then
              recovery_run_id="$(printf '%s' "${artifact_receipt_json}" | jq -r '."Release-Run-Id"')"
              recovery_artifact_id="$(printf '%s' "${artifact_receipt_json}" | jq -r '."Release-Artifact-Id"')"
              recovery_artifact_digest="$(printf '%s' "${artifact_receipt_json}" | jq -r '."Release-Artifact-Digest"')"
              recovery_artifact_name="$(printf '%s' "${artifact_receipt_json}" | jq -r '."Release-Artifact-Name"')"
              recovery_policy_sha="$(printf '%s' "${artifact_receipt_json}" | jq -r '."Release-Packaging-Policy-SHA"')"
              recovery_helper_source_mode="$(printf '%s' "${artifact_receipt_json}" | jq -r '."Artifact-Helper-Mode"')"
              recovery_helper_source_tag="$(printf '%s' "${artifact_receipt_json}" | jq -r '."Artifact-Helper-Tag" // ""')"
              recovery_helper_source_commit="$(printf '%s' "${artifact_receipt_json}" | jq -r '."Artifact-Helper-Commit" // ""')"
              recovery_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${recovery_run_id}")"
              recovery_head_sha="$(printf '%s' "${recovery_run_json}" | jq -r '.head_sha // empty')"
              [[ "${recovery_head_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
              jq -e \
                --arg repository "${GITHUB_REPOSITORY}" \
                --arg workflow_id "${release_workflow_id}" \
                --arg current_run_id "${GITHUB_RUN_ID}" \
                --arg receipt_attempt "$(printf '%s' "${artifact_receipt_json}" | jq -r '."Release-Run-Attempt"')" \
                --arg current_attempt "${GITHUB_RUN_ATTEMPT}" \
                '(.head_branch == "main") and (.event == "workflow_run" or .event == "workflow_dispatch") and (.status == "completed" or ((.id | tostring) == $current_run_id and ($receipt_attempt | tonumber) < ($current_attempt | tonumber))) and ((.workflow_id | tostring) == $workflow_id) and (.path == ".github/workflows/release.yml") and (.repository.full_name == $repository)' \
                <<<"${recovery_run_json}" >/dev/null
              git cat-file -e "${recovery_head_sha}^{commit}"
              git merge-base --is-ancestor "${recovery_head_sha}" "${main_sha}"
              recovery_artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${recovery_artifact_id}")"
              jq -e \
                --arg run_id "${recovery_run_id}" \
                --arg artifact_name "${recovery_artifact_name}" \
                --arg artifact_digest "${recovery_artifact_digest}" \
                '.name == $artifact_name and .expired == false and (.workflow_run.id | tostring) == $run_id and .digest == $artifact_digest and (.archive_download_url | type == "string" and length > 0)' \
                <<<"${recovery_artifact_json}" >/dev/null
              recovery_artifact_url="$(printf '%s' "${recovery_artifact_json}" | jq -r '.archive_download_url')"
              [[ "${recovery_helper_source_mode}" == reuse || "${recovery_helper_source_mode}" == bootstrap ]]
              reuse_artifacts=true
            fi
          fi
          if [[ "${existing_bound_state}" == present && "${reuse_artifacts}" != true && "${consumed_state}" != present && "${release_state}" != published ]]; then
            python3 .github/scripts/release_reservation.py artifact-receipt \
              --state attempt --version "${version}" --merge-sha "${merge_sha}" \
              --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
              --packaging-policy-sha "${packaging_policy_sha}" --artifact-name "${source_artifact_name}" \
              --repository "${GITHUB_REPOSITORY}" \
              --token "${GH_TOKEN}" --api-root "${GITHUB_API_URL}" >/dev/null
          fi
          if [[ "${reuse_artifacts}" == true ]]; then
            packaging_policy_sha="${recovery_policy_sha}"
            release_assets_artifact_name="release-assets-reused-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi

          helper_source_tag=""
          helper_source_mode=""
          helper_source_commit=""
          if [[ "${consumed_state}" == present ]]; then
            if [[ "${tag_status}" != matching ]]; then
              echo "release_state_conflict: consumed receipt exists without a matching product tag" >&2
              exit 1
            fi
            if [[ "${release_state}" == draft ]]; then
              echo "release_state_conflict: consumed receipt exists for a draft Release" >&2
              exit 1
            fi
            release_state=published
            enabled=false
            reason=already_consumed
            echo "RELEASE_TERMINAL state=consumed version=${version} merge_sha=${merge_sha}"
          else
            if [[ "${EVENT_NAME}" == workflow_dispatch ]]; then
              echo "RELEASE_RECOVERY_BOUND_REPAIR version=${version} merge_sha=${merge_sha}"
            fi
            if [[ "${existing_bound_state}" != present && "${release_state}" != published ]]; then
              pending_receipt_status=0
              if pending_receipt_json="$(python3 .github/scripts/release_reservation.py verify-artifact-receipt \
                --state pending --version "${version}" --merge-sha "${merge_sha}" \
                --repository "${GITHUB_REPOSITORY}" --token "${GH_TOKEN}" --api-root "${GITHUB_API_URL}" 2>&1)"; then
                :
              else
                pending_receipt_status=$?
                if [[ "${pending_receipt_status}" != 2 ]]; then
                  printf '%s\n' "${pending_receipt_json}" >&2
                  echo "new identity has an invalid pending artifact receipt" >&2
                  exit 1
                fi
                python3 .github/scripts/release_reservation.py artifact-receipt \
                  --state pending --version "${version}" --merge-sha "${merge_sha}" \
                  --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
                  --packaging-policy-sha "${packaging_policy_sha}" --artifact-name "${source_artifact_name}" \
                  --repository "${GITHUB_REPOSITORY}" --token "${GH_TOKEN}" --api-root "${GITHUB_API_URL}" >/dev/null
              fi
            fi
            python3 .github/scripts/release_reservation.py receipt \
              --state bound --version "${version}" --merge-sha "${merge_sha}" \
              --reservation-id "${reservation_id}" --owner "${reservation_owner}" \
              --claim-key "${claim_key}" --boundary-token "${boundary_token}" \
              --reservation-ref "${reservation_ref}" --repository "${GITHUB_REPOSITORY}" \
              --token "${GH_TOKEN}" --api-root "${GITHUB_API_URL}" --pr-head "${pull_request_head_sha}" >/dev/null
            bound_state=present
            if [[ "${existing_bound_state}" != present && "${release_state}" != published ]]; then
              python3 .github/scripts/release_reservation.py artifact-receipt \
                --state attempt --version "${version}" --merge-sha "${merge_sha}" \
                --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
                --packaging-policy-sha "${packaging_policy_sha}" --artifact-name "${source_artifact_name}" \
                --repository "${GITHUB_REPOSITORY}" \
                --token "${GH_TOKEN}" --api-root "${GITHUB_API_URL}" >/dev/null
            fi
            if [[ "${release_state}" == published ]]; then
              python3 .github/scripts/release_reservation.py receipt \
                --state consumed --version "${version}" --merge-sha "${merge_sha}" \
                --reservation-id "${reservation_id}" --owner "${reservation_owner}" \
                --claim-key "${claim_key}" --boundary-token "${boundary_token}" \
                --reservation-ref "${reservation_ref}" --repository "${GITHUB_REPOSITORY}" \
                --token "${GH_TOKEN}" --api-root "${GITHUB_API_URL}" --pr-head "${pull_request_head_sha}" >/dev/null
              enabled=false
              reason=already_published
            elif [[ "${reuse_artifacts}" == true ]]; then
              helper_source_mode="${recovery_helper_source_mode}"
              helper_source_tag="${recovery_helper_source_tag}"
              helper_source_commit="${recovery_helper_source_commit}"
              [[ "${helper_source_mode}" == reuse || "${helper_source_mode}" == bootstrap ]]
              enabled=true
              reason=product_identity_recovery
            else
              bootstrap_helper_tag="$(python3 -c 'import json; print(json.load(open("packaging/macos/snapshot-components.lock.json", encoding="utf-8"))["bootstrap_release_tag"])')"
              release_list_json="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease,publishedAt)"
              helper_candidates_json="$(printf '%s' "${release_list_json}" | python3 .github/scripts/release_helper.py candidates --version "${version}" --bootstrap-tag "${bootstrap_helper_tag}")"
              source_download_dir="${RUNNER_TEMP}/snapshot-helper-downloads"
              source_artifact_dir="${RUNNER_TEMP}/snapshot-helper-source"
              mkdir -p "${source_download_dir}" "${source_artifact_dir}"
              while IFS= read -r candidate; do
                [[ -n "${candidate}" ]] || continue
                source_release_json=""
                if ! source_release_json="$(gh release view "${candidate}" --json isDraft,isPrerelease,assets 2>&1)"; then
                  if printf '%s' "${source_release_json}" | grep -qiE '404|not found'; then
                    echo "helper candidate is unavailable: ${candidate}"
                    continue
                  fi
                  printf '%s\n' "${source_release_json}" >&2
                  echo "unable to resolve helper candidate Release: ${candidate}" >&2
                  exit 1
                fi
                source_is_draft="$(printf '%s' "${source_release_json}" | jq -r '.isDraft | tostring')"
                source_is_prerelease="$(printf '%s' "${source_release_json}" | jq -r '.isPrerelease | tostring')"
                if [[ "${source_is_draft}" != false || "${source_is_prerelease}" != true ]]; then
                  echo "skipping non-approved helper candidate: ${candidate}"
                  continue
                fi
                helper_version="${candidate#v}"
                missing_assets="$(printf '%s' "${source_release_json}" | python3 -c 'import json,sys; names={a.get("name") for a in json.load(sys.stdin).get("assets", []) if isinstance(a,dict)}; print("\n".join(name for name in sys.argv[1:] if name not in names))' "TelevyBackup-${helper_version}.dmg" "BUILD-MANIFEST.json" "SHA256SUMS")"
                if [[ -n "${missing_assets}" ]]; then
                  echo "skipping helper candidate with incomplete assets: ${candidate}"
                  continue
                fi
                if ! git fetch --force origin "refs/tags/${candidate}:refs/tags/${candidate}" || \
                  ! python3 .github/scripts/release_chain.py verify-tag-provenance --tag "${candidate}"; then
                  echo "skipping helper candidate without protected annotated-tag provenance: ${candidate}"
                  continue
                fi
                candidate_asset_dir="${source_download_dir}/${helper_version}"
                mkdir -p "${candidate_asset_dir}"
                if ! gh release download "${candidate}" --repo "$GITHUB_REPOSITORY" \
                  --pattern "TelevyBackup-${helper_version}.dmg" \
                  --pattern "BUILD-MANIFEST.json" --pattern "SHA256SUMS" \
                  --dir "${candidate_asset_dir}"; then
                  echo "skipping helper candidate whose assets could not be downloaded: ${candidate}"
                  continue
                fi
                source_tag_commit="$(git rev-list -n 1 "${candidate}^{commit}" 2>/dev/null || true)"
                if [[ -z "${source_tag_commit}" ]]; then
                  echo "skipping helper candidate without a resolvable tag commit: ${candidate}"
                  continue
                fi
                if ! python3 .github/scripts/release_helper.py verify-assets \
                  --asset-dir "${candidate_asset_dir}" \
                  --lock packaging/macos/snapshot-components.lock.json \
                  --source-tag "${candidate}" \
                  --expected-source-commit "${source_tag_commit}"; then
                  echo "skipping helper candidate with incompatible immutable assets: ${candidate}"
                  continue
                fi
                cp "${candidate_asset_dir}/TelevyBackup-${helper_version}.dmg" "${source_artifact_dir}/"
                cp "${candidate_asset_dir}/BUILD-MANIFEST.json" "${source_artifact_dir}/"
                cp "${candidate_asset_dir}/SHA256SUMS" "${source_artifact_dir}/"
                helper_source_tag="${candidate}"
                helper_source_commit="${source_tag_commit}"
                helper_source_mode="reuse"
                echo "approved Snapshot Access helper source: ${helper_source_tag}"
                break
              done < <(printf '%s' "${helper_candidates_json}" | jq -r '.candidates[]')
              if [[ -n "${helper_source_tag}" ]]; then
                if [[ "${HELPER_MODE}" == bootstrap ]]; then
                  echo "approved helper Release exists; refusing one-time bootstrap: ${helper_source_tag}" >&2
                  exit 1
                fi
              elif [[ "${HELPER_MODE}" == bootstrap ]]; then
                helper_source_mode="bootstrap"
                echo "SNAPSHOT_ACCESS_HELPER_MODE=one-time-bootstrap version=${version} reason=no-approved-helper-release"
              else
                echo "no approved Snapshot Access helper Release; rerun same-SHA recovery with helper_mode=bootstrap" >&2
                exit 1
              fi
              if [[ "${channel}" == prod && "${helper_source_mode}" == bootstrap ]]; then
                echo "stable release requires a previously published RC Universal Snapshot Access helper" >&2
                exit 1
              fi
              enabled=true
              reason=product_identity
            fi
          fi
          {
            echo "enabled=${enabled}"
            echo "identity_status=resolved"
            echo "source_sha=${source_sha}"
            echo "preparation_commit_sha=${preparation_sha}"
            echo "merge_sha=${merge_sha}"
            echo "merge_commit_sha=${merge_sha}"
            echo "execution_policy_sha=${execution_policy_sha}"
            echo "packaging_policy_sha=${packaging_policy_sha}"
            echo "head_sha=${pull_request_head_sha}"
            echo "release_target=${release_target}"
            echo "policy=${policy}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "channel=${channel}"
            echo "release_mode=${release_mode}"
            echo "reason=${reason}"
            echo "release_state=${release_state}"
            echo "tag_status=${tag_status}"
            echo "helper_source_mode=${helper_source_mode}"
            echo "reservation_id=${reservation_id}"
            echo "reservation_ref=${reservation_ref}"
            echo "reservation_owner=${reservation_owner}"
            echo "claim_key=${claim_key}"
            echo "boundary_token=${boundary_token}"
            echo "covered_merge_sha=${covered_merge_sha}"
            echo "bound_identity=${bound_state}"
            echo "pull_request=${pull_request}"
            echo "helper_source_tag=${helper_source_tag}"
            echo "helper_source_commit=${helper_source_commit}"
            echo "reuse_artifacts=${reuse_artifacts}"
            echo "recovery_run_id=${recovery_run_id}"
            echo "recovery_artifact_digest=${recovery_artifact_digest}"
            echo "recovery_artifact_url=${recovery_artifact_url}"
            echo "recovery_policy_sha=${recovery_policy_sha}"
            echo "source_artifact_name=${source_artifact_name}"
            echo "release_assets_artifact_name=${release_assets_artifact_name}"
          } >> "$GITHUB_OUTPUT"
          echo "RELEASE_IDENTITY status=resolved version=${version} channel=${channel} merge_sha=${merge_sha} tag=${tag} reservation_ref=${reservation_ref}"

      - name: Upload immutable helper source
        if: steps.release.outputs.identity_status == 'resolved' && steps.release.outputs.helper_source_mode == 'reuse' && steps.release.outputs.reuse_artifacts != 'true'
        id: upload-helper-source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: snapshot-helper-source
          path: ${{ runner.temp }}/snapshot-helper-source
          if-no-files-found: error
          overwrite: true

      - name: Write release intent snapshot
        if: steps.release.outputs.identity_status == 'resolved'
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          PREPARATION_SHA: ${{ steps.release.outputs.preparation_commit_sha }}
          MERGE_SHA: ${{ steps.release.outputs.merge_sha }}
          HEAD_SHA: ${{ steps.release.outputs.head_sha }}
          RELEASE_TARGET: ${{ steps.release.outputs.release_target }}
          POLICY: ${{ steps.release.outputs.policy }}
          EXECUTION_POLICY_SHA: ${{ steps.release.outputs.execution_policy_sha }}
          PACKAGING_POLICY_SHA: ${{ steps.release.outputs.packaging_policy_sha }}
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
          RELEASE_MODE: ${{ steps.release.outputs.release_mode }}
          RESERVATION_ID: ${{ steps.release.outputs.reservation_id }}
          RESERVATION_REF: ${{ steps.release.outputs.reservation_ref }}
          OWNER: ${{ steps.release.outputs.reservation_owner }}
          CLAIM_KEY: ${{ steps.release.outputs.claim_key }}
          BOUNDARY_TOKEN: ${{ steps.release.outputs.boundary_token }}
          COVERED_MERGE_SHA: ${{ steps.release.outputs.covered_merge_sha }}
          HELPER_SOURCE_MODE: ${{ steps.release.outputs.helper_source_mode }}
          HELPER_SOURCE_TAG: ${{ steps.release.outputs.helper_source_tag }}
          HELPER_SOURCE_COMMIT: ${{ steps.release.outputs.helper_source_commit }}
          HELPER_SOURCE_ARTIFACT_DIGEST: ${{ steps.upload-helper-source.outputs.artifact-digest }}
          REUSE_ARTIFACTS: ${{ steps.release.outputs.reuse_artifacts }}
          RECOVERY_RUN_ID: ${{ steps.release.outputs.recovery_run_id }}
          RECOVERY_ARTIFACT_DIGEST: ${{ steps.release.outputs.recovery_artifact_digest }}
          RECOVERY_POLICY_SHA: ${{ steps.release.outputs.recovery_policy_sha }}
          RELEASE_ASSETS_ARTIFACT_NAME: ${{ steps.release.outputs.release_assets_artifact_name }}
          PULL_REQUEST: ${{ steps.release.outputs.pull_request }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          jq -n \
            --arg source_sha "${SOURCE_SHA}" --arg merge_sha "${MERGE_SHA}" --arg version "${VERSION}" \
            --arg channel "${CHANNEL}" --arg mode "${RELEASE_MODE}" --arg reservation_id "${RESERVATION_ID}" \
            --arg reservation_ref "${RESERVATION_REF}" --arg owner "${OWNER}" --arg claim_key "${CLAIM_KEY}" \
            --arg boundary_token "${BOUNDARY_TOKEN}" --arg run_url "${RUN_URL}" --arg run_id "${GITHUB_RUN_ID}" --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg release_target "${RELEASE_TARGET}" --arg policy "${POLICY}" \
            --arg preparation_sha "${PREPARATION_SHA}" --arg covered_merge_sha "${COVERED_MERGE_SHA}" --arg pull_request "${PULL_REQUEST}" \
            --arg head_sha "${HEAD_SHA}" \
            --arg tag_owner "protected-release-automation" \
            --arg helper_source_mode "${HELPER_SOURCE_MODE}" --arg helper_source_tag "${HELPER_SOURCE_TAG}" \
            --arg helper_source_commit "${HELPER_SOURCE_COMMIT}" --arg helper_source_artifact_digest "${HELPER_SOURCE_ARTIFACT_DIGEST}" \
            --arg execution_policy_commit_sha "${EXECUTION_POLICY_SHA}" --arg packaging_policy_sha "${PACKAGING_POLICY_SHA}" --arg reuse_artifacts "${REUSE_ARTIFACTS}" \
            --arg recovery_run_id "${RECOVERY_RUN_ID}" --arg recovery_artifact_digest "${RECOVERY_ARTIFACT_DIGEST}" \
            --arg recovery_policy_sha "${RECOVERY_POLICY_SHA}" --arg release_assets_artifact_name "${RELEASE_ASSETS_ARTIFACT_NAME}" \
            '{schema_version:3,pull_request:$pull_request,source_sha:$source_sha,merge_sha:$merge_sha,merge_commit_sha:$merge_sha,head_sha:$head_sha,branch_head:$merge_sha,release_mode:$mode,preparation_commit_sha:$preparation_sha,covered_merge_sha:$covered_merge_sha,release_target:$release_target,policy:$policy,policy_commit_sha:$packaging_policy_sha,execution_policy_commit_sha:$execution_policy_commit_sha,channel:$channel,version:$version,tag:("v"+$version),tag_target_sha:$merge_sha,tag_owner:$tag_owner,helper:{mode:$helper_source_mode,source_tag:$helper_source_tag,source_commit:$helper_source_commit,artifact_digest:$helper_source_artifact_digest},reservation:{id:$reservation_id,ref:$reservation_ref,owner:$owner,claim_key:$claim_key,boundary_token:$boundary_token,state:"bound",merge_commit_sha:$merge_sha},provenance:{signature:"github-native-verified",signature_verified:true,provenance_verified:true,tag_owner:$tag_owner,identity:"release_chain_and_reservation_refs"},artifact_names:(if $reuse_artifacts == "true" then [$release_assets_artifact_name] elif $helper_source_mode == "reuse" then ["snapshot-helper-source","release-package-arm64","release-package-x86_64",$release_assets_artifact_name] else ["release-package-arm64","release-package-x86_64",$release_assets_artifact_name] end),recovery:{reuse_artifacts:($reuse_artifacts == "true"),source_run_id:$recovery_run_id,release_assets_artifact_digest:$recovery_artifact_digest,source_policy_sha:$packaging_policy_sha,execution_policy_sha:$execution_policy_commit_sha},run_id:$run_id,run_attempt:$run_attempt,run_url:$run_url,recovery_instruction:("workflow_dispatch operation=recover commit_sha="+$merge_sha+" helper_mode=bootstrap only when no-approved-helper-release")}' \
            > release-intent.json

      - name: Upload locked release intent
        if: steps.release.outputs.identity_status == 'resolved'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-intent
          path: release-intent.json
          if-no-files-found: error
          overwrite: true

  build-arm64:
    name: Build arm64 package
    needs: resolve
    if: needs.resolve.outputs.enabled == 'true' && needs.resolve.outputs.reuse_artifacts != 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.merge_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.91.0
          targets: aarch64-apple-darwin
      - name: Fingerprint macOS build platform
        id: build-platform
        shell: bash
        run: |
          fingerprint="$( { rustc --version; swiftc --version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Cache macOS arm64 build dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pip
            ~/Library/Caches/pip
            target
            crates/mtproto-helper/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-macos-v2-${{ steps.build-platform.outputs.fingerprint }}-${{ hashFiles('Cargo.lock', 'crates/mtproto-helper/Cargo.lock') }}-${{ needs.resolve.outputs.merge_sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-macos-v2-${{ steps.build-platform.outputs.fingerprint }}-${{ hashFiles('Cargo.lock', 'crates/mtproto-helper/Cargo.lock') }}-
      - name: Download immutable Snapshot Access helper source
        if: needs.resolve.outputs.helper_source_mode == 'reuse'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: snapshot-helper-source
          path: ${{ runner.temp }}/snapshot-helper
      - name: Extract and verify immutable Snapshot Access helper
        if: needs.resolve.outputs.helper_source_mode == 'reuse'
        env:
          HELPER_SOURCE_TAG: ${{ needs.resolve.outputs.helper_source_tag }}
          HELPER_SOURCE_COMMIT: ${{ needs.resolve.outputs.helper_source_commit }}
          POLICY_SHA: ${{ needs.resolve.outputs.policy_sha }}
        run: |
          set -euo pipefail
          helper_version="${HELPER_SOURCE_TAG#v}"
          python3 .github/scripts/release_helper.py verify-assets \
            --asset-dir "$RUNNER_TEMP/snapshot-helper" \
            --lock packaging/macos/snapshot-components.lock.json \
            --source-tag "$HELPER_SOURCE_TAG" \
            --expected-source-commit "$HELPER_SOURCE_COMMIT"
          test -n "${POLICY_SHA}"
          git fetch --force origin main
          git cat-file -e "${POLICY_SHA}^{commit}"
          policy_extract_snapshot_access_helper="$RUNNER_TEMP/extract-snapshot-access-helper.sh"
          git show "${POLICY_SHA}:scripts/macos/extract-snapshot-access-helper.sh" > "${policy_extract_snapshot_access_helper}"
          chmod 755 "${policy_extract_snapshot_access_helper}"
          policy_verify_component_identity="$RUNNER_TEMP/verify-component-identity.sh"
          git show "${POLICY_SHA}:scripts/macos/verify-component-identity.sh" > "${policy_verify_component_identity}"
          chmod 755 "${policy_verify_component_identity}"
          bash "${policy_extract_snapshot_access_helper}" \
            --dmg "$RUNNER_TEMP/snapshot-helper/TelevyBackup-${helper_version}.dmg" \
            --output-dir "$RUNNER_TEMP/snapshot-helper"
          echo "TELEVYBACKUP_POLICY_VERIFY_COMPONENT_IDENTITY=${policy_verify_component_identity}" >> "$GITHUB_ENV"
          bash "${policy_verify_component_identity}" \
            --reference "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" \
            --candidate "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" \
            --manifest "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json"
          echo "TELEVYBACKUP_SNAPSHOT_ACCESS_BUNDLE=$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" >> "$GITHUB_ENV"
      - name: Build arm64 package (up to 2 attempts)
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if bash scripts/macos/package-release.sh --mode release --arch arm64 --output-dir dist/arm64; then
              exit 0
            fi
            if [[ "$attempt" -eq 2 ]]; then
              echo "arm64 package build failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "arm64 package build failed; retrying (attempt 2/2)" >&2
          done
      - name: Verify reused Snapshot Access identity
        if: needs.resolve.outputs.helper_source_mode == 'reuse'
        run: bash "$TELEVYBACKUP_POLICY_VERIFY_COMPONENT_IDENTITY" --reference "$TELEVYBACKUP_SNAPSHOT_ACCESS_BUNDLE" --candidate "dist/arm64/TelevyBackup.app/Contents/Library/LoginItems/TelevyBackup Snapshot Access.app" --manifest "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-package-arm64
          path: dist/arm64
          overwrite: true

  build-x86_64:
    name: Build x86_64 package
    needs: resolve
    if: needs.resolve.outputs.enabled == 'true' && needs.resolve.outputs.reuse_artifacts != 'true'
    runs-on: macos-15-intel
    # Intel package builds can use the full compile budget before artifact upload.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.merge_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.91.0
          targets: x86_64-apple-darwin
      - name: Fingerprint macOS build platform
        id: build-platform
        shell: bash
        run: |
          fingerprint="$( { rustc --version; swiftc --version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)"
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
      - name: Cache macOS x86_64 build dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pip
            ~/Library/Caches/pip
            target
            crates/mtproto-helper/target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-macos-v2-${{ steps.build-platform.outputs.fingerprint }}-${{ hashFiles('Cargo.lock', 'crates/mtproto-helper/Cargo.lock') }}-${{ needs.resolve.outputs.merge_sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-macos-v2-${{ steps.build-platform.outputs.fingerprint }}-${{ hashFiles('Cargo.lock', 'crates/mtproto-helper/Cargo.lock') }}-
      - name: Download immutable Snapshot Access helper source
        if: needs.resolve.outputs.helper_source_mode == 'reuse'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: snapshot-helper-source
          path: ${{ runner.temp }}/snapshot-helper
      - name: Extract and verify immutable Snapshot Access helper
        if: needs.resolve.outputs.helper_source_mode == 'reuse'
        env:
          HELPER_SOURCE_TAG: ${{ needs.resolve.outputs.helper_source_tag }}
          HELPER_SOURCE_COMMIT: ${{ needs.resolve.outputs.helper_source_commit }}
          POLICY_SHA: ${{ needs.resolve.outputs.policy_sha }}
        run: |
          set -euo pipefail
          helper_version="${HELPER_SOURCE_TAG#v}"
          python3 .github/scripts/release_helper.py verify-assets \
            --asset-dir "$RUNNER_TEMP/snapshot-helper" \
            --lock packaging/macos/snapshot-components.lock.json \
            --source-tag "$HELPER_SOURCE_TAG" \
            --expected-source-commit "$HELPER_SOURCE_COMMIT"
          test -n "${POLICY_SHA}"
          git fetch --force origin main
          git cat-file -e "${POLICY_SHA}^{commit}"
          policy_extract_snapshot_access_helper="$RUNNER_TEMP/extract-snapshot-access-helper.sh"
          git show "${POLICY_SHA}:scripts/macos/extract-snapshot-access-helper.sh" > "${policy_extract_snapshot_access_helper}"
          chmod 755 "${policy_extract_snapshot_access_helper}"
          policy_verify_component_identity="$RUNNER_TEMP/verify-component-identity.sh"
          git show "${POLICY_SHA}:scripts/macos/verify-component-identity.sh" > "${policy_verify_component_identity}"
          chmod 755 "${policy_verify_component_identity}"
          bash "${policy_extract_snapshot_access_helper}" \
            --dmg "$RUNNER_TEMP/snapshot-helper/TelevyBackup-${helper_version}.dmg" \
            --output-dir "$RUNNER_TEMP/snapshot-helper"
          echo "TELEVYBACKUP_POLICY_VERIFY_COMPONENT_IDENTITY=${policy_verify_component_identity}" >> "$GITHUB_ENV"
          bash "${policy_verify_component_identity}" \
            --reference "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" \
            --candidate "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" \
            --manifest "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json"
          echo "TELEVYBACKUP_SNAPSHOT_ACCESS_BUNDLE=$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" >> "$GITHUB_ENV"
      - name: Build x86_64 package (up to 2 attempts)
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if bash scripts/macos/package-release.sh --mode release --arch x86_64 --output-dir dist/x86_64; then
              exit 0
            fi
            if [[ "$attempt" -eq 2 ]]; then
              echo "x86_64 package build failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "x86_64 package build failed; retrying (attempt 2/2)" >&2
          done
      - name: Verify reused Snapshot Access identity
        if: needs.resolve.outputs.helper_source_mode == 'reuse'
        run: bash "$TELEVYBACKUP_POLICY_VERIFY_COMPONENT_IDENTITY" --reference "$TELEVYBACKUP_SNAPSHOT_ACCESS_BUNDLE" --candidate "dist/x86_64/TelevyBackup.app/Contents/Library/LoginItems/TelevyBackup Snapshot Access.app" --manifest "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-package-x86_64
          path: dist/x86_64
          overwrite: true

  assemble:
    name: Assemble Universal 2 package
    needs: [resolve, build-arm64, build-x86_64]
    if: needs.resolve.outputs.enabled == 'true' && needs.resolve.outputs.reuse_artifacts != 'true'
    runs-on: macos-15
    outputs:
      release_assets_artifact_name: ${{ steps.release-artifact-name.outputs.name }}
    permissions:
      actions: read
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.merge_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-package-arm64
          path: dist/arm64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-package-x86_64
          path: dist/x86_64
      - name: Download immutable Snapshot Access helper source
        if: needs.resolve.outputs.helper_source_mode == 'reuse'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: snapshot-helper-source
          path: ${{ runner.temp }}/snapshot-helper
      - name: Extract and verify immutable Snapshot Access helper
        if: needs.resolve.outputs.helper_source_mode == 'reuse'
        env:
          HELPER_SOURCE_TAG: ${{ needs.resolve.outputs.helper_source_tag }}
          HELPER_SOURCE_COMMIT: ${{ needs.resolve.outputs.helper_source_commit }}
          POLICY_SHA: ${{ needs.resolve.outputs.policy_sha }}
        run: |
          set -euo pipefail
          helper_version="${HELPER_SOURCE_TAG#v}"
          python3 .github/scripts/release_helper.py verify-assets \
            --asset-dir "$RUNNER_TEMP/snapshot-helper" \
            --lock packaging/macos/snapshot-components.lock.json \
            --source-tag "$HELPER_SOURCE_TAG" \
            --expected-source-commit "$HELPER_SOURCE_COMMIT"
          test -n "${POLICY_SHA}"
          git fetch --force origin main
          git cat-file -e "${POLICY_SHA}^{commit}"
          policy_extract_snapshot_access_helper="$RUNNER_TEMP/extract-snapshot-access-helper.sh"
          git show "${POLICY_SHA}:scripts/macos/extract-snapshot-access-helper.sh" > "${policy_extract_snapshot_access_helper}"
          chmod 755 "${policy_extract_snapshot_access_helper}"
          policy_verify_component_identity="$RUNNER_TEMP/verify-component-identity.sh"
          git show "${POLICY_SHA}:scripts/macos/verify-component-identity.sh" > "${policy_verify_component_identity}"
          chmod 755 "${policy_verify_component_identity}"
          bash "${policy_extract_snapshot_access_helper}" \
            --dmg "$RUNNER_TEMP/snapshot-helper/TelevyBackup-${helper_version}.dmg" \
            --output-dir "$RUNNER_TEMP/snapshot-helper"
          echo "TELEVYBACKUP_POLICY_VERIFY_COMPONENT_IDENTITY=${policy_verify_component_identity}" >> "$GITHUB_ENV"
          bash "${policy_verify_component_identity}" \
            --reference "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" \
            --candidate "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" \
            --manifest "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json"
      - name: Assemble and validate final assets
        env:
          RUST_TOOLCHAIN: 1.91.0
          HELPER_SOURCE_MODE: ${{ needs.resolve.outputs.helper_source_mode }}
          HELPER_SOURCE_TAG: ${{ needs.resolve.outputs.helper_source_tag }}
          POLICY_SHA: ${{ needs.resolve.outputs.policy_sha }}
        run: |
          set -euo pipefail
          mkdir -p dist/final
          case "${HELPER_SOURCE_MODE}" in
            reuse) export TELEVYBACKUP_SNAPSHOT_ACCESS_SOURCE=rc1-universal-artifact ;;
            bootstrap) export TELEVYBACKUP_SNAPSHOT_ACCESS_SOURCE=one-time-bootstrap-universal-build ;;
            *) echo "invalid resolved helper source mode: ${HELPER_SOURCE_MODE}" >&2; exit 1 ;;
          esac
          arm_app="$(find dist/arm64 -maxdepth 1 -type d -name '*.app' -print -quit)"
          x86_app="$(find dist/x86_64 -maxdepth 1 -type d -name '*.app' -print -quit)"
          bash scripts/macos/assemble-universal.sh --mode release --arm64-app "$arm_app" --x86_64-app "$x86_app" --output-dir dist/final
          cp dist/arm64/TelevyBackup-*-arm64.dmg dist/final/
          cp dist/x86_64/TelevyBackup-*-x86_64.dmg dist/final/
          cp dist/arm64/televybackup-tools-*-arm64.tar.gz dist/final/
          cp dist/x86_64/televybackup-tools-*-x86_64.tar.gz dist/final/
          bash scripts/macos/generate-release-manifest.sh --mode release --asset-dir dist/final --source-commit "${{ needs.resolve.outputs.merge_sha }}" --packaging-commit "${POLICY_SHA}" --output dist/final/BUILD-MANIFEST.json
          # Keep product inputs on the recovered merge checkout, but evaluate the
          # release asset policy from the exact trusted main commit resolved above.
          test -n "${POLICY_SHA}"
          git fetch --force origin main
          git cat-file -e "${POLICY_SHA}^{commit}"
          policy_checkout="${RUNNER_TEMP}/release-policy"
          git worktree add --detach "${policy_checkout}" "${POLICY_SHA}"
          policy_cleanup() {
            git worktree remove --force "${policy_checkout}" >/dev/null 2>&1 || true
          }
          trap policy_cleanup EXIT
          # VERSION is the recovered product input; policy code and its lock remain
          # materialized from the exact trusted policy commit.
          cp "$GITHUB_WORKSPACE/VERSION" "${policy_checkout}/VERSION"
          policy_verify_release_assets="${policy_checkout}/scripts/macos/verify-release-assets.sh"
          policy_verify_app_icon_assets="${policy_checkout}/scripts/macos/verify-app-icon-assets.sh"
          policy_verify_dmg_evidence="${policy_checkout}/.github/scripts/verify-dmg-evidence.py"
          (
            cd "${policy_checkout}"
            DMG_EVIDENCE_FILE="${RUNNER_TEMP}/dmg-release-events.jsonl" \
              "${policy_verify_release_assets}" --mode release --asset-dir "$GITHUB_WORKSPACE/dist/final" --expected-source-commit "${{ needs.resolve.outputs.merge_sha }}" --expected-packaging-commit "${POLICY_SHA}"
          )
          python3 "${policy_verify_dmg_evidence}" \
            --evidence "${RUNNER_TEMP}/dmg-release-events.jsonl" \
            --asset-dir "$GITHUB_WORKSPACE/dist/final"
          bash "${policy_verify_app_icon_assets}" \
            "${policy_checkout}/assets/brand/macos/TelevyBackup.iconset" \
            "$GITHUB_WORKSPACE/dist/final/TelevyBackup.app/Contents/Resources/TelevyBackup.icns" \
            "$GITHUB_WORKSPACE/dist/final/TelevyBackup.app" \
            "${policy_checkout}/assets/brand/macos/Assets.xcassets" \
            "${policy_checkout}/assets/brand/macos/previews"
          if [[ "${HELPER_SOURCE_MODE}" == reuse ]]; then
            bash "${policy_checkout}/scripts/macos/verify-component-identity.sh" \
              --reference "$RUNNER_TEMP/snapshot-helper/TelevyBackup Snapshot Access.app" \
              --candidate "dist/final/TelevyBackup.app/Contents/Library/LoginItems/TelevyBackup Snapshot Access.app" \
              --manifest "$RUNNER_TEMP/snapshot-helper/BUILD-MANIFEST.json"
          fi
          # The app bundle is an internal verification input; release uploads are
          # limited to the regular files listed by BUILD-MANIFEST.json.
          rm -rf "$GITHUB_WORKSPACE/dist/final/TelevyBackup.app"
      - name: Check immutable release artifact receipt
        id: existing-artifact-receipt
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.resolve.outputs.merge_sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          receipt_json=""
          receipt_status=0
          if receipt_json="$(python3 .github/scripts/release_reservation.py verify-artifact-receipt \
            --state finalized --version "${VERSION}" --merge-sha "${MERGE_SHA}" \
            --repository "${GITHUB_REPOSITORY}" --token "${GH_TOKEN}" --api-root "${GITHUB_API_URL}" 2>&1)"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "artifact_name=$(printf '%s' "${receipt_json}" | jq -r '."Release-Artifact-Name"')" >> "$GITHUB_OUTPUT"
          else
            receipt_status=$?
            if [[ "${receipt_status}" == 2 ]]; then
              echo "exists=false" >> "$GITHUB_OUTPUT"
            else
              printf '%s\n' "${receipt_json}" >&2
              echo "finalized release artifact receipt is invalid" >&2
              exit 1
            fi
          fi
      - name: Resolve release artifact name
        id: release-artifact-name
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.resolve.outputs.merge_sha }}
          PACKAGING_POLICY_SHA: ${{ needs.resolve.outputs.packaging_policy_sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          HELPER_SOURCE_MODE: ${{ needs.resolve.outputs.helper_source_mode }}
          HELPER_SOURCE_TAG: ${{ needs.resolve.outputs.helper_source_tag }}
          HELPER_SOURCE_COMMIT: ${{ needs.resolve.outputs.helper_source_commit }}
        run: |
          set -euo pipefail
          reuse=false
          if [[ "${{ steps.existing-artifact-receipt.outputs.exists }}" == true ]]; then
            artifact_name="${{ steps.existing-artifact-receipt.outputs.artifact_name }}"
            reuse=true
          else
            artifact_name="release-assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            candidate_artifact_json=""
            candidate_attempt_json=""
            saw_expired_artifact=false
            run_artifacts_json="${RUNNER_TEMP}/release-run-artifacts.json"
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              | jq '{artifacts: [.[].artifacts[]?]}' > "${run_artifacts_json}"
            while IFS= read -r attempt_ref; do
              [[ -n "${attempt_ref}" ]] || continue
              attempt_value="${attempt_ref##*/}"
              attempt_parent="${attempt_ref%/*}"
              attempt_run_id="${attempt_parent##*/}"
              attempt_json="$(python3 .github/scripts/release_reservation.py verify-artifact-receipt \
                --state attempt --version "${VERSION}" --merge-sha "${MERGE_SHA}" \
                --run-id "${attempt_run_id}" --run-attempt "${attempt_value}" --local-root . 2>&1)" || {
                printf '%s\n' "${attempt_json}" >&2
                echo "artifact attempt receipt is invalid" >&2
                exit 1
              }
              expected_artifact_name="$(printf '%s' "${attempt_json}" | jq -r '."Release-Artifact-Name"')"
              artifact_row="$(jq -c --arg artifact_name "${expected_artifact_name}" --arg run_id "${attempt_run_id}" \
                '[.artifacts[]? | select(.name == $artifact_name and (.workflow_run.id | tostring) == $run_id and .expired == false)] | if length > 0 then .[0] else empty end' \
                "${run_artifacts_json}")"
              expired_row="$(jq -c --arg artifact_name "${expected_artifact_name}" --arg run_id "${attempt_run_id}" \
                '[.artifacts[]? | select(.name == $artifact_name and (.workflow_run.id | tostring) == $run_id and .expired == true)] | if length > 0 then .[0] else empty end' \
                "${run_artifacts_json}")"
              if [[ -n "${artifact_row}" ]]; then
                candidate_artifact_json="${artifact_row}"
                candidate_attempt_json="${attempt_json}"
                break
              fi
              [[ -z "${expired_row}" ]] || saw_expired_artifact=true
            done < <(git for-each-ref --sort=-refname --format='%(refname)' "refs/tags/release-artifact-attempts/v${VERSION}/${MERGE_SHA}")
            if [[ -n "${candidate_artifact_json}" ]]; then
              candidate_attempt_run_id="$(printf '%s' "${candidate_attempt_json}" | jq -r '."Release-Run-Id"')"
              candidate_attempt="$(printf '%s' "${candidate_attempt_json}" | jq -r '."Release-Run-Attempt"')"
              candidate_policy_sha="$(printf '%s' "${candidate_attempt_json}" | jq -r '."Release-Packaging-Policy-SHA"')"
              candidate_artifact_id="$(printf '%s' "${candidate_artifact_json}" | jq -r '.id | tostring')"
              candidate_artifact_digest="$(printf '%s' "${candidate_artifact_json}" | jq -r '.digest // empty')"
              [[ "${candidate_artifact_id}" =~ ^[1-9][0-9]*$ ]]
              [[ "${candidate_artifact_digest}" =~ ^sha256:[0-9a-fA-F]{64}$ ]]
              candidate_artifact_detail="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${candidate_artifact_id}")"
              jq -e \
                --arg candidate_artifact_name "$(printf '%s' "${candidate_artifact_json}" | jq -r '.name')" \
                --arg run_id "${candidate_attempt_run_id}" \
                --arg artifact_digest "${candidate_artifact_digest}" \
                '.name == $candidate_artifact_name and .expired == false and (.workflow_run.id | tostring) == $run_id and .digest == $artifact_digest and (.archive_download_url | type == "string" and length > 0)' \
                <<<"${candidate_artifact_detail}" >/dev/null
              artifact_name="$(printf '%s' "${candidate_artifact_json}" | jq -r '.name')"
              python3 .github/scripts/release_reservation.py artifact-receipt \
                --state finalized --version "${VERSION}" --merge-sha "${MERGE_SHA}" \
                --run-id "${candidate_attempt_run_id}" --run-attempt "${candidate_attempt}" \
                --packaging-policy-sha "${candidate_policy_sha}" --artifact-id "${candidate_artifact_id}" \
                --artifact-digest "${candidate_artifact_digest}" --helper-mode "${HELPER_SOURCE_MODE}" \
                --artifact-name "${artifact_name}" --helper-tag "${HELPER_SOURCE_TAG}" \
                --helper-commit "${HELPER_SOURCE_COMMIT}" --repository "${GITHUB_REPOSITORY}" \
                --token "${GH_TOKEN}" --api-root "${GITHUB_API_URL}" >/dev/null
              reuse=true
            elif [[ "${saw_expired_artifact}" == true ]]; then
              echo "a recorded release artifact is expired; refusing to rebuild it" >&2
              exit 1
            else
              python3 .github/scripts/release_reservation.py artifact-receipt \
                --state attempt --version "${VERSION}" --merge-sha "${MERGE_SHA}" \
                --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
                --packaging-policy-sha "${PACKAGING_POLICY_SHA}" --artifact-name "${artifact_name}" \
                --repository "${GITHUB_REPOSITORY}" --token "${GH_TOKEN}" --api-root "${GITHUB_API_URL}" >/dev/null
            fi
          fi
          {
            echo "name=${artifact_name}"
            echo "reuse=${reuse}"
          } >> "$GITHUB_OUTPUT"
      - name: Upload immutable release assets
        id: upload-release-assets
        if: steps.release-artifact-name.outputs.reuse != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.release-artifact-name.outputs.name }}
          path: dist/final
          overwrite: true
      - name: Record immutable release artifact receipt
        if: steps.release-artifact-name.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ needs.resolve.outputs.merge_sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          PACKAGING_POLICY_SHA: ${{ needs.resolve.outputs.packaging_policy_sha }}
          HELPER_SOURCE_MODE: ${{ needs.resolve.outputs.helper_source_mode }}
          HELPER_SOURCE_TAG: ${{ needs.resolve.outputs.helper_source_tag }}
          HELPER_SOURCE_COMMIT: ${{ needs.resolve.outputs.helper_source_commit }}
          ARTIFACT_NAME: ${{ steps.release-artifact-name.outputs.name }}
          ARTIFACT_ID: ${{ steps.upload-release-assets.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-release-assets.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release_reservation.py artifact-receipt \
            --state finalized --version "${VERSION}" --merge-sha "${MERGE_SHA}" \
            --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --packaging-policy-sha "${PACKAGING_POLICY_SHA}" --artifact-id "${ARTIFACT_ID}" \
            --artifact-digest "${ARTIFACT_DIGEST}" --helper-mode "${HELPER_SOURCE_MODE}" \
            --artifact-name "${ARTIFACT_NAME}" \
            --helper-tag "${HELPER_SOURCE_TAG}" --helper-commit "${HELPER_SOURCE_COMMIT}" \
            --repository "${GITHUB_REPOSITORY}" --token "${GH_TOKEN}" --api-root "${GITHUB_API_URL}" >/dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-dmg-verification
          path: ${{ runner.temp }}/dmg-release-events.jsonl
          if-no-files-found: error
          overwrite: true

  reuse_release_assets:
    name: Reuse immutable release assets
    needs: resolve
    if: needs.resolve.outputs.enabled == 'true' && needs.resolve.outputs.reuse_artifacts == 'true'
    runs-on: macos-15
    outputs:
      release_assets_artifact_name: ${{ needs.resolve.outputs.release_assets_artifact_name }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.recovery_policy_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable release-assets archive digest
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_URL: ${{ needs.resolve.outputs.recovery_artifact_url }}
          EXPECTED_DIGEST: ${{ needs.resolve.outputs.recovery_artifact_digest }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_DIGEST}" =~ ^sha256:[0-9a-fA-F]{64}$ ]]
          [[ "${ARCHIVE_URL}" == "${GITHUB_API_URL}"/repos/*/actions/artifacts/*/zip ]] || {
            echo "unexpected release-assets archive URL" >&2
            exit 1
          }
          archive="${RUNNER_TEMP}/release-assets.zip"
          gh api "${ARCHIVE_URL}" > "${archive}"
          actual_digest="sha256:$(shasum -a 256 "${archive}" | awk '{print $1}')"
          test "${actual_digest}" = "${EXPECTED_DIGEST}"
          unpack_dir="${RUNNER_TEMP}/release-assets-unpacked"
          rm -rf "${unpack_dir}" release-assets
          mkdir -p "${unpack_dir}" release-assets
          unzip -q "${archive}" -d "${unpack_dir}"
          if [[ -d "${unpack_dir}/release-assets" ]]; then
            cp -R "${unpack_dir}/release-assets/." release-assets/
          else
            cp -R "${unpack_dir}/." release-assets/
          fi
      - name: Verify reused release assets
        env:
          MERGE_SHA: ${{ needs.resolve.outputs.merge_sha }}
          POLICY_SHA: ${{ needs.resolve.outputs.recovery_policy_sha }}
        run: |
          set -euo pipefail
          git show "${MERGE_SHA}:VERSION" > VERSION
          DMG_EVIDENCE_FILE="${RUNNER_TEMP}/dmg-release-events.jsonl" \
            bash scripts/macos/verify-release-assets.sh \
              --mode release --asset-dir release-assets \
              --expected-source-commit "${MERGE_SHA}" \
              --expected-packaging-commit "${POLICY_SHA}"
          python3 .github/scripts/verify-dmg-evidence.py \
            --evidence "${RUNNER_TEMP}/dmg-release-events.jsonl" \
            --asset-dir release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ needs.resolve.outputs.release_assets_artifact_name }}
          path: release-assets
          overwrite: true

  macos-acceptance:
    name: Require macOS RC acceptance for stable
    needs: [resolve, assemble, reuse_release_assets]
    if: >-
      always() && needs.resolve.outputs.enabled == 'true' &&
      needs.resolve.outputs.channel == 'prod' &&
      (needs.assemble.result == 'success' || needs.reuse_release_assets.result == 'success')
    runs-on: macos-15
    permissions:
      contents: write
    environment:
      name: macos-release-acceptance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.policy_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.resolve.outputs.reuse_artifacts == 'true' && needs.reuse_release_assets.outputs.release_assets_artifact_name || needs.assemble.outputs.release_assets_artifact_name }}
          path: release-assets
      - name: Download and bind RC release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          core_version="${{ needs.resolve.outputs.version }}"
          rc_release_list="${RUNNER_TEMP}/rc-releases.json"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease,publishedAt > "$rc_release_list"
          rc_tags_json="$(python3 - "$core_version" "$rc_release_list" <<'PY'
          import json
          import pathlib
          import re
          import sys

          core, path = sys.argv[1:]
          pattern = re.compile(rf"^v{re.escape(core)}-rc\.(?P<ordinal>[1-9][0-9]*)$")
          releases = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
          candidates = []
          for release in releases:
              if release.get("isDraft") is not False or release.get("isPrerelease") is not True:
                  continue
              tag = release.get("tagName")
              match = pattern.fullmatch(tag or "")
              if match:
                  candidates.append((int(match.group("ordinal")), tag))
          candidates.sort()
          if len(candidates) < 2:
              raise SystemExit(f"stable release requires two published RCs for {core}; found {len(candidates)}")
          print(json.dumps([tag for _, tag in candidates[-2:]]))
          PY
          )"
          rc1_tag="$(printf '%s' "$rc_tags_json" | jq -r '.[0]')"
          rc2_tag="$(printf '%s' "$rc_tags_json" | jq -r '.[1]')"
          printf 'RC1_TAG=%s\nRC2_TAG=%s\n' "$rc1_tag" "$rc2_tag" >> "$GITHUB_ENV"
          for index in 0 1; do
            rc_tag="$(printf '%s' "$rc_tags_json" | jq -r ".[$index]")"
            rc_version="${rc_tag#v}"
            rc_dir="release-rc/rc$((index + 1))"
            mkdir -p "${rc_dir}"
            gh release download "${rc_tag}" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "TelevyBackup-${rc_version}.dmg" \
              --pattern "BUILD-MANIFEST.json" \
              --pattern "SHA256SUMS" \
              --dir "${rc_dir}"
            git fetch --force origin "refs/tags/${rc_tag}:refs/tags/${rc_tag}"
            python3 .github/scripts/release_chain.py verify-tag-provenance --tag "${rc_tag}"
            source_commit="$(git rev-list -n 1 "${rc_tag}^{commit}")"
            echo "RC$((index + 1))_VERSION=${rc_version}" >> "$GITHUB_ENV"
            echo "RC$((index + 1))_SOURCE_COMMIT=${source_commit}" >> "$GITHUB_ENV"
          done
      - name: Verify downloaded RC DMG layouts
        run: |
          set -euo pipefail
          for rc_number in 1 2; do
            rc_version_var="RC${rc_number}_VERSION"
            rc_version="${!rc_version_var}"
            bash scripts/macos/verify-dmg-layout.sh \
              --dmg "release-rc/rc${rc_number}/TelevyBackup-${rc_version}.dmg"
          done
      - name: Verify manual RC1 to RC2 acceptance evidence
        env:
          ACCEPTANCE_EVIDENCE: ${{ vars.TELEVYBACKUP_MACOS_RC_ACCEPTANCE_EVIDENCE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          core_version="${{ needs.resolve.outputs.version }}"
          rc1_tag="${RC1_TAG}"
          rc2_tag="${RC2_TAG}"
          screenshot_dir="${RUNNER_TEMP}/finder-acceptance-screenshots"
          mkdir -p "${screenshot_dir}"
          screenshot_names=()
          receipt_names=()
          signature_names=()
          while IFS= read -r screenshot_name; do
            [[ -n "${screenshot_name}" ]] && screenshot_names+=("${screenshot_name}")
          done < <(python3 - "${ACCEPTANCE_EVIDENCE}" <<'PY'
          import json
          import pathlib
          import re
          import sys

          records = json.loads(sys.argv[1]).get("finder_acceptance")
          if not isinstance(records, list) or len(records) != 2:
              raise SystemExit("finder_acceptance must contain exactly two records")
          names = []
          for record in records:
              name = record.get("screenshot") if isinstance(record, dict) else None
              if (not isinstance(name, str) or not name or name != pathlib.Path(name).name
                      or name.startswith(".") or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", name)):
                  raise SystemExit("finder acceptance screenshot names must be safe basenames")
              names.append(name)
          if len(set(names)) != len(names):
              raise SystemExit("finder acceptance screenshot names must be distinct")
          print("\n".join(names))
          PY
          )
          while IFS= read -r receipt_name; do
            [[ -n "${receipt_name}" ]] && receipt_names+=("${receipt_name}")
          done < <(python3 - "${ACCEPTANCE_EVIDENCE}" <<'PY'
          import json, pathlib, re, sys
          records = json.loads(sys.argv[1]).get("finder_acceptance")
          names = []
          for record in records or []:
              name = record.get("capture_receipt_asset") if isinstance(record, dict) else None
              if (not isinstance(name, str) or name != pathlib.Path(name).name
                      or not re.fullmatch(r"finder-acceptance-(?:macos-15|current)\.json", name)):
                  raise SystemExit("finder acceptance receipt names must be safe basenames")
              names.append(name)
          if len(names) != 2 or len(set(names)) != 2:
              raise SystemExit("finder acceptance receipt names must be distinct")
          print("\n".join(names))
          PY
          )
          while IFS= read -r signature_name; do
            [[ -n "${signature_name}" ]] && signature_names+=("${signature_name}")
          done < <(python3 - "${ACCEPTANCE_EVIDENCE}" <<'PY'
          import json, pathlib, re, sys
          records = json.loads(sys.argv[1]).get("finder_acceptance")
          names = []
          for record in records or []:
              name = record.get("capture_signature_asset") if isinstance(record, dict) else None
              if (not isinstance(name, str) or name != pathlib.Path(name).name
                      or not re.fullmatch(r"finder-acceptance-(?:macos-15|current)\.sig", name)):
                  raise SystemExit("finder acceptance signature names must be safe basenames")
              names.append(name)
          if len(names) != 2 or len(set(names)) != 2:
              raise SystemExit("finder acceptance signature names must be distinct")
          print("\n".join(names))
          PY
          )
          for screenshot_name in "${screenshot_names[@]}"; do
            gh release download "${rc2_tag}" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "${screenshot_name}" \
              --dir "${screenshot_dir}"
          done
          for receipt_name in "${receipt_names[@]}"; do
            gh release download "${rc2_tag}" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "${receipt_name}" \
              --dir "${screenshot_dir}"
          done
          for signature_name in "${signature_names[@]}"; do
            gh release download "${rc2_tag}" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "${signature_name}" \
              --dir "${screenshot_dir}"
          done
          rc1_json="$(gh release view "$rc1_tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)"
          rc2_json="$(gh release view "$rc2_tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease)"
          python3 - "$rc1_json" "$rc2_json" <<'PY'
          import json, sys
          for raw in sys.argv[1:]:
              state = json.loads(raw)
              assert state["isDraft"] is False
              assert state["isPrerelease"] is True
          PY
          python3 .github/scripts/verify-macos-rc-acceptance.py \
            --evidence "$ACCEPTANCE_EVIDENCE" \
            --manifest release-assets/BUILD-MANIFEST.json \
            --checksums release-assets/SHA256SUMS \
            --stable-dmg "release-assets/TelevyBackup-${core_version}.dmg" \
            --stable-version "$core_version" \
            --rc1-tag "$rc1_tag" \
            --rc2-tag "$rc2_tag" \
            --stable-source-commit "${{ needs.resolve.outputs.merge_sha }}" \
            --rc1-manifest release-rc/rc1/BUILD-MANIFEST.json \
            --rc1-checksums release-rc/rc1/SHA256SUMS \
            --rc1-dmg "release-rc/rc1/TelevyBackup-${RC1_VERSION}.dmg" \
            --rc1-source-commit "$RC1_SOURCE_COMMIT" \
            --rc2-manifest release-rc/rc2/BUILD-MANIFEST.json \
            --rc2-checksums release-rc/rc2/SHA256SUMS \
            --rc2-dmg "release-rc/rc2/TelevyBackup-${RC2_VERSION}.dmg" \
            --rc2-source-commit "$RC2_SOURCE_COMMIT" \
            --screenshot-dir "$screenshot_dir" \
            --capture-receipt-dir "$screenshot_dir" \
            --capture-signature-dir "$screenshot_dir"

  publish:
    name: Publish GitHub Release
    needs: [resolve, assemble, reuse_release_assets, macos-acceptance]
    if: >-
      always() && needs.resolve.outputs.enabled == 'true' &&
      (needs.assemble.result == 'success' || needs.reuse_release_assets.result == 'success') &&
      (needs.resolve.outputs.channel != 'prod' || needs.macos-acceptance.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PRODUCT_TAG: ${{ needs.resolve.outputs.tag }}
      PRODUCT_VERSION: ${{ needs.resolve.outputs.version }}
      PRODUCT_CHANNEL: ${{ needs.resolve.outputs.channel }}
      RELEASE_SHA: ${{ needs.resolve.outputs.merge_sha }}
      PR_HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
      RELEASE_STATE: ${{ needs.resolve.outputs.release_state }}
      RESERVATION_ID: ${{ needs.resolve.outputs.reservation_id }}
      RESERVATION_REF: ${{ needs.resolve.outputs.reservation_ref }}
      RESERVATION_OWNER: ${{ needs.resolve.outputs.reservation_owner }}
      CLAIM_KEY: ${{ needs.resolve.outputs.claim_key }}
      BOUNDARY_TOKEN: ${{ needs.resolve.outputs.boundary_token }}
      BOUND_IDENTITY: ${{ needs.resolve.outputs.bound_identity }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.resolve.outputs.policy_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.resolve.outputs.reuse_artifacts == 'true' && needs.reuse_release_assets.outputs.release_assets_artifact_name || needs.assemble.outputs.release_assets_artifact_name }}
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-intent
          path: release-intent
      - name: Create or verify immutable product tag
        run: |
          set -euo pipefail
          push_annotated_tag() {
            local encoded_auth
            # GitHub can reject REST ref creation for a historical product
            # commit that differs from current main in workflow files. The
            # Actions token can still publish the same verified annotated tag
            # through Git transport without an additional credential.
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              tag --annotate --force "${PRODUCT_TAG}" "${RELEASE_SHA}" --message "${PRODUCT_TAG}"
            encoded_auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${encoded_auth}" \
              push origin "refs/tags/${PRODUCT_TAG}:refs/tags/${PRODUCT_TAG}"
          }
          git fetch --force origin main '+refs/tags/*:refs/tags/*'
          if [[ "${BOUND_IDENTITY}" != present ]]; then
            python3 .github/scripts/release_chain.py verify-release-sequence --version "${PRODUCT_VERSION}" --expected-sha "${RELEASE_SHA}"
          fi
          tag_json="$(python3 .github/scripts/release_chain.py verify-tag --version "${PRODUCT_VERSION}" --expected-sha "${RELEASE_SHA}" --allow-existing)"
          status="$(printf '%s' "${tag_json}" | jq -r .status)"
          if [[ "${status}" == available ]]; then
            tag_object_sha="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag="${PRODUCT_TAG}" -f message="${PRODUCT_TAG}" \
              -f object="${RELEASE_SHA}" -f type=commit --jq '.sha')"
            if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${PRODUCT_TAG}" -f sha="${tag_object_sha}" >/dev/null; then
              if ! push_annotated_tag; then
                git fetch --force origin "refs/tags/${PRODUCT_TAG}:refs/tags/${PRODUCT_TAG}"
              fi
            fi
          fi
          git fetch --force origin "refs/tags/${PRODUCT_TAG}:refs/tags/${PRODUCT_TAG}"
          python3 .github/scripts/release_chain.py verify-tag --version "${PRODUCT_VERSION}" --expected-sha "${RELEASE_SHA}" --allow-existing
      - name: Create or update GitHub Release
        run: |
          set -euo pipefail
          runtime_state="${RELEASE_STATE}"
          release_output=""
          release_id=""
          find_draft_release() {
            local releases candidate_count
            releases="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
            candidate_count="$(printf '%s' "${releases}" | jq --arg tag "${PRODUCT_TAG}" '[.[]? | select(.draft == true and .tag_name == $tag)] | length')"
            if [[ "${candidate_count}" -gt 1 ]]; then
              echo "release_state_conflict: multiple draft Releases exist for ${PRODUCT_TAG}" >&2
              return 1
            fi
            if [[ "${candidate_count}" == 1 ]]; then
              printf '%s' "${releases}" | jq -c --arg tag "${PRODUCT_TAG}" '[.[]? | select(.draft == true and .tag_name == $tag)][0]'
            fi
          }
          if release_output="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PRODUCT_TAG}" 2>&1)"; then
            release_id="$(printf '%s' "${release_output}" | jq -r '.id | tostring')"
            is_draft="$(printf '%s' "${release_output}" | jq -r '.draft | tostring')"
            is_prerelease="$(printf '%s' "${release_output}" | jq -r '.prerelease | tostring')"
            is_latest=false
            expected_prerelease=false
            expected_latest=false
            if [[ "${PRODUCT_CHANNEL}" != prod ]]; then
              expected_prerelease=true
            elif [[ "${is_draft}" == false ]]; then
              latest_output=""
              if ! latest_output="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" 2>&1)"; then
                printf '%s\n' "${latest_output}" >&2
                echo "release_state_conflict: unable to resolve latest GitHub Release" >&2
                exit 1
              fi
              latest_tag="$(printf '%s' "${latest_output}" | jq -r '.tag_name // empty')"
              if [[ -z "${latest_tag}" ]]; then
                echo "release_state_conflict: latest GitHub Release has no tag" >&2
                exit 1
              fi
              if [[ "${latest_tag}" == "${PRODUCT_TAG}" ]]; then
                is_latest=true
              fi
              expected_latest=true
            fi
            if [[ "${is_prerelease}" != "${expected_prerelease}" || "${is_latest}" != "${expected_latest}" ]]; then
              echo "release_state_conflict: GitHub Release channel flags do not match ${PRODUCT_CHANNEL}" >&2
              exit 1
            fi
            case "${is_draft}" in
              true) runtime_state=draft ;;
              false) runtime_state=published ;;
              *) echo "release_state_conflict: invalid GitHub Release state" >&2; exit 1 ;;
            esac
          else
            if ! printf '%s' "${release_output}" | grep -qiE '404|not found'; then
              printf '%s\n' "${release_output}" >&2
              echo "release_state_conflict: unable to resolve GitHub Release state" >&2
              exit 1
            fi
            draft_release="$(find_draft_release)"
            if [[ -n "${draft_release}" ]]; then
              release_output="${draft_release}"
              release_id="$(printf '%s' "${release_output}" | jq -r '.id | tostring')"
              draft_prerelease="$(printf '%s' "${release_output}" | jq -r '.prerelease | tostring')"
              expected_draft_prerelease=false
              [[ "${PRODUCT_CHANNEL}" != prod ]] && expected_draft_prerelease=true
              if [[ "${draft_prerelease}" != "${expected_draft_prerelease}" ]]; then
                echo "release_state_conflict: draft Release channel flags do not match ${PRODUCT_CHANNEL}" >&2
                exit 1
              fi
              runtime_state=draft
            fi
          fi
          if [[ "${runtime_state}" == published ]]; then
            echo "Product release became published for ${PRODUCT_TAG}; no asset overwrite"
          else
            release_files=()
            release_asset_list="${RUNNER_TEMP}/release-asset-list.txt"
            python3 - "release-assets" > "${release_asset_list}" <<'PY'
          import json
          import os
          import re
          import stat
          import sys

          asset_dir = sys.argv[1]
          manifest_path = os.path.join(asset_dir, "BUILD-MANIFEST.json")
          with open(manifest_path, encoding="utf-8") as handle:
              manifest = json.load(handle)
          expected = {"BUILD-MANIFEST.json", "SHA256SUMS"}
          for asset in manifest.get("assets", []):
              name = asset.get("name") if isinstance(asset, dict) else None
              if not isinstance(name, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", name):
                  raise SystemExit("BUILD-MANIFEST.json contains an unsafe release asset name")
              if name in expected:
                  raise SystemExit(f"BUILD-MANIFEST.json contains a reserved release asset name: {name}")
              expected.add(name)
          actual = set(os.listdir(asset_dir))
          if actual != expected:
              extra = sorted(actual - expected)
              missing = sorted(expected - actual)
              raise SystemExit(
                  f"release-assets set does not match BUILD-MANIFEST.json: extra={extra!r} missing={missing!r}"
              )
          for name in sorted(expected):
              path = os.path.join(asset_dir, name)
              if not stat.S_ISREG(os.lstat(path).st_mode):
                  raise SystemExit(f"release asset must be a regular file: {name}")
              print(name)
          PY
            while IFS= read -r asset_name; do release_files+=("release-assets/${asset_name}"); done < "${release_asset_list}"
            ((${#release_files[@]} > 0))
            if [[ "${runtime_state}" == missing ]]; then
              flags=(--draft --verify-tag --title "${PRODUCT_TAG}" --generate-notes)
              if [[ "${PRODUCT_CHANNEL}" != prod ]]; then
                flags+=(--prerelease --latest=false)
              else
                flags+=(--latest=true)
              fi
              gh release create "${PRODUCT_TAG}" "${flags[@]}" >/dev/null
              runtime_state=draft
              for _ in 1 2 3; do
                draft_release="$(find_draft_release)"
                if [[ -n "${draft_release}" ]]; then
                  release_output="${draft_release}"
                  release_id="$(printf '%s' "${release_output}" | jq -r '.id | tostring')"
                  break
                fi
                sleep 2
              done
              [[ -n "${release_id}" ]] || {
                echo "release_state_conflict: created draft Release could not be resolved" >&2
                exit 1
              }
            fi
            if [[ "${runtime_state}" == draft ]]; then
              latest_release=""
              if ! latest_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" 2>&1)"; then
                printf '%s\n' "${latest_release}" >&2
                echo "release_state_conflict: unable to recheck draft Release state" >&2
                exit 1
              fi
              if [[ "$(printf '%s' "${latest_release}" | jq -r '.draft | tostring')" != true ]]; then
                echo "release_state_conflict: Release became published before asset upload" >&2
                exit 1
              fi
              upload_missing_release_assets() {
                local asset asset_name expected_digest existing_count existing_digest current_release
                for asset in "${release_files[@]}"; do
                  asset_name="$(basename "${asset}")"
                  expected_digest="$(shasum -a 256 "${asset}" | awk '{print $1}')"
                  current_release=""
                  if ! current_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" 2>&1)"; then
                    printf '%s\n' "${current_release}" >&2
                    echo "release_state_conflict: unable to read draft Release before ${asset_name}" >&2
                    return 1
                  fi
                  if [[ "$(printf '%s' "${current_release}" | jq -r '.draft | tostring')" != true ]]; then
                    echo "release_state_conflict: Release became published before inspecting ${asset_name}" >&2
                    return 1
                  fi
                  existing_count="$(printf '%s' "${current_release}" | jq --arg name "${asset_name}" '[.assets[]? | select(.name == $name)] | length')"
                  if [[ "${existing_count}" != 0 && "${existing_count}" != 1 ]]; then
                    echo "release_state_conflict: duplicate Release assets named ${asset_name}" >&2
                    return 1
                  fi
                  if [[ "${existing_count}" == 1 ]]; then
                    existing_digest="$(printf '%s' "${current_release}" | jq -r --arg name "${asset_name}" '.assets[] | select(.name == $name) | .digest // empty')"
                    if [[ "${existing_digest}" != "sha256:${expected_digest}" ]]; then
                      echo "release_state_conflict: existing asset digest mismatch for ${asset_name}" >&2
                      return 1
                    fi
                    echo "reusing matching draft Release asset ${asset_name}"
                  else
                    # GitHub's asset upload API has no conditional draft precondition;
                    # the immediate state check, no-clobber upload, and final recheck
                    # fail closed for races that cannot be made atomic remotely.
                    gh api --method POST \
                      -H "Content-Type: application/octet-stream" \
                      "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${asset_name}" \
                      --input "${asset}" >/dev/null
                  fi
                done
              }
              upload_missing_release_assets
              final_release=""
              if ! final_release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" 2>&1)"; then
                printf '%s\n' "${final_release}" >&2
                echo "release_state_conflict: unable to verify draft Release after asset upload" >&2
                exit 1
              fi
              if [[ "$(printf '%s' "${final_release}" | jq -r '.draft | tostring')" != true ]]; then
                echo "release_state_conflict: Release became published during asset upload" >&2
                exit 1
              fi
              expected_assets='[]'
              for asset in "${release_files[@]}"; do
                asset_name="$(basename "${asset}")"
                expected_digest="$(shasum -a 256 "${asset}" | awk '{print $1}')"
                expected_assets="$(printf '%s' "${expected_assets}" | jq -c --arg name "${asset_name}" --arg digest "sha256:${expected_digest}" '. + [{name: $name, digest: $digest}]')"
              done
              expected_assets="$(printf '%s' "${expected_assets}" | jq -c 'sort_by(.name)')"
              actual_assets="$(printf '%s' "${final_release}" | jq -c '[.assets[]? | {name, digest}] | sort_by(.name)')"
              if [[ "${actual_assets}" != "${expected_assets}" ]]; then
                echo "release_state_conflict: final Release asset set or digest does not match release-assets" >&2
                exit 1
              fi
              if [[ "${PRODUCT_CHANNEL}" == prod ]]; then
                gh release edit "${PRODUCT_TAG}" --draft=false --latest=true
              else
                gh release edit "${PRODUCT_TAG}" --draft=false --prerelease --latest=false
              fi
            fi
          fi
      - name: Append consumed receipt
        run: |
          set -euo pipefail
          python3 .github/scripts/release_reservation.py receipt \
            --state consumed --version "${PRODUCT_VERSION}" --merge-sha "${RELEASE_SHA}" \
            --reservation-id "${RESERVATION_ID}" --owner "${RESERVATION_OWNER}" \
            --claim-key "${CLAIM_KEY}" --boundary-token "${BOUNDARY_TOKEN}" \
            --reservation-ref "${RESERVATION_REF}" --repository "${GITHUB_REPOSITORY}" \
            --token "${GH_TOKEN}" --api-root "${GITHUB_API_URL}" --pr-head "${PR_HEAD_SHA}"

  skipped:
    name: Release skipped
    needs: resolve
    if: needs.resolve.outputs.enabled != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Release skipped: ${{ needs.resolve.outputs.reason }} (${{ needs.resolve.outputs.identity_status }})"
