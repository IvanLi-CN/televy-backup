name: Label Gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate
        required: true
        type: string

concurrency:
  group: label-gate-${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || inputs.pr_number || github.ref }}
  queue: max

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  label-gate:
    name: Release intent label gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Resolve trusted main SHA
        if: github.event_name == 'workflow_dispatch'
        id: trusted-main
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${main_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "sha=${main_sha}" >> "$GITHUB_OUTPUT"
      - name: Checkout trusted gate scripts (base)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Checkout trusted gate scripts (bootstrap dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.trusted-main.outputs.sha }}
          persist-credentials: false

      - name: Verify workflow dispatch targets current pull request head
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.trusted-main.outputs.sha }}"
          test -n "${PR_NUMBER}"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/dispatch-pr.json"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg head_ref "${GITHUB_REF_NAME}" \
            --arg head_sha "${GITHUB_SHA}" \
            '.state == "open" and .base.ref == "main" and .head.repo.full_name == $repository and .head.ref == $head_ref and .head.sha == $head_sha' \
            "${RUNNER_TEMP}/dispatch-pr.json" >/dev/null

      - name: Checkout trusted merge-group gate scripts
        if: github.event_name == 'merge_group'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.merge_group.base_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Validate release intent + channel labels
        if: github.event_name != 'merge_group'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || inputs.pr_number }}
        run: bash ./.github/scripts/label-gate.sh

      - name: Validate merge-group release labels
        if: github.event_name == 'merge_group'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: bash ./.github/scripts/merge-group-release-gate.sh labels
