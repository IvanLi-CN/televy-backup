name: Prepare product version

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request to prepare
        required: true
        type: string
      release_target:
        description: patch, minor, major, or an explicit product SemVer
        required: true
        type: string
      release_mode:
        description: Preparation boundary
        required: true
        default: normal
        type: choice
        options:
          - normal
          - version-only-release-pr
      covered_merge_sha:
        description: Required only for version-only-release-pr recovery
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: read
  checks: read

concurrency:
  group: prepare-product-version-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare manual release target
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TARGET: ${{ inputs.release_target }}
    steps:
      - name: Resolve trusted main SHA
        id: trusted-main
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${main_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "sha=${main_sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted release policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.trusted-main.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted main checkout
        env:
          POLICY_SHA: ${{ steps.trusted-main.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "${POLICY_SHA}"

      - name: Configure GitHub Actions identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Resolve pull request and source checks
        id: pr
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          TRUSTED_MAIN_SHA: ${{ steps.trusted-main.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_TARGET}" == "${RELEASE_TARGET// /}" && -n "${RELEASE_TARGET}" ]]
          python3 - "${RELEASE_TARGET}" <<'PY'
          import sys
          sys.path.insert(0, '.github/scripts')
          import release_chain
          release_chain.parse_release_target(sys.argv[1])
          PY
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/pull-request.json"
          test "$(jq -r '.state' "${RUNNER_TEMP}/pull-request.json")" = open
          test "$(jq -r '.base.ref' "${RUNNER_TEMP}/pull-request.json")" = main
          test "$(jq -r '.head.repo.full_name // empty' "${RUNNER_TEMP}/pull-request.json")" = "${GITHUB_REPOSITORY}"
          source_sha="$(jq -r '.head.sha' "${RUNNER_TEMP}/pull-request.json")"
          base_sha="$(jq -r '.base.sha' "${RUNNER_TEMP}/pull-request.json")"
          head_ref="$(jq -r '.head.ref' "${RUNNER_TEMP}/pull-request.json")"
          [[ "${source_sha}" =~ ^[0-9a-fA-F]{40}$ && "${base_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          if [[ "${base_sha}" != "${TRUSTED_MAIN_SHA}" ]]; then
            echo "PR base ${base_sha} is not current trusted main ${TRUSTED_MAIN_SHA}; refresh the PR before preparation" >&2
            exit 1
          fi
          git check-ref-format --branch "${head_ref}" >/dev/null
          git fetch --force --tags origin
          git fetch --no-tags origin "${source_sha}" "${base_sha}"
          verification_sha="${source_sha}"
          if prepared_json="$(python3 .github/scripts/release_chain.py find-prepared --commit "${source_sha}" --base "${base_sha}" 2>/dev/null)"; then
            preparation_sha="$(printf '%s' "${prepared_json}" | jq -r .preparationSha)"
            if [[ "${preparation_sha}" == "${source_sha}" ]]; then
              verification_sha="$(printf '%s' "${prepared_json}" | jq -r .sourceSha)"
            fi
            test "$(printf '%s' "${prepared_json}" | jq -r .releaseTarget)" = "${RELEASE_TARGET}"
          fi
          gh api "repos/${GITHUB_REPOSITORY}/commits/${verification_sha}/check-runs?filter=latest&per_page=100" > "${RUNNER_TEMP}/check-runs.json"
          source_checks_ready="$(python3 - "${RUNNER_TEMP}/check-runs.json" <<'PY'
          import json
          import sys
          sys.path.insert(0, '.github/scripts')
          from release_preparation import source_checks_ready
          print(str(source_checks_ready(json.load(open(sys.argv[1], encoding='utf-8')))).lower())
          PY
          )"
          {
            echo "number=${PR_NUMBER}"
            echo "source_sha=${source_sha}"
            echo "verification_sha=${verification_sha}"
            echo "base_sha=${base_sha}"
            echo "head_ref=${head_ref}"
            echo "source_checks_ready=${source_checks_ready}"
          } >> "$GITHUB_OUTPUT"

      - name: Reserve target identity before preparation
        id: reserve
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SOURCE_SHA: ${{ steps.pr.outputs.source_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          TRUSTED_MAIN_SHA: ${{ steps.trusted-main.outputs.sha }}
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${current_main_sha}" == "${TRUSTED_MAIN_SHA}" ]]
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/current-pr-before-reservation.json"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg base_sha "${BASE_SHA}" \
            --arg current_main_sha "${current_main_sha}" \
            '.state == "open" and .base.ref == "main" and .base.repo.full_name == $repository and .head.repo.full_name == $repository and .head.sha == $source_sha and .base.sha == $base_sha and .base.sha == $current_main_sha' \
            "${RUNNER_TEMP}/current-pr-before-reservation.json" >/dev/null
          if [[ "${{ steps.pr.outputs.source_checks_ready }}" != true ]]; then
            echo "source checks are not complete; no reservation or VERSION commit will be created"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          claim_key="$(python3 - "${PR_NUMBER}" "${RELEASE_TARGET}" <<'PY'
          import sys
          sys.path.insert(0, '.github/scripts')
          import release_chain
          print(release_chain.manual_claim_key(sys.argv[1], sys.argv[2]))
          PY
          )"
          claim_json=""
          claim_status=2
          claim_error="${RUNNER_TEMP}/reservation-claim-error.txt"
          if claim_json="$(python3 .github/scripts/release_reservation.py find-claim \
              --claim-key "${claim_key}" --owner github-actions[bot] \
              --release-target "${RELEASE_TARGET}" \
              --release-policy televybackup-manual-semver-v1 2>"${claim_error}")"; then
            claim_status=0
          else
            claim_status=$?
          fi
          if [[ "${claim_status}" != 0 && "${claim_status}" != 2 ]]; then
            cat "${claim_error}" >&2
            exit 1
          fi
          if prepared_json="$(python3 .github/scripts/release_chain.py find-prepared --commit "${SOURCE_SHA}" --base "${BASE_SHA}" 2>/dev/null)"; then
            reservation_source_sha="$(printf '%s' "${prepared_json}" | jq -r '.reservationSourceSha // .sourceSha')"
            reservation_source_tree="$(git rev-parse "${reservation_source_sha}^{tree}")"
            jq -n \
              --arg sourceSha "${reservation_source_sha}" \
              --arg sourceTreeSha "${reservation_source_tree}" \
              --arg channel "$(printf '%s' "${prepared_json}" | jq -r .channel)" \
              --arg version "$(printf '%s' "${prepared_json}" | jq -r .version)" \
              --arg releaseTarget "$(printf '%s' "${prepared_json}" | jq -r .releaseTarget)" \
              --arg policy "$(printf '%s' "${prepared_json}" | jq -r .policy)" \
              --arg reservation_id "$(printf '%s' "${prepared_json}" | jq -r .reservationId)" \
              --arg ref "$(printf '%s' "${prepared_json}" | jq -r .reservationRef)" \
              --arg owner "$(printf '%s' "${prepared_json}" | jq -r .reservationOwner)" \
              --arg claim_key "$(printf '%s' "${prepared_json}" | jq -r .claimKey)" \
              --arg boundary_token "$(printf '%s' "${prepared_json}" | jq -r .boundaryToken)" \
              '{sourceSha:$sourceSha,sourceTreeSha:$sourceTreeSha,channel:$channel,version:$version,releaseTarget:$releaseTarget,policy:$policy,reservationId:$reservation_id,ref:$ref,"Reservation-Owner":$owner,"Reservation-Claim-Key":$claim_key,"Reservation-Boundary-Token":$boundary_token}' \
              > "${RUNNER_TEMP}/reservation.json"
          elif [[ "${claim_status}" == 0 ]]; then
            reservation_source_sha="$(printf '%s' "${claim_json}" | jq -r .sourceSha)"
            if ! git merge-base --is-ancestor "${reservation_source_sha}" "${SOURCE_SHA}"; then
              echo "existing reservation source is not an ancestor of the current PR head" >&2
              exit 1
            fi
            jq -n \
              --arg sourceSha "${reservation_source_sha}" \
              --arg sourceTreeSha "$(printf '%s' "${claim_json}" | jq -r .sourceTreeSha)" \
              --arg channel "$(printf '%s' "${claim_json}" | jq -r .channel)" \
              --arg version "$(printf '%s' "${claim_json}" | jq -r .version)" \
              --arg releaseTarget "$(printf '%s' "${claim_json}" | jq -r .releaseTarget)" \
              --arg policy "$(printf '%s' "${claim_json}" | jq -r .policy)" \
              --arg reservation_id "$(printf '%s' "${claim_json}" | jq -r .reservationId)" \
              --arg ref "$(printf '%s' "${claim_json}" | jq -r .ref)" \
              --arg owner "$(printf '%s' "${claim_json}" | jq -r '."Reservation-Owner"')" \
              --arg claim_key "$(printf '%s' "${claim_json}" | jq -r '."Reservation-Claim-Key"')" \
              --arg boundary_token "$(printf '%s' "${claim_json}" | jq -r '."Reservation-Boundary-Token"')" \
              '{sourceSha:$sourceSha,sourceTreeSha:$sourceTreeSha,channel:$channel,version:$version,releaseTarget:$releaseTarget,policy:$policy,reservationId:$reservation_id,ref:$ref,"Reservation-Owner":$owner,"Reservation-Claim-Key":$claim_key,"Reservation-Boundary-Token":$boundary_token}' \
              > "${RUNNER_TEMP}/reservation.json"
          else
            resolved="$(python3 .github/scripts/release_chain.py resolve-target --release-target "${RELEASE_TARGET}")"
            version="$(printf '%s' "${resolved}" | jq -r .version)"
            channel="$(printf '%s' "${resolved}" | jq -r .channel)"
            python3 .github/scripts/release_reservation.py reserve \
              --source-sha "${SOURCE_SHA}" \
              --version "${version}" \
              --channel "${channel}" \
              --release-target "${RELEASE_TARGET}" \
              --release-policy "$(printf '%s' "${resolved}" | jq -r .policy)" \
              --owner github-actions[bot] \
              --claim-key "${claim_key}" \
              --repository "${GITHUB_REPOSITORY}" \
              --token "${GH_TOKEN}" \
              --api-root "${GITHUB_API_URL}" \
              --output "${RUNNER_TEMP}/reservation.json"
          fi
          python3 - "${RUNNER_TEMP}/reservation.json" <<'PY'
          import json
          import os
          import pathlib
          import sys
          sys.path.insert(0, '.github/scripts')
          import release_reservation
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          release_reservation.verify_github_reservation(
              value, repository=os.environ['GITHUB_REPOSITORY'], token=os.environ['GH_TOKEN'],
              api_root=os.environ.get('GITHUB_API_URL', 'https://api.github.com'),
          )
          PY
          jq -e --arg target "${RELEASE_TARGET}" '.version and .releaseTarget == $target and .policy == "televybackup-manual-semver-v1" and .reservationId and .ref' "${RUNNER_TEMP}/reservation.json" >/dev/null
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version "${RUNNER_TEMP}/reservation.json")" >> "$GITHUB_OUTPUT"

      - name: Stage VERSION-only preparation payload
        id: prepare
        if: steps.reserve.outputs.ready == 'true'
        env:
          RELEASE_MODE: ${{ inputs.release_mode || 'normal' }}
          COVERED_MERGE_SHA: ${{ inputs.covered_merge_sha || '' }}
        run: |
          set -euo pipefail
          git worktree add --detach "${RUNNER_TEMP}/release-source" "${{ steps.pr.outputs.source_sha }}"
          python3 .github/scripts/release_preparation.py \
            --repo-root "${RUNNER_TEMP}/release-source" \
            --source-sha "${{ steps.pr.outputs.source_sha }}" \
            --base-sha "${{ steps.pr.outputs.base_sha }}" \
            --release-target "${RELEASE_TARGET}" \
            --checks-json "${RUNNER_TEMP}/check-runs.json" \
            --release-mode "${RELEASE_MODE}" \
            --covered-merge-sha "${COVERED_MERGE_SHA}" \
            --reservation-json "${RUNNER_TEMP}/reservation.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --token "${GH_TOKEN}" \
            --api-root "${GITHUB_API_URL}" \
            --provenance github-native-verified \
            --github-output "$GITHUB_OUTPUT"

      - name: Create GitHub-signed VERSION commit on the pull request
        id: create-version
        if: steps.prepare.outputs.prepared == 'created'
        env:
          RELEASE_SHA: ${{ steps.prepare.outputs.release_sha }}
          SOURCE_SHA: ${{ steps.pr.outputs.source_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          source_root="${RUNNER_TEMP}/release-source"
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${current_main_sha}" == "${BASE_SHA}" ]]
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/current-pr-before-version.json"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg source_sha "${SOURCE_SHA}" \
            --arg base_sha "${BASE_SHA}" \
            --arg current_main_sha "${current_main_sha}" \
            '.state == "open" and .base.ref == "main" and .base.repo.full_name == $repository and .head.repo.full_name == $repository and .head.sha == $source_sha and .base.sha == $base_sha and .base.sha == $current_main_sha' \
            "${RUNNER_TEMP}/current-pr-before-version.json" >/dev/null
          test "$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk 'NR == 1 { print $1 }')" = "${SOURCE_SHA}"
          version_content="$(base64 < "${source_root}/VERSION" | tr -d '\n')"
          headline="$(git -C "${source_root}" show -s --format=%s "${RELEASE_SHA}")"
          body="$(git -C "${source_root}" show -s --format=%b "${RELEASE_SHA}")"
          payload="${RUNNER_TEMP}/create-version-commit.json"
          response="${RUNNER_TEMP}/create-version-commit-response.json"
          jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg branch "${HEAD_REF}" \
            --arg expected_head_oid "${SOURCE_SHA}" \
            --arg headline "${headline}" \
            --arg body "${body}" \
            --arg contents "${version_content}" \
            '{query:"mutation CreateVersionCommit($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}",variables:{input:{branch:{repositoryNameWithOwner:$repo,branchName:$branch},expectedHeadOid:$expected_head_oid,message:{headline:$headline,body:$body},fileChanges:{additions:[{path:"VERSION",contents:$contents}]}}}}' > "${payload}"
          gh api graphql --input "${payload}" > "${response}"
          test "$(jq -r '(.errors // []) | length' "${response}")" = 0
          prepared_sha="$(jq -r '.data.createCommitOnBranch.commit.oid // empty' "${response}")"
          test -n "${prepared_sha}"
          test "$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk 'NR == 1 { print $1 }')" = "${prepared_sha}"
          echo "prepared_sha=${prepared_sha}" >> "$GITHUB_OUTPUT"

      - name: Verify prepared VERSION commit and GitHub signature
        if: steps.prepare.outputs.prepared == 'created' || steps.prepare.outputs.prepared == 'existing'
        env:
          PREPARED_SHA: ${{ steps.create-version.outputs.prepared_sha || steps.prepare.outputs.release_sha }}
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${PREPARED_SHA}"
          python3 .github/scripts/release_chain.py verify-prepared --commit "${PREPARED_SHA}" --source-sha "${SOURCE_SHA}" --target "${RELEASE_TARGET}"
          verified=false
          for _ in $(seq 1 30); do
            verified="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${PREPARED_SHA}" --jq '.commit.verification.verified')"
            [[ "${verified}" == true ]] && break
            sleep 2
          done
          test "${verified}" = true

      - name: Dispatch prepared-head release checks and gates
        if: steps.prepare.outputs.prepared == 'created' || steps.prepare.outputs.prepared == 'existing'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          PREPARED_IDENTITY_SHA: ${{ steps.create-version.outputs.prepared_sha || steps.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/prepared-current-pr.json"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg head_ref "${HEAD_REF}" \
            --arg base_sha "${BASE_SHA}" \
            '.state == "open" and .base.ref == "main" and .base.sha == $base_sha and .head.repo.full_name == $repository and .head.ref == $head_ref' \
            "${RUNNER_TEMP}/prepared-current-pr.json" >/dev/null
          prepared_head_sha="$(jq -r '.head.sha' "${RUNNER_TEMP}/prepared-current-pr.json")"
          [[ "${prepared_head_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --no-tags origin "${prepared_head_sha}"
          if [[ "${{ steps.prepare.outputs.prepared }}" == created ]]; then
            test "${prepared_head_sha}" = "${PREPARED_IDENTITY_SHA}"
          else
            git merge-base --is-ancestor "${PREPARED_IDENTITY_SHA}" "${prepared_head_sha}"
          fi
          gh workflow run ci-pr.yml \
            --repo "${GITHUB_REPOSITORY}" --ref "${HEAD_REF}" \
            --raw-field "pr_number=${PR_NUMBER}" --raw-field "head_sha=${prepared_head_sha}"
          gh workflow run package-ci.yml \
            --repo "${GITHUB_REPOSITORY}" --ref "${HEAD_REF}" \
            --raw-field "pr_number=${PR_NUMBER}" --raw-field "head_sha=${prepared_head_sha}"
          gh workflow run legacy-label-gate-bridge.yml \
            --repo "${GITHUB_REPOSITORY}" --ref main \
            --raw-field "pr_number=${PR_NUMBER}" --raw-field "head_sha=${prepared_head_sha}"
          gh workflow run release-target-gate.yml \
            --repo "${GITHUB_REPOSITORY}" --ref main \
            --raw-field "pr_number=${PR_NUMBER}" --raw-field "head_sha=${prepared_head_sha}"
          gh workflow run release-completion.yml \
            --repo "${GITHUB_REPOSITORY}" --ref main \
            --raw-field "pr_number=${PR_NUMBER}" --raw-field "head_sha=${prepared_head_sha}"
