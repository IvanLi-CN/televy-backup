name: Prepare product version

on:
  workflow_run:
    workflows: [CI (PR), Label Gate, macOS package matrix]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open in-repository product PR to prepare
        required: true
        type: string
      operation:
        description: Preparation operation
        required: true
        type: choice
        options: [allocate]
        default: allocate
      release_mode:
        description: Preparation identity mode
        required: false
        type: choice
        options: [normal, version-only-release-pr]
        default: normal
      covered_merge_sha:
        description: One old merge SHA covered by a version-only release PR
        required: false
        type: string

concurrency:
  group: prepare-product-version-main
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: read
  checks: read

jobs:
  prepare:
    name: Prepare product version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_target'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Configure GitHub Actions identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

      - name: Resolve pull request and source checks
        id: pr
        env:
          EVENT_PATH: ${{ github.event_path }}
          DISPATCH_PR: ${{ inputs.pr_number || '' }}
          LABELS_PATH: ${{ runner.temp }}/labels.json
        shell: bash
        run: |
          set -euo pipefail
          pr_number="${DISPATCH_PR}"
          if [[ -z "${pr_number}" ]]; then
            pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "${EVENT_PATH}")"
          fi
          test -n "${pr_number}"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > "${RUNNER_TEMP}/pull-request.json"
          test "$(jq -r '.state' "${RUNNER_TEMP}/pull-request.json")" = open
          test "$(jq -r '.base.ref' "${RUNNER_TEMP}/pull-request.json")" = main
          test "$(jq -r '.head.repo.full_name // empty' "${RUNNER_TEMP}/pull-request.json")" = "${GITHUB_REPOSITORY}"
          source_sha="$(jq -r '.head.sha' "${RUNNER_TEMP}/pull-request.json")"
          base_sha="$(jq -r '.base.sha' "${RUNNER_TEMP}/pull-request.json")"
          head_ref="$(jq -r '.head.ref' "${RUNNER_TEMP}/pull-request.json")"
          git check-ref-format --branch "${head_ref}" >/dev/null
          jq '.labels' "${RUNNER_TEMP}/pull-request.json" > "${RUNNER_TEMP}/labels.json"
          git fetch --force --tags origin
          git fetch --no-tags origin "${source_sha}" "${base_sha}"
          intent_json="$(python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys
          sys.path.insert(0, '.github/scripts')
          import release_chain
          print(json.dumps(release_chain.intent_from_labels(json.loads(pathlib.Path(os.environ['LABELS_PATH']).read_text()))))
          PY
          )"
          verification_sha="${source_sha}"
          if prepared_json="$(python3 .github/scripts/release_chain.py find-prepared --commit "${source_sha}" --base "${base_sha}" 2>/dev/null)"; then
            preparation_sha="$(printf '%s' "${prepared_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["preparationSha"])')"
            if [[ "${preparation_sha}" == "${source_sha}" ]]; then
              verification_sha="$(printf '%s' "${prepared_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sourceSha"])')"
            fi
          fi
          gh api "repos/${GITHUB_REPOSITORY}/commits/${verification_sha}/check-runs?filter=latest&per_page=100" > "${RUNNER_TEMP}/check-runs.json"
          source_checks_ready="$(python3 - "${RUNNER_TEMP}/check-runs.json" <<'PY'
          import json
          import sys
          sys.path.insert(0, '.github/scripts')
          from release_preparation import source_checks_ready
          print(str(source_checks_ready(json.load(open(sys.argv[1], encoding='utf-8')))).lower())
          PY
          )"
          {
            echo "number=${pr_number}"
            echo "source_sha=${source_sha}"
            echo "verification_sha=${verification_sha}"
            echo "base_sha=${base_sha}"
            echo "head_ref=${head_ref}"
            echo "source_checks_ready=${source_checks_ready}"
            echo "release_type=$(printf '%s' "${intent_json}" | jq -r .type)"
            echo "release_channel=$(printf '%s' "${intent_json}" | jq -r .channel)"
            echo "release_action=$(printf '%s' "${intent_json}" | jq -r .action)"
          } >> "$GITHUB_OUTPUT"

      - name: Reserve final-tag-first release identity
        id: reserve
        if: steps.pr.outputs.release_action != 'skip' && steps.pr.outputs.source_checks_ready == 'true'
        env:
          SOURCE_SHA: ${{ steps.pr.outputs.source_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          RELEASE_TYPE: ${{ steps.pr.outputs.release_type }}
          RELEASE_CHANNEL: ${{ steps.pr.outputs.release_channel }}
          LABELS_PATH: ${{ runner.temp }}/labels.json
        run: |
          set -euo pipefail
          if prepared_json="$(python3 .github/scripts/release_chain.py find-prepared --commit "${SOURCE_SHA}" --base "${{ steps.pr.outputs.base_sha }}" 2>/dev/null)"; then
            printf '%s\n' "${prepared_json}" > "${RUNNER_TEMP}/reservation.json"
            jq -n \
              --arg sourceSha "$(printf '%s' "${prepared_json}" | jq -r .sourceSha)" \
              --arg channel "$(printf '%s' "${prepared_json}" | jq -r .channel | sed 's/^channel://')" \
              --arg version "$(printf '%s' "${prepared_json}" | jq -r .version)" \
              --arg reservation_id "$(printf '%s' "${prepared_json}" | jq -r .reservationId)" \
              --arg ref "$(printf '%s' "${prepared_json}" | jq -r .reservationRef)" \
              --arg owner "github-actions[bot]" \
              --arg claim_key "$(printf '%s' "${prepared_json}" | jq -r .claimKey)" \
              --arg boundary_token "$(printf '%s' "${prepared_json}" | jq -r .boundaryToken)" \
              '{sourceSha:$sourceSha,channel:$channel,version:$version,reservationId:$reservation_id,ref:$ref,"Reservation-Owner":$owner,"Reservation-Claim-Key":$claim_key,"Reservation-Boundary-Token":$boundary_token}' \
              > "${RUNNER_TEMP}/reservation.json"
            python3 - "${RUNNER_TEMP}/reservation.json" <<'PY'
          import json
          import os
          import pathlib
          import sys
          sys.path.insert(0, '.github/scripts')
          import release_reservation
          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          release_reservation.verify_github_reservation(
              value,
              repository=os.environ['GITHUB_REPOSITORY'],
              token=os.environ['GH_TOKEN'],
              api_root=os.environ.get('GITHUB_API_URL', 'https://api.github.com'),
          )
          PY
          else
            git fetch --force origin '+refs/tags/*:refs/tags/*'
            allocation="$(python3 - <<'PY'
          import json
          import os
          import sys
          sys.path.insert(0, '.github/scripts')
          import release_chain
          labels = json.load(open(os.environ['LABELS_PATH'], encoding='utf-8'))
          intent = release_chain.intent_from_labels(labels)
          occupied = []
          occupied = release_chain.occupied_identity_versions()
          print(json.dumps(release_chain.allocate_version(release_chain.product_tags(), intent['type'], intent['channel'], occupied)))
          PY
          )"
            claim_key="pr:${PR_NUMBER}:source:${SOURCE_SHA}:${RELEASE_TYPE}:${RELEASE_CHANNEL}"
            python3 .github/scripts/release_reservation.py reserve \
              --source-sha "${SOURCE_SHA}" \
              --version "$(printf '%s' "${allocation}" | jq -r .version)" \
              --channel "${RELEASE_CHANNEL#channel:}" \
              --owner github-actions[bot] \
              --claim-key "${claim_key}" \
              --repository "${GITHUB_REPOSITORY}" \
              --token "${GH_TOKEN}" \
              --api-root "${GITHUB_API_URL}" \
              --output "${RUNNER_TEMP}/reservation.json"
          fi
          jq -e '.version and .reservationId and .ref and ."Reservation-Claim-Key" and ."Reservation-Boundary-Token"' "${RUNNER_TEMP}/reservation.json" >/dev/null
          {
            echo "version=$(jq -r .version "${RUNNER_TEMP}/reservation.json")"
            echo "reservation_json=${RUNNER_TEMP}/reservation.json"
          } >> "$GITHUB_OUTPUT"

      - name: Stage VERSION-only preparation payload
        id: prepare
        env:
          RELEASE_MODE: ${{ inputs.release_mode || 'normal' }}
          COVERED_MERGE_SHA: ${{ inputs.covered_merge_sha || '' }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ steps.pr.outputs.source_sha }}"
          git worktree add --detach "${RUNNER_TEMP}/release-source" "${{ steps.pr.outputs.source_sha }}"
          python3 .github/scripts/release_preparation.py \
            --repo-root "${RUNNER_TEMP}/release-source" \
            --source-sha "${{ steps.pr.outputs.source_sha }}" \
            --base-sha "${{ steps.pr.outputs.base_sha }}" \
            --labels-json "${RUNNER_TEMP}/labels.json" \
            --checks-json "${RUNNER_TEMP}/check-runs.json" \
            --mode allocate \
            --release-mode "${RELEASE_MODE}" \
            --covered-merge-sha "${COVERED_MERGE_SHA}" \
            --reservation-json "${RUNNER_TEMP}/reservation.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --token "${GH_TOKEN}" \
            --api-root "${GITHUB_API_URL}" \
            --provenance github-native-verified \
            --github-output "$GITHUB_OUTPUT"

      - name: Create GitHub-signed VERSION commit on the pull request
        id: create-version
        if: steps.prepare.outputs.prepared == 'created'
        env:
          RELEASE_SHA: ${{ steps.prepare.outputs.release_sha }}
          SOURCE_SHA: ${{ steps.pr.outputs.source_sha }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          source_root="${RUNNER_TEMP}/release-source"
          test "$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk 'NR == 1 { print $1 }')" = "${SOURCE_SHA}"
          version_content="$(base64 < "${source_root}/VERSION" | tr -d '\n')"
          headline="$(git -C "${source_root}" show -s --format=%s "${RELEASE_SHA}")"
          body="$(git -C "${source_root}" show -s --format=%b "${RELEASE_SHA}")"
          payload="${RUNNER_TEMP}/create-version-commit.json"
          response="${RUNNER_TEMP}/create-version-commit-response.json"
          jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg branch "${HEAD_REF}" \
            --arg expected_head_oid "${SOURCE_SHA}" \
            --arg headline "${headline}" \
            --arg body "${body}" \
            --arg contents "${version_content}" \
            '{query:"mutation CreateVersionCommit($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}",variables:{input:{branch:{repositoryNameWithOwner:$repo,branchName:$branch},expectedHeadOid:$expected_head_oid,message:{headline:$headline,body:$body},fileChanges:{additions:[{path:"VERSION",contents:$contents}]}}}}' > "${payload}"
          gh api graphql --input "${payload}" > "${response}"
          test "$(jq -r '(.errors // []) | length' "${response}")" = 0
          prepared_sha="$(jq -r '.data.createCommitOnBranch.commit.oid // empty' "${response}")"
          test -n "${prepared_sha}"
          test "$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk 'NR == 1 { print $1 }')" = "${prepared_sha}"
          echo "prepared_sha=${prepared_sha}" >> "$GITHUB_OUTPUT"

      - name: Verify prepared VERSION commit and GitHub signature
        if: steps.prepare.outputs.prepared == 'created' || steps.prepare.outputs.prepared == 'existing'
        env:
          PREPARED_SHA: ${{ steps.create-version.outputs.prepared_sha || steps.prepare.outputs.release_sha }}
          SOURCE_SHA: ${{ steps.prepare.outputs.source_sha }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          current_sha="$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk 'NR == 1 { print $1 }')"
          test -n "${current_sha}"
          git fetch --no-tags origin "${PREPARED_SHA}" "${current_sha}"
          git merge-base --is-ancestor "${PREPARED_SHA}" "${current_sha}"
          python3 .github/scripts/release_chain.py verify-prepared --commit "${PREPARED_SHA}" --source-sha "${SOURCE_SHA}"
          verified=false
          for _ in $(seq 1 30); do
            verified="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${PREPARED_SHA}" --jq '.commit.verification.verified')"
            [[ "${verified}" == true ]] && break
            sleep 2
          done
          test "${verified}" = true

      - name: Dispatch prepared-head merge gates
        if: steps.prepare.outputs.prepared == 'created' || steps.prepare.outputs.prepared == 'existing'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          PREPARED_SHA: ${{ steps.create-version.outputs.prepared_sha || steps.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          current_sha="$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk 'NR == 1 { print $1 }')"
          test -n "${current_sha}"
          git fetch --no-tags origin "${PREPARED_SHA}" "${current_sha}"
          git merge-base --is-ancestor "${PREPARED_SHA}" "${current_sha}"
          gh workflow run label-gate.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${HEAD_REF}" \
            --raw-field "pr_number=${PR_NUMBER}"
          gh workflow run release-completion.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${HEAD_REF}" \
            --raw-field "pr_number=${PR_NUMBER}"
