name: Notify failed release

on:
  workflow_run:
    workflows:
      - Release Product
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  resolve_release_context:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      ref_label: ${{ steps.resolve.outputs.ref_label }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      merge_sha: ${{ steps.resolve.outputs.merge_sha }}
      merge_commit_sha: ${{ steps.resolve.outputs.merge_commit_sha }}
      preparation_commit_sha: ${{ steps.resolve.outputs.preparation_commit_sha }}
      actor: ${{ steps.resolve.outputs.actor }}
      identity_status: ${{ steps.resolve.outputs.identity_status }}
      extra_details: ${{ steps.resolve.outputs.extra_details }}
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      tag: ${{ steps.resolve.outputs.tag }}
      tag_status: ${{ steps.resolve.outputs.tag_status }}
      reservation_ref: ${{ steps.resolve.outputs.reservation_ref }}
      recovery_candidate: ${{ steps.resolve.outputs.recovery_candidate }}
      pull_request: ${{ steps.resolve.outputs.pull_request }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      release_type: ${{ steps.resolve.outputs.release_type }}
      tag_target_sha: ${{ steps.resolve.outputs.tag_target_sha }}
      tag_owner: ${{ steps.resolve.outputs.tag_owner }}
      reservation_id: ${{ steps.resolve.outputs.reservation_id }}
      reservation_owner: ${{ steps.resolve.outputs.reservation_owner }}
      reservation_state: ${{ steps.resolve.outputs.reservation_state }}
      reservation_merge_commit_sha: ${{ steps.resolve.outputs.reservation_merge_commit_sha }}
      provenance_verified: ${{ steps.resolve.outputs.provenance_verified }}
      signature_verified: ${{ steps.resolve.outputs.signature_verified }}
      branch_head: ${{ steps.resolve.outputs.branch_head }}
      artifact_names: ${{ steps.resolve.outputs.artifact_names }}
      recovery_instruction: ${{ steps.resolve.outputs.recovery_instruction }}
    steps:
      - name: Resolve locked release context from run logs
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGERING_ACTOR: ${{ github.event.workflow_run.triggering_actor.login || github.event.workflow_run.actor.login || github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from __future__ import annotations

          import json
          import os
          import re
          import zipfile
          from io import BytesIO
          from urllib import error
          from urllib import request
          from urllib.parse import urlsplit

          api_root = os.environ.get('GITHUB_API_URL', 'https://api.github.com').rstrip('/')
          api_origin = urlsplit(api_root)
          token = os.environ['GH_TOKEN']
          repository = os.environ['REPOSITORY']
          run_id = os.environ['RUN_ID']
          run_attempt = os.environ.get('RUN_ATTEMPT', '').strip()
          head_branch = os.environ.get('HEAD_BRANCH', '').strip()
          fallback_head_sha = os.environ.get('HEAD_SHA', '').strip()
          actor = os.environ.get('TRIGGERING_ACTOR', '').strip()
          output_path = os.environ['GITHUB_OUTPUT']

          def api_request(path: str) -> bytes:
              if path.startswith('http://') or path.startswith('https://'):
                  candidate = urlsplit(path)
                  if (candidate.scheme, candidate.netloc) != (api_origin.scheme, api_origin.netloc):
                      raise RuntimeError('GitHub API URL origin mismatch')
                  url = path
              else:
                  url = f'{api_root}{path}'
              req = request.Request(
                  url,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'televy-backup-release-alert-resolver',
                  },
              )
              with request.urlopen(req) as response:
                  return response.read()

          def api_json(path: str) -> dict:
              return json.loads(api_request(path).decode('utf-8'))

          def api_json_optional(path: str) -> dict | None:
              try:
                  return api_json(path)
              except error.HTTPError as exc:
                  if exc.code == 404:
                      return None
                  raise

          def api_text(path: str) -> str:
              return api_request(path).decode('utf-8', errors='replace')

          def load_release_intent() -> dict | None:
              try:
                  payload = api_json(f'/repos/{repository}/actions/runs/{run_id}/artifacts?name=release-intent&per_page=100')
              except error.HTTPError as exc:
                  if exc.code == 404:
                      return None
                  raise
              artifact = next((item for item in payload.get('artifacts', []) if item.get('name') == 'release-intent' and not item.get('expired')), None)
              if not artifact or not artifact.get('archive_download_url'):
                  return None
              archive = api_request(artifact['archive_download_url'])
              with zipfile.ZipFile(BytesIO(archive)) as bundle:
                  member = next((name for name in bundle.namelist() if name == 'release-intent.json' or name.endswith('/release-intent.json')), None)
                  if not member:
                      raise RuntimeError('release-intent.json is missing from the artifact')
                  value = json.loads(bundle.read(member).decode('utf-8'))
              if not isinstance(value, dict):
                  raise RuntimeError('release-intent.json is not an object')
              if str(value.get('run_id', '')).strip() != run_id or str(value.get('run_attempt', '')).strip() != run_attempt:
                  raise RuntimeError('release-intent artifact belongs to a different workflow attempt')
              return value

          def reconstruct_intent(merge_sha: str) -> dict:
              merge = commit_snapshot(merge_sha)
              candidates = []
              for parent in merge['parents']:
                  candidate = commit_snapshot(parent)
                  values = trailers(candidate['message'])
                  if values.get('Release-Source-SHA') and values.get('Product-Version'):
                      candidates.append((parent, candidate, values))
              if len(candidates) != 1:
                  raise RuntimeError('immutable release identity has no unique preparation commit')
              preparation_sha, preparation, values = candidates[0]
              source_sha = require_sha(values.get('Release-Source-SHA'), 'reconstructed source SHA')
              version = str(values.get('Product-Version', ''))
              channel_label = str(values.get('Release-Intent-Channel', ''))
              release_type = str(values.get('Release-Intent-Type', ''))
              channel = channel_label.removeprefix('channel:')
              components_value = str(values.get('Release-Intent-Components', 'none'))
              components = [] if components_value == 'none' else [item for item in components_value.split(',') if item]
              reservation_ref = f'refs/tags/release-reservation/v{version}'
              reservation_ref_payload = api_json(f'/repos/{repository}/git/ref/{reservation_ref.removeprefix("refs/")}')
              reservation_sha = require_sha(reservation_ref_payload.get('object', {}).get('sha'), 'reconstructed reservation SHA')
              reservation_commit = commit_snapshot(reservation_sha)
              reservation_values = trailers(reservation_commit['message'])
              reservation = {
                  'id': reservation_values.get('Reservation-Id', ''),
                  'ref': reservation_ref,
                  'owner': reservation_values.get('Reservation-Owner', ''),
                  'claim_key': reservation_values.get('Reservation-Claim-Key', ''),
                  'boundary_token': reservation_values.get('Reservation-Boundary-Token', ''),
                  'state': 'bound',
                  'merge_commit_sha': merge_sha,
              }
              verify_decision(merge_sha, version, reservation, reservation_commit)
              return {
                  'schema_version': 1,
                  'pull_request': '',
                  'source_sha': source_sha,
                  'preparation_commit_sha': preparation_sha,
                  'merge_sha': merge_sha,
                  'merge_commit_sha': merge_sha,
                  'head_sha': preparation_sha,
                  'branch_head': merge_sha,
                  'release_mode': values.get('Release-Mode', 'normal'),
                  'covered_merge_sha': values.get('Release-Covered-Merge-SHA', ''),
                  'labels': [release_type, f'channel:{channel}', *components],
                  'type': release_type,
                  'channel': channel,
                  'components': components,
                  'version': version,
                  'tag': f'v{version}',
                  'tag_target_sha': product_tag_target(f'v{version}') or '',
                  'tag_owner': 'protected-release-automation',
                  'reservation': reservation,
                  'provenance': {
                      'signature': 'github-native-verified',
                      'signature_verified': True,
                      'provenance_verified': True,
                      'tag_owner': 'protected-release-automation',
                      'identity': 'release_chain_and_reservation_refs',
                  },
                  'artifact_names': ['reconstructed-from-immutable-refs'],
                  'run_id': run_id,
                  'run_attempt': run_attempt,
                  'run_url': f'{os.environ.get("GITHUB_SERVER_URL", "https://github.com")}/{repository}/actions/runs/{run_id}',
                  'recovery_instruction': f'workflow_dispatch operation=recover commit_sha={merge_sha} helper_mode=bootstrap only when no-approved-helper-release',
              }

          def resolve_pull_request(merge_sha: str, declared: object, expected_head_sha: str) -> str:
              pulls = api_json(f'/repos/{repository}/commits/{merge_sha}/pulls')
              candidates = {
                  str(pull['number']): pull
                  for pull in pulls if isinstance(pulls, list) and isinstance(pull, dict)
                  if pull.get('merge_commit_sha') == merge_sha and pull.get('number') is not None
              }
              if len(candidates) != 1:
                  raise RuntimeError('merged pull request association is not unique')
              declared_number = str(declared or '').strip()
              if declared_number and declared_number not in candidates:
                  raise RuntimeError('declared pull request is not associated with the merge SHA')
              number = next(iter(candidates))
              pull = api_json(f'/repos/{repository}/pulls/{number}')
              if str(pull.get('merge_commit_sha', '')) != merge_sha:
                  raise RuntimeError('pull request merge SHA does not match the release identity')
              if str(pull.get('head', {}).get('sha', '')) != expected_head_sha:
                  raise RuntimeError('pull request head SHA does not match the release snapshot')
              return number

          def commit_snapshot(sha: str) -> dict[str, object]:
              payload = api_json(f'/repos/{repository}/commits/{sha}')
              commit = payload.get('commit')
              if not isinstance(commit, dict):
                  raise RuntimeError(f'commit metadata is unavailable: {sha}')
              tree = commit.get('tree')
              parents = payload.get('parents')
              if not isinstance(tree, dict) or not isinstance(tree.get('sha'), str) or not isinstance(parents, list):
                  raise RuntimeError(f'commit provenance is incomplete: {sha}')
              parent_shas = [item.get('sha') for item in parents if isinstance(item, dict)]
              if len(parent_shas) != len(parents) or any(not isinstance(item, str) for item in parent_shas):
                  raise RuntimeError(f'commit parents are incomplete: {sha}')
              return {
                  'sha': sha,
                  'tree': str(tree['sha']),
                  'parents': parent_shas,
                  'message': str(commit.get('message', '')),
                  'verification': commit.get('verification'),
              }

          def trailers(message: object) -> dict[str, str]:
              values: dict[str, str] = {}
              for line in str(message).splitlines():
                  if ':' in line:
                      key, value = line.split(':', 1)
                      if key.strip() and value.strip():
                          values[key.strip()] = value.strip()
              return values

          def require_sha(value: object, label: str) -> str:
              normalized = str(value or '').strip()
              if not re.fullmatch(r'[0-9a-f]{40}', normalized):
                  raise RuntimeError(f'{label} is not a full SHA')
              return normalized

          def verify_preparation(intent: dict, source_sha: str, merge_sha: str) -> tuple[str, bool]:
              preparation_sha = require_sha(intent.get('preparation_commit_sha'), 'preparation commit SHA')
              preparation = commit_snapshot(preparation_sha)
              if preparation['parents'] != [source_sha]:
                  raise RuntimeError('preparation commit parent does not match source SHA')
              verification = preparation.get('verification')
              if not isinstance(verification, dict) or verification.get('verified') is not True:
                  raise RuntimeError('preparation commit GitHub signature is not verified')
              merge = commit_snapshot(merge_sha)
              if preparation_sha not in merge['parents']:
                  raise RuntimeError('merge commit does not contain the preparation commit')
              return preparation_sha, True

          def verify_reservation(intent: dict, source_sha: str, version: str, channel: str) -> tuple[dict[str, str], dict[str, object]]:
              reservation = intent.get('reservation')
              if not isinstance(reservation, dict):
                  raise RuntimeError('release intent reservation is incomplete')
              required = ('id', 'ref', 'owner', 'claim_key', 'boundary_token', 'state', 'merge_commit_sha')
              if any(not str(reservation.get(key, '')).strip() for key in required):
                  raise RuntimeError('release intent reservation is incomplete')
              expected_ref = f'refs/tags/release-reservation/v{version}'
              if reservation['ref'] != expected_ref or reservation['state'] != 'bound':
                  raise RuntimeError('release intent reservation ref or state is invalid')
              reservation_ref = api_json(f'/repos/{repository}/git/ref/{expected_ref.removeprefix("refs/")}')
              reservation_sha = require_sha(reservation_ref.get('object', {}).get('sha'), 'reservation ref target')
              reservation_commit = commit_snapshot(reservation_sha)
              source = commit_snapshot(source_sha)
              if reservation_commit['parents'] != [source_sha] or reservation_commit['tree'] != source['tree']:
                  raise RuntimeError('reservation commit provenance does not match source SHA')
              reservation_trailers = trailers(reservation_commit['message'])
              expected_trailers = {
                  'Reservation-Id': str(reservation['id']),
                  'Reservation-Owner': str(reservation['owner']),
                  'Reservation-Claim-Key': str(reservation['claim_key']),
                  'Reservation-Boundary-Token': str(reservation['boundary_token']),
                  'Release-Version': version,
                  'Release-Channel': channel,
                  'Reservation-State': 'claimed',
              }
              if any(reservation_trailers.get(key) != value for key, value in expected_trailers.items()):
                  raise RuntimeError('reservation commit trailers do not match the release identity')
              return {
                  'id': str(reservation['id']),
                  'ref': expected_ref,
                  'owner': reservation_trailers['Reservation-Owner'],
                  'claim_key': reservation_trailers['Reservation-Claim-Key'],
                  'boundary_token': reservation_trailers['Reservation-Boundary-Token'],
                  'merge_commit_sha': require_sha(reservation['merge_commit_sha'], 'reservation merge SHA'),
              }, reservation_commit

          def verify_bound_receipt(intent: dict, merge_sha: str, version: str, reservation: dict[str, str], merge: dict[str, object]) -> dict[str, object]:
              expected_ref = f'refs/tags/release-bound/v{version}/{merge_sha}'
              receipt_ref = api_json(f'/repos/{repository}/git/ref/{expected_ref.removeprefix("refs/")}')
              receipt_sha = require_sha(receipt_ref.get('object', {}).get('sha'), 'bound receipt target')
              receipt = commit_snapshot(receipt_sha)
              if receipt['parents'] != [merge_sha] or receipt['tree'] != merge['tree']:
                  raise RuntimeError('bound receipt provenance does not match merge SHA')
              receipt_trailers = trailers(receipt['message'])
              expected_trailers = {
                  'Receipt-State': 'bound',
                  'Release-Version': version,
                  'Release-Merge-SHA': merge_sha,
                  'Release-Reservation-Id': reservation['id'],
                  'Release-Owner': reservation['owner'],
                  'Release-Claim-Key': reservation['claim_key'],
                  'Release-Boundary-Token': reservation['boundary_token'],
                  'Release-Reservation-Ref': reservation['ref'],
                  'Receipt-Provenance': 'immutable-receipt',
              }
              if any(receipt_trailers.get(key) != value for key, value in expected_trailers.items()):
                  raise RuntimeError('bound receipt trailers do not match the release identity')
              if reservation['merge_commit_sha'] != merge_sha:
                  raise RuntimeError('reservation merge SHA does not match the bound receipt')
              return receipt

          def verify_decision(merge_sha: str, version: str, reservation: dict[str, str], reservation_commit: dict[str, object]) -> None:
              expected_ref = f'refs/tags/release-decision/v{version}'
              decision_ref_payload = api_json(f'/repos/{repository}/git/ref/{expected_ref.removeprefix("refs/")}')
              decision_sha = require_sha(decision_ref_payload.get('object', {}).get('sha'), 'decision ref target')
              decision = commit_snapshot(decision_sha)
              if decision['parents'] != [reservation_commit['sha']] or decision['tree'] != reservation_commit['tree']:
                  raise RuntimeError('decision provenance does not match the reservation')
              decision_trailers = trailers(decision['message'])
              expected_trailers = {
                  'Decision-State': 'bound',
                  'Release-Version': version,
                  'Release-Merge-SHA': merge_sha,
                  'Release-Reservation-Id': reservation['id'],
                  'Release-Owner': reservation['owner'],
                  'Release-Claim-Key': reservation['claim_key'],
                  'Release-Boundary-Token': reservation['boundary_token'],
                  'Release-Reservation-Ref': reservation['ref'],
                  'Decision-Provenance': 'immutable-decision',
              }
              if any(decision_trailers.get(key) != value for key, value in expected_trailers.items()):
                  raise RuntimeError('decision trailers do not match the release identity')

          def product_tag_target(tag_name: str) -> str | None:
              tag_ref = api_json_optional(f'/repos/{repository}/git/ref/tags/{tag_name}')
              if tag_ref is None:
                  return None
              tag_object = tag_ref.get('object')
              if not isinstance(tag_object, dict):
                  raise RuntimeError('product tag object is incomplete')
              target = require_sha(tag_object.get('sha'), 'product tag target')
              if tag_object.get('type') != 'tag':
                  raise RuntimeError('product tag is not an annotated tag')
              annotated = api_json(f'/repos/{repository}/git/tags/{target}')
              if annotated.get('tag') != tag_name:
                  raise RuntimeError('annotated product tag name does not match the product tag')
              tagger = annotated.get('tagger')
              if not isinstance(tagger, dict) or tagger.get('name') != 'github-actions[bot]' or tagger.get('email') != '41898282+github-actions[bot]@users.noreply.github.com':
                  raise RuntimeError('product tag tagger is not protected release automation')
              annotated_object = annotated.get('object')
              if not isinstance(annotated_object, dict) or annotated_object.get('type') != 'commit':
                  raise RuntimeError('annotated product tag target is incomplete')
              target = require_sha(annotated_object.get('sha'), 'annotated product tag target')
              return target

          def validate_intent(intent: dict) -> dict[str, str]:
              sha_re = re.compile(r'^[0-9a-f]{40}$')
              provenance = intent.get('provenance')
              artifacts = intent.get('artifact_names')
              required = ('source_sha', 'preparation_commit_sha', 'merge_sha', 'merge_commit_sha', 'head_sha', 'branch_head', 'release_mode', 'type', 'channel', 'version', 'tag', 'tag_owner', 'run_id', 'run_attempt', 'run_url', 'recovery_instruction')
              if any(not str(intent.get(key, '')).strip() for key in required):
                  raise RuntimeError('release intent is incomplete')
              labels = intent.get('labels')
              components = intent.get('components')
              artifact_name_re = re.compile(r'^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$')
              if not isinstance(labels, list) or any(not isinstance(item, str) or not item for item in labels):
                  raise RuntimeError('release intent labels are incomplete')
              if not isinstance(components, list) or any(not isinstance(item, str) or not item.startswith('component:') for item in components):
                  raise RuntimeError('release intent components are incomplete')
              if not isinstance(artifacts, list) or not artifacts or any(not isinstance(item, str) or not artifact_name_re.fullmatch(item) for item in artifacts):
                  raise RuntimeError('release intent artifact names are incomplete')
              for key in ('source_sha', 'preparation_commit_sha', 'merge_sha', 'merge_commit_sha', 'head_sha', 'branch_head'):
                  if not sha_re.fullmatch(str(intent[key])):
                      raise RuntimeError(f'release intent {key} is not a full SHA')
              tag_target_claim = str(intent.get('tag_target_sha', '')).strip()
              if tag_target_claim and not sha_re.fullmatch(tag_target_claim):
                  raise RuntimeError('release intent tag target is not a full SHA')
              if tag_target_claim and tag_target_claim != intent['merge_sha']:
                  raise RuntimeError('release intent tag target does not match the release identity')
              if intent['tag'] != f"v{intent['version']}" or intent['merge_commit_sha'] != intent['merge_sha'] or intent['branch_head'] != intent['merge_sha']:
                  raise RuntimeError('release intent identity fields do not agree')
              if not re.fullmatch(r'(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-(?:beta|rc|dev)\.[1-9]\d*)?', str(intent['version'])):
                  raise RuntimeError('release intent version is not a valid product version')
              if str(intent['type']) not in {'type:major', 'type:minor', 'type:patch'}:
                  raise RuntimeError('release intent type is not a supported product type')
              if str(intent['channel']) not in {'prod', 'beta', 'rc', 'dev'}:
                  raise RuntimeError('release intent channel is not a supported release channel')
              if str(intent['tag_owner']) != 'protected-release-automation':
                  raise RuntimeError('release intent tag owner is not the protected release automation owner')
              expected_labels = {str(intent['type']), f"channel:{intent['channel']}"}
              if not expected_labels.issubset(set(labels)):
                  raise RuntimeError('release intent labels do not contain the locked release intent')
              source_sha = require_sha(intent['source_sha'], 'source SHA')
              merge_sha = require_sha(intent['merge_sha'], 'merge SHA')
              preparation_sha, signature_verified = verify_preparation(intent, source_sha, merge_sha)
              if preparation_sha != require_sha(intent['head_sha'], 'release head SHA'):
                  raise RuntimeError('release head SHA does not match the preparation commit')
              reservation, reservation_commit = verify_reservation(intent, source_sha, str(intent['version']), str(intent['channel']))
              verify_decision(merge_sha, str(intent['version']), reservation, reservation_commit)
              merge = commit_snapshot(merge_sha)
              verify_bound_receipt(intent, merge_sha, str(intent['version']), reservation, merge)
              tag_target_sha = product_tag_target(str(intent['tag']))
              if tag_target_sha is not None and tag_target_sha != merge_sha:
                  raise RuntimeError('product tag target does not match release identity')
              tag_status = 'present' if tag_target_sha is not None else 'not-created'
              if not isinstance(provenance, dict) or provenance.get('identity') != 'release_chain_and_reservation_refs' or provenance.get('tag_owner') != intent['tag_owner']:
                  raise RuntimeError('release intent provenance identity is not recognized')
              recovery_match = re.fullmatch(
                  r'workflow_dispatch operation=recover commit_sha=([0-9a-f]{40}) helper_mode=(auto|bootstrap)(?: only when no-approved-helper-release)?',
                  str(intent['recovery_instruction']),
              )
              if not recovery_match or recovery_match.group(1) != merge_sha:
                  raise RuntimeError('release recovery instruction is not canonical for the release identity')
              return {
                  'pull_request': resolve_pull_request(merge_sha, intent.get('pull_request'), preparation_sha),
                  'source_sha': source_sha,
                  'preparation_commit_sha': preparation_sha,
                  'head_sha': preparation_sha,
                  'merge_sha': merge_sha,
                  'merge_commit_sha': merge_sha,
                  'release_type': str(intent['type']),
                  'channel': str(intent['channel']),
                  'version': str(intent['version']),
                  'tag': str(intent['tag']),
                  'tag_status': tag_status,
                  'tag_target_sha': tag_target_sha or '',
                  'tag_owner': str(intent['tag_owner']),
                  'reservation_id': reservation['id'],
                  'reservation_ref': reservation['ref'],
                  'reservation_owner': reservation['owner'],
                  'reservation_state': 'bound',
                  'reservation_merge_commit_sha': merge_sha,
                  'provenance_verified': 'true',
                  'signature_verified': 'true' if signature_verified else 'false',
                  'branch_head': str(intent['branch_head']),
                  'artifact_names': ','.join(artifacts),
                  'recovery_instruction': str(intent['recovery_instruction']),
              }

          jobs = []
          resolver_error = ''
          try:
              if run_attempt:
                  jobs = api_json(f'/repos/{repository}/actions/runs/{run_id}/attempts/{run_attempt}/jobs?per_page=100').get('jobs', [])
              else:
                  jobs = api_json(f'/repos/{repository}/actions/runs/{run_id}/jobs?per_page=100').get('jobs', [])
          except Exception:
              resolver_error = 'Release resolver failed while loading workflow attempt jobs'

          resolver_jobs = [
              job for job in jobs
              if isinstance(job, dict)
              and job.get('name') == 'Resolve merged product identity'
              and job.get('workflow_name') == 'Release Product'
              and job.get('head_sha') == fallback_head_sha
              and (not run_attempt or job.get('run_attempt') == int(run_attempt))
          ]
          logs = []
          if resolver_error:
              logs_error = resolver_error
          elif len(resolver_jobs) == 1 and isinstance(resolver_jobs[0].get('id'), int):
              try:
                  logs.append(api_text(f"/repos/{repository}/actions/jobs/{resolver_jobs[0]['id']}/logs"))
                  logs_error = ''
              except Exception:
                  logs_error = 'Release resolver failed while loading the trusted resolver job log'
          else:
              logs_error = ''
          text = '\n'.join(logs)
          resolved = re.search(
              r'RELEASE_IDENTITY status=resolved version=(\S+) channel=(\S+) merge_sha=([0-9a-f]{40}) tag=(\S+)', text
          )
          no_identity = re.search(r'RELEASE_NO_IDENTITY=([0-9a-f]{40})', text)
          identity = {}
          if logs_error:
              identity_status = 'resolver-error'
              merge_sha = version = channel = tag = ''
              merge_commit_sha = preparation_commit_sha = ''
              tag_status = ''
              recovery = ''
              extra = logs_error
          elif resolved:
              try:
                  expected_version, expected_channel, expected_merge_sha, expected_tag = resolved.groups()
                  snapshot = load_release_intent()
                  identity = validate_intent(snapshot if snapshot is not None else reconstruct_intent(expected_merge_sha))
                  if (identity['version'], identity['channel'], identity['merge_sha'], identity['tag']) != (expected_version, expected_channel, expected_merge_sha, expected_tag):
                      raise RuntimeError('release log identity does not match release-intent artifact')
              except Exception:
                  identity_status = 'resolver-error'
                  merge_sha = version = channel = tag = ''
                  merge_commit_sha = preparation_commit_sha = ''
                  tag_status = ''
                  recovery = ''
                  extra = 'Release identity resolver failed closed; no version or tag was inferred'
              else:
                  identity_status = 'resolved'
                  merge_sha = identity['merge_sha']
                  merge_commit_sha = identity['merge_commit_sha']
                  preparation_commit_sha = identity['preparation_commit_sha']
                  version = identity['version']
                  channel = identity['channel']
                  tag = identity['tag']
                  tag_status = identity['tag_status']
                  recovery = identity['recovery_instruction']
                  extra = f"locked merged identity recovered from reservation and bound receipt (product tag: {tag_status})"
          elif 'superseded_by_product_tag' in text:
              identity_status = 'no-identity'
              merge_sha = ''
              merge_commit_sha = preparation_commit_sha = ''
              version = channel = tag = ''
              tag_status = ''
              recovery = ''
              extra = 'not-applicable: superseded_by_product_tag; no release identity was published'
          elif no_identity:
              identity_status = 'no-identity'
              merge_sha = ''
              merge_commit_sha = preparation_commit_sha = ''
              version = channel = tag = ''
              tag_status = ''
              recovery = ''
              extra = 'Release Product reached a merge without a release identity'
          else:
              identity_status = 'resolver-error'
              merge_sha = ''
              merge_commit_sha = preparation_commit_sha = ''
              version = channel = tag = ''
              tag_status = ''
              recovery = ''
              extra = 'Release identity could not be resolved; no version or tag was inferred'
          ref_label = f'branch: {head_branch}' if head_branch else 'ref: unavailable from workflow_run payload'
          with open(output_path, 'a', encoding='utf-8') as handle:
              handle.write(f'ref_label={ref_label}\n')
              handle.write(f'head_sha={identity.get("head_sha", fallback_head_sha) if identity_status == "resolved" else fallback_head_sha}\n')
              handle.write(f'merge_sha={merge_sha}\n')
              handle.write(f'merge_commit_sha={merge_commit_sha}\n')
              handle.write(f'preparation_commit_sha={preparation_commit_sha}\n')
              handle.write(f'actor={actor}\n')
              handle.write(f'identity_status={identity_status}\n')
              handle.write(f'version={version}\n')
              handle.write(f'channel={channel}\n')
              handle.write(f'tag={tag}\n')
              handle.write(f'tag_status={tag_status}\n')
              handle.write(f'reservation_ref={identity.get("reservation_ref", "")}\n')
              handle.write('extra_details<<EOF\n')
              handle.write(extra)
              handle.write('\nEOF\n')
              handle.write(f'recovery_candidate={recovery}\n')
              for key in ('pull_request', 'source_sha', 'preparation_commit_sha', 'merge_commit_sha', 'release_type', 'tag_status', 'tag_target_sha', 'tag_owner', 'reservation_id', 'reservation_owner', 'reservation_state', 'reservation_merge_commit_sha', 'provenance_verified', 'signature_verified', 'branch_head', 'artifact_names', 'recovery_instruction'):
                  handle.write(f'{key}={identity.get(key, "")}\n')
          PYCODE

  notify_failure:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
    needs:
      - resolve_release_context
    permissions:
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    with:
      outcome: failure
      summary: |
        🚨 Release Failed · ${{ github.repository }}
        status: ${{ github.event.workflow_run.conclusion }}
        workflow: ${{ github.event.workflow_run.name }}
        event: ${{ github.event.workflow_run.event }}
        ref: ${{ needs.resolve_release_context.outputs.ref_label }}
        head_sha: ${{ needs.resolve_release_context.outputs.head_sha }}
        target_sha: ${{ needs.resolve_release_context.outputs.merge_sha }}
        merge_sha: ${{ needs.resolve_release_context.outputs.merge_sha }}
        merge_commit_sha: ${{ needs.resolve_release_context.outputs.merge_commit_sha }}
        preparation_commit_sha: ${{ needs.resolve_release_context.outputs.preparation_commit_sha }}
        run_attempt: ${{ github.event.workflow_run.run_attempt }}
        actor: ${{ needs.resolve_release_context.outputs.actor }}
        run_url: ${{ github.event.workflow_run.html_url }}
        identity_status: ${{ needs.resolve_release_context.outputs.identity_status }}
        note: ${{ needs.resolve_release_context.outputs.extra_details }}
        version: ${{ needs.resolve_release_context.outputs.version }}
        channel: ${{ needs.resolve_release_context.outputs.channel }}
        tag: ${{ needs.resolve_release_context.outputs.tag }}
        tag_status: ${{ needs.resolve_release_context.outputs.tag_status }}
        reservation_ref: ${{ needs.resolve_release_context.outputs.reservation_ref }}
        recovery_candidate: ${{ needs.resolve_release_context.outputs.recovery_candidate }}
        pull_request: ${{ needs.resolve_release_context.outputs.pull_request }}
        source_sha: ${{ needs.resolve_release_context.outputs.source_sha }}
        type: ${{ needs.resolve_release_context.outputs.release_type }}
        tag_target_sha: ${{ needs.resolve_release_context.outputs.tag_target_sha }}
        tag_owner: ${{ needs.resolve_release_context.outputs.tag_owner }}
        reservation_id: ${{ needs.resolve_release_context.outputs.reservation_id }}
        reservation_owner: ${{ needs.resolve_release_context.outputs.reservation_owner }}
        reservation_state: ${{ needs.resolve_release_context.outputs.reservation_state }}
        reservation_merge_commit_sha: ${{ needs.resolve_release_context.outputs.reservation_merge_commit_sha }}
        provenance_verified: ${{ needs.resolve_release_context.outputs.provenance_verified }}
        signature_verified: ${{ needs.resolve_release_context.outputs.signature_verified }}
        branch_head: ${{ needs.resolve_release_context.outputs.branch_head }}
        artifact_names: ${{ needs.resolve_release_context.outputs.artifact_names }}
        recovery_instruction: ${{ needs.resolve_release_context.outputs.recovery_instruction }}

  smoke_test:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write
    uses: IvanLi-CN/oidrune/.github/workflows/notify.yml@e48822f99c6402a753ed86557ea029754cbab20b
    with:
      outcome: failure
      summary: |
        🧪 Smoke Test · ${{ github.repository }}
        status: smoke test
        workflow: Notify failed release
        event: workflow_dispatch
        ref: ${{ format('branch: {0}', github.ref_name) }}
        head_sha: ${{ github.sha }}
        identity_status: smoke-test
        run_attempt: ${{ github.run_attempt }}
        actor: ${{ github.actor }}
        run_url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
        note: manual notifier smoke test
