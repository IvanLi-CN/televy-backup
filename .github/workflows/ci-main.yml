name: CI (main)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      snapshot_upgrade_validation:
        description: Validate candidate Snapshot Access upgrade recovery using disposable fixtures
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  CI: true
  RUST_TOOLCHAIN: 1.91.0

jobs:
  main-quality:
    if: inputs.snapshot_upgrade_validation != true
    name: Mainline quality
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/ci/main/rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          # GitHub's Ubuntu image may include a rotating Chrome repository. It
          # is unrelated to this Rust build and can make apt fail on stale CDN
          # metadata, so keep dependency resolution on the Ubuntu sources.
          chrome_sources="$(grep -lR 'dl.google.com/linux/chrome' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true)"
          if [[ -n "$chrome_sources" ]]; then
            while IFS= read -r source; do
              [[ -n "$source" ]] && sudo rm -f "$source"
            done <<< "$chrome_sources"
          fi
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsqlite3-dev \
            pkg-config \
            curl

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Release script contract tests
        run: bash ./.github/scripts/test-release-scripts.sh

      - name: Component identity fixture tests
        run: bash ./.github/scripts/test-component-identity.sh

      - name: Release chain fixture tests
        run: |
          bash ./.github/scripts/test-release-chain.sh
          bash ./.github/scripts/test-release-reservation.sh
          bash ./.github/scripts/test-release-failure-context.sh
          bash ./.github/scripts/test-release-preparation.sh
          bash ./.github/scripts/test-release-completion.sh
          bash ./.github/scripts/test-release-workflows.sh

      - name: Cache cargo directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/mtproto-helper/target
          key: ${{ runner.os }}-cargo-main-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'crates/mtproto-helper/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-main-${{ env.RUST_TOOLCHAIN }}-
            ${{ runner.os }}-cargo-

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --all-features

      - name: Cargo test (mtproto-helper)
        run: |
          cd crates/mtproto-helper
          cargo test

  main-macos-swift:
    if: inputs.snapshot_upgrade_validation != true
    name: Mainline macOS Swift tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Swift unit/UI layout tests
        run: bash scripts/macos/swift-unit-tests.sh

  snapshot-upgrade-validation:
    name: Manual Snapshot Access upgrade regression
    if: github.event_name == 'workflow_dispatch' && inputs.snapshot_upgrade_validation == true
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Swift lifecycle and installation regression tests
        run: bash scripts/macos/swift-unit-tests.sh

      - name: Verify published upgrade recovery through candidate registration code
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/macos/snapshot-helper-upgrade-integration-test.py

  release-preparation-validation:
    name: Release preparation validation
    runs-on: ubuntu-latest
    needs: [main-quality, main-macos-swift]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve merged PR head
        id: merged-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          merged_prs_json="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=100")"
          pull_request="$(printf '%s' "${merged_prs_json}" | python3 -c 'import json,sys; merge=sys.argv[1]; rows=json.load(sys.stdin); matches=[row.get("number") for row in rows if row.get("merge_commit_sha") == merge and row.get("number") is not None]; print(matches[0] if len(matches) == 1 else "")' "${GITHUB_SHA}")"
          if [[ -z "${pull_request}" ]]; then
            echo "pr_head_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "${pull_request}" =~ ^[0-9]+$ ]]
          pull_request_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pull_request}")"
          test "$(printf '%s' "${pull_request_json}" | jq -r '.state // empty')" = closed
          test "$(printf '%s' "${pull_request_json}" | jq -r '.merged_at // empty')" != ""
          test "$(printf '%s' "${pull_request_json}" | jq -r '.base.ref // empty')" = main
          test "$(printf '%s' "${pull_request_json}" | jq -r '.base.repo.full_name // empty')" = "${GITHUB_REPOSITORY}"
          test "$(printf '%s' "${pull_request_json}" | jq -r '.merge_commit_sha // empty')" = "${GITHUB_SHA}"
          pr_head_sha="$(printf '%s' "${pull_request_json}" | jq -r '.head.sha // empty')"
          [[ "${pr_head_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          git fetch --force origin "refs/pull/${pull_request}/head:refs/remotes/origin/ci-main-pr-${pull_request}"
          test "$(git rev-parse "refs/remotes/origin/ci-main-pr-${pull_request}^{commit}")" = "${pr_head_sha}"
          echo "pr_head_sha=${pr_head_sha}" >> "$GITHUB_OUTPUT"

      - name: Verify merged VERSION preparation
        env:
          PR_HEAD_SHA: ${{ steps.merged-pr.outputs.pr_head_sha }}
        run: |
          if [[ -n "${PR_HEAD_SHA}" ]]; then
            python3 .github/scripts/release_chain.py verify-merged --commit HEAD --pr-head "${PR_HEAD_SHA}"
          else
            python3 .github/scripts/release_chain.py verify-merged --commit HEAD
          fi
