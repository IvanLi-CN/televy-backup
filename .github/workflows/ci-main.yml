name: CI (main)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: true
  RUST_TOOLCHAIN: 1.91.0

jobs:
  main-quality:
    name: Mainline quality
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/ci/main/rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            libsqlite3-dev \
            pkg-config \
            curl

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Release script contract tests
        run: bash ./.github/scripts/test-release-scripts.sh

      - name: Release chain fixture tests
        run: |
          bash ./.github/scripts/test-release-chain.sh
          bash ./.github/scripts/test-release-preparation.sh
          bash ./.github/scripts/test-release-completion.sh
          bash ./.github/scripts/test-release-workflows.sh

      - name: Cache cargo directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/mtproto-helper/target
          key: ${{ runner.os }}-cargo-main-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'crates/mtproto-helper/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-main-${{ env.RUST_TOOLCHAIN }}-
            ${{ runner.os }}-cargo-

      - name: Cargo fmt check
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo test
        run: cargo test --all-features

      - name: Cargo test (mtproto-helper)
        run: |
          cd crates/mtproto-helper
          cargo test

  main-macos-swift:
    name: Mainline macOS Swift tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Swift unit/UI layout tests
        run: bash scripts/macos/swift-unit-tests.sh

  release-preparation-validation:
    name: Release preparation validation
    runs-on: ubuntu-latest
    needs: [main-quality, main-macos-swift]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify merged VERSION preparation
        run: python3 .github/scripts/release_chain.py verify-merged --commit HEAD
