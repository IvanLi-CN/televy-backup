name: Release target gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to validate
        required: true
        type: string
      head_sha:
        description: Expected pull request head SHA for a trusted dispatch
        required: false
        type: string

permissions:
  checks: write
  contents: read
  pull-requests: read

concurrency:
  group: release-target-gate-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Release target gate
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve current pull request
        id: pr
        if: github.event_name != 'merge_group'
        env:
          DISPATCH_PR: ${{ inputs.pr_number || '' }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha || '' }}
        run: |
          set -euo pipefail
          pr_number="${DISPATCH_PR}"
          if [[ -z "${pr_number}" ]]; then
            pr_number="$(jq -r '.pull_request.number // empty' "${GITHUB_EVENT_PATH}")"
          fi
          test -n "${pr_number}"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > "${RUNNER_TEMP}/pull-request.json"
          test "$(jq -r '.state' "${RUNNER_TEMP}/pull-request.json")" = open
          test "$(jq -r '.base.ref' "${RUNNER_TEMP}/pull-request.json")" = main
          test "$(jq -r '.head.repo.full_name // empty' "${RUNNER_TEMP}/pull-request.json")" = "${GITHUB_REPOSITORY}"
          if [[ -n "${EXPECTED_HEAD_SHA}" ]]; then
            [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
            test "$(jq -r '.head.sha' "${RUNNER_TEMP}/pull-request.json")" = "${EXPECTED_HEAD_SHA}"
          fi
          {
            echo "number=${pr_number}"
            echo "head_sha=$(jq -r '.head.sha' "${RUNNER_TEMP}/pull-request.json")"
            echo "base_sha=$(jq -r '.base.sha' "${RUNNER_TEMP}/pull-request.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve trusted main SHA
        id: trusted-main
        env:
          EXPECTED_BASE_SHA: ${{ steps.pr.outputs.base_sha || '' }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${main_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          if [[ "${GITHUB_EVENT_NAME}" != "merge_group" ]]; then
            test "${main_sha}" = "${EXPECTED_BASE_SHA}"
          fi
          echo "sha=${main_sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted release policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.trusted-main.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify target boundary
        id: verify-target
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
        if: github.event_name != 'merge_group'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          TRUSTED_MAIN_SHA: ${{ steps.trusted-main.outputs.sha }}
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "${current_main_sha}" = "${TRUSTED_MAIN_SHA}"
          test "${BASE_SHA}" = "${TRUSTED_MAIN_SHA}"
          git fetch --no-tags origin "${HEAD_SHA}" "${BASE_SHA}"
          python3 .github/scripts/release_target_gate.py --commit "${HEAD_SHA}" --base "${BASE_SHA}"

      - name: Publish exact pull request head check
        if: always() && github.event_name != 'merge_group' && steps.pr.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          CHECK_CONCLUSION: ${{ steps.verify-target.outcome == 'success' && 'success' || 'failure' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/publish-pr-check.py \
            --repository "${GITHUB_REPOSITORY}" \
            --head-sha "${CHECK_HEAD_SHA}" \
            --name "Release target gate" \
            --conclusion "${CHECK_CONCLUSION}" \
            --title "Release target gate" \
            --summary "Trusted main release-target validation was evaluated for this exact pull request head." \
            --details-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Fail dispatched release target gate
        if: always() && github.event_name == 'workflow_dispatch' && steps.verify-target.outcome != 'success'
        run: exit 1

      - name: Verify merge-group release targets
        if: github.event_name == 'merge_group'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MERGE_GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: bash ./.github/scripts/merge-group-release-gate.sh target
