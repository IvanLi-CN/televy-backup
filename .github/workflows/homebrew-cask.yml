name: Homebrew Cask

on:
  pull_request:
    branches: [main]
    paths:
      - Casks/televybackup.rb
      - scripts/homebrew/**
      - .github/workflows/homebrew-cask.yml
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository PR to validate
        required: true
        type: string

concurrency:
  group: homebrew-cask-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    name: Homebrew Cask audit
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Resolve and validate Cask source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || '' }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]; then
            test "${GITHUB_REF}" = "refs/heads/${GITHUB_REF_NAME}"
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/cask-pr.json"
            jq -e \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg head_ref "${GITHUB_REF_NAME}" \
              --arg head_sha "${GITHUB_SHA}" \
              '.state == "open" and .base.ref == "main" and .head.repo.full_name == $repository and .head.ref == $head_ref and .head.sha == $head_sha' \
              "${RUNNER_TEMP}/cask-pr.json" >/dev/null
          else
            PR_NUMBER="$(jq -r '.pull_request.number // empty' "${GITHUB_EVENT_PATH}")"
            test -n "${PR_NUMBER}"
          fi
          if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
            echo "repository=$(jq -r '.pull_request.head.repo.full_name // empty' "${GITHUB_EVENT_PATH}")" >> "$GITHUB_OUTPUT"
            echo "sha=$(jq -r '.pull_request.head.sha' "${GITHUB_EVENT_PATH}")" >> "$GITHUB_OUTPUT"
          else
            echo "repository=${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
            echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Cask candidate
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate repository Cask layout
        run: |
          set -euo pipefail
          test -f Casks/televybackup.rb
          test ! -e packaging/homebrew/televybackup.rb
          ruby -c Casks/televybackup.rb

      - name: Install Homebrew tap view for audit
        run: |
          set -euo pipefail
          tap_dir="$(brew --repository)/Library/Taps/ivanli-cn/homebrew-televy-backup"
          mkdir -p "${tap_dir}/Casks"
          cp Casks/televybackup.rb "${tap_dir}/Casks/televybackup.rb"
          git -C "${tap_dir}" init -q

      - name: Run Homebrew strict Cask audit
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew audit --cask --strict --tap=IvanLi-CN/televy-backup

      - name: Download stable Release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 scripts/homebrew/cask_release.py cask-version --cask Casks/televybackup.rb)"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${version}" > "${RUNNER_TEMP}/cask-release.json"
          jq -e '.draft == false and .prerelease == false' "${RUNNER_TEMP}/cask-release.json" >/dev/null
          mkdir -p "${RUNNER_TEMP}/televybackup-release"
          gh release download "v${version}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern SHA256SUMS \
            --pattern BUILD-MANIFEST.json \
            --dir "${RUNNER_TEMP}/televybackup-release" \
            --clobber
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify Cask metadata and downloaded DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          metadata_dir="${RUNNER_TEMP}/televybackup-release"
          python3 scripts/homebrew/cask_release.py verify-cask \
            --cask Casks/televybackup.rb \
            --version "${version}" \
            --checksums "${metadata_dir}/SHA256SUMS" \
            --manifest "${metadata_dir}/BUILD-MANIFEST.json"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/TelevyBackup-${version}.dmg" \
            --output "${metadata_dir}/TelevyBackup-${version}.dmg"
          python3 scripts/homebrew/cask_release.py verify-dmg \
            --dmg "${metadata_dir}/TelevyBackup-${version}.dmg" \
            --version "${version}" \
            --checksums "${metadata_dir}/SHA256SUMS" \
            --manifest "${metadata_dir}/BUILD-MANIFEST.json"
