name: Reconcile unpublished legacy release identity

on:
  workflow_dispatch:
    inputs:
      version:
        description: Legacy product version to reconcile
        required: true
        type: string
      reservation_id:
        description: Reservation id carried by the legacy released receipt
        required: true
        type: string
      release_run_ids:
        description: Comma-separated Release Product run ids checked for artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-reconciliation-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  retire:
    name: Retire unpublished legacy identity
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RESERVATION_ID: ${{ inputs.reservation_id }}
      RELEASE_RUN_IDS: ${{ inputs.release_run_ids }}
    steps:
      - name: Resolve trusted main SHA
        id: trusted-main
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${main_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "sha=${main_sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.trusted-main.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable remote facts
        id: facts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.trusted-main.outputs.sha }}"
          git fetch --force --tags origin
          python3 - "${RELEASE_VERSION}" "${RESERVATION_ID}" <<'PY'
          import re
          import sys
          sys.path.insert(0, '.github/scripts')
          import release_reservation
          release_reservation.validate_version(sys.argv[1])
          if not release_reservation.IDENTITY_SEGMENT_RE.fullmatch(sys.argv[2]):
              raise SystemExit("invalid reservation id")
          PY

          http_status() {
            local response
            response="$(gh api "$1" --include 2>/dev/null || true)"
            awk 'toupper($0) ~ /^HTTP/ { code=$2 } END { gsub("\r", "", code); print code }' <<< "${response}"
          }
          tag_status="$(http_status "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${RELEASE_VERSION}")"
          release_status="$(http_status "repos/${GITHUB_REPOSITORY}/releases/tags/v${RELEASE_VERSION}")"
          test "${tag_status}" = 404
          test "${release_status}" = 404

          consumed_refs="$(git for-each-ref --format='%(refname)' "refs/tags/release-consumed/v${RELEASE_VERSION}")"
          artifact_refs="$(git for-each-ref --format='%(refname)' \
            "refs/tags/release-artifact-pending/v${RELEASE_VERSION}" \
            "refs/tags/release-artifact-attempts/v${RELEASE_VERSION}" \
            "refs/tags/release-artifacts/v${RELEASE_VERSION}")"
          test -z "${consumed_refs}"
          test -z "${artifact_refs}"

          runs_json='[]'
          IFS=',' read -r -a run_ids <<< "${RELEASE_RUN_IDS}"
          test "${#run_ids[@]}" -gt 0
          for run_id in "${run_ids[@]}"; do
            [[ "${run_id}" =~ ^[1-9][0-9]*$ ]]
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            jq -e --arg repository "${GITHUB_REPOSITORY}" \
              '.status == "completed" and .head_branch == "main" and .path == ".github/workflows/release.yml" and .repository.full_name == $repository' \
              <<< "${run_json}" >/dev/null
            artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" | jq '[.artifacts[] | {id,name,expired}]')"
            runs_json="$(jq --argjson run "${run_json}" --argjson artifacts "${artifacts_json}" \
              '. + [{id:($run.id|tostring),status:$run.status,conclusion:$run.conclusion,head_sha:$run.head_sha,workflow_path:$run.path,artifacts:$artifacts}]' <<< "${runs_json}")"
            test "$(printf '%s' "${artifacts_json}" | jq 'length')" = 0
          done

          reservation_ref="refs/tags/release-reservation/v${RELEASE_VERSION}"
          decision_ref="refs/tags/release-decision/v${RELEASE_VERSION}"
          released_ref="refs/tags/release-released/v${RELEASE_VERSION}/${RESERVATION_ID}"
          for ref in "${reservation_ref}" "${decision_ref}" "${released_ref}"; do
            git rev-parse "${ref}^{commit}" >/dev/null
          done

          jq -n \
            --arg version "${RELEASE_VERSION}" \
            --arg main_sha "${{ steps.trusted-main.outputs.sha }}" \
            --arg tag "v${RELEASE_VERSION}" \
            --argjson runs "${runs_json}" \
            '{schema_version:1,version:$version,main_sha:$main_sha,product_tag:{ref:$tag,status:"absent"},github_release:{tag:$tag,status:"absent"},consumed_refs:[],artifact_refs:[],release_runs:$runs}' \
            > "${RUNNER_TEMP}/retirement-evidence.json"
          sha256sum "${RUNNER_TEMP}/retirement-evidence.json"

          for ref in "${reservation_ref}" "${decision_ref}" "${released_ref}"; do
            echo "${ref} $(git rev-parse "${ref}^{commit}")"
          done > "${RUNNER_TEMP}/legacy-refs-before.txt"
          {
            echo "reservation_ref=${reservation_ref}"
            echo "decision_ref=${decision_ref}"
            echo "released_ref=${released_ref}"
          } >> "$GITHUB_OUTPUT"

      - name: Append immutable retirement receipt
        id: retire
        run: |
          set -euo pipefail
          python3 .github/scripts/release_reservation.py retire \
            --version "${RELEASE_VERSION}" \
            --reservation-id "${RESERVATION_ID}" \
            --owner github-actions[bot] \
            --reason no-product-publication \
            --evidence-json "${RUNNER_TEMP}/retirement-evidence.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --token "${GH_TOKEN}" \
            --api-root "${GITHUB_API_URL}" \
            --output "${RUNNER_TEMP}/retirement.json"
          jq -e --arg version "${RELEASE_VERSION}" \
            '.ref == ("refs/tags/release-retired/v" + $version + "/" + ."Retirement-Reservation-Id") and ."Retirement-Provenance" == "immutable-retirement-reconciliation"' \
            "${RUNNER_TEMP}/retirement.json" >/dev/null
          retirement_ref_value="$(jq -r .ref "${RUNNER_TEMP}/retirement.json")"
          retirement_sha_value="$(jq -r .target "${RUNNER_TEMP}/retirement.json")"
          git fetch --force origin "${retirement_ref_value}:${retirement_ref_value}"
          {
            echo "retirement_ref=${retirement_ref_value}"
            echo "retirement_sha=${retirement_sha_value}"
            echo "evidence_digest=$(jq -r '."Retirement-Evidence-Digest"' "${RUNNER_TEMP}/retirement.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Verify old refs were not changed
        env:
          RETIREMENT_REF: ${{ steps.retire.outputs.retirement_ref }}
        run: |
          set -euo pipefail
          reservation_ref="${{ steps.facts.outputs.reservation_ref }}"
          decision_ref="${{ steps.facts.outputs.decision_ref }}"
          released_ref="${{ steps.facts.outputs.released_ref }}"
          for ref in "${reservation_ref}" "${decision_ref}" "${released_ref}"; do
            echo "${ref} $(git rev-parse "${ref}^{commit}")"
          done > "${RUNNER_TEMP}/legacy-refs-after.txt"
          diff -u "${RUNNER_TEMP}/legacy-refs-before.txt" "${RUNNER_TEMP}/legacy-refs-after.txt"
          test "$(git rev-parse "${RETIREMENT_REF}^{commit}")" = "${{ steps.retire.outputs.retirement_sha }}"
          echo "retired=${RETIREMENT_REF}"
          echo "evidence_digest=${{ steps.retire.outputs.evidence_digest }}"
