name: CI (PR)

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository PR to validate
        required: true
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  CI: true
  RUST_TOOLCHAIN: 1.91.0

jobs:
  classify:
    name: Classify CI preparation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - name: Checkout pull request head
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Verify workflow dispatch targets current pull request head
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/ci-pr.json"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg head_ref "${GITHUB_REF_NAME}" \
            --arg head_sha "${GITHUB_SHA}" \
            '.state == "open" and .base.ref == "main" and .head.repo.full_name == $repository and .head.ref == $head_ref and .head.sha == $head_sha' \
            "${RUNNER_TEMP}/ci-pr.json" >/dev/null

      - name: Checkout dispatched pull request head
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Classify VERSION preparation commit
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          if python3 .github/scripts/release_chain.py verify-prepared --commit HEAD >/dev/null 2>&1; then
            echo "kind=prepared" >> "$GITHUB_OUTPUT"
          else
            echo "kind=source" >> "$GITHUB_OUTPUT"
          fi

  quality:
    needs: classify
    if: needs.classify.result == 'success'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/ci/pr/rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Verify prepared release source
        if: needs.classify.outputs.kind == 'prepared'
        run: python3 .github/scripts/release_chain.py verify-prepared --commit HEAD

      - name: Install system dependencies
        if: needs.classify.outputs.kind == 'source'
        run: |
          # GitHub's Ubuntu image may include a rotating Chrome repository. It
          # is unrelated to this Rust build and can make apt fail on stale CDN
          # metadata, so keep dependency resolution on the Ubuntu sources.
          chrome_sources="$(grep -lR 'dl.google.com/linux/chrome' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true)"
          if [[ -n "$chrome_sources" ]]; then
            while IFS= read -r source; do
              [[ -n "$source" ]] && sudo rm -f "$source"
            done <<< "$chrome_sources"
          fi
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsqlite3-dev \
            pkg-config \
            curl

      - name: Set up Rust toolchain
        if: needs.classify.outputs.kind == 'source'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Rust components
        if: needs.classify.outputs.kind == 'source'
        run: rustup component add rustfmt clippy

      - name: Release script contract tests
        if: needs.classify.outputs.kind == 'source'
        run: bash ./.github/scripts/test-release-scripts.sh

      - name: Release chain fixture tests
        if: needs.classify.outputs.kind == 'source'
        run: |
          bash ./.github/scripts/test-release-chain.sh
          bash ./.github/scripts/test-release-reservation.sh
          bash ./.github/scripts/test-release-failure-context.sh
          bash ./.github/scripts/test-release-preparation.sh
          bash ./.github/scripts/test-release-completion.sh
          bash ./.github/scripts/test-release-workflows.sh

      - name: APFS snapshot validation workflow contract
        if: needs.classify.outputs.kind == 'source'
        run: bash ./.github/scripts/test-apfs-snapshot-validation.sh

      - name: Homebrew Cask contract tests
        if: needs.classify.outputs.kind == 'source'
        run: bash ./.github/scripts/test-homebrew-cask.sh

      - name: Package script contract tests
        if: needs.classify.outputs.kind == 'source'
        run: bash ./.github/scripts/test-package-scripts.sh

      - name: Component identity fixture tests
        run: bash ./.github/scripts/test-component-identity.sh

      - name: Daemon service contract tests
        if: needs.classify.outputs.kind == 'source'
        run: bash ./.github/scripts/test-daemon-service.sh

      - name: Cache cargo directories
        if: needs.classify.outputs.kind == 'source'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/mtproto-helper/target
          key: ${{ runner.os }}-cargo-pr-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'crates/mtproto-helper/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pr-${{ env.RUST_TOOLCHAIN }}-
            ${{ runner.os }}-cargo-

      - name: Cargo fmt check
        if: needs.classify.outputs.kind == 'source'
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        if: needs.classify.outputs.kind == 'source'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo test
        if: needs.classify.outputs.kind == 'source'
        run: cargo test --all-features

      - name: Cargo test (mtproto-helper)
        if: needs.classify.outputs.kind == 'source'
        run: |
          cd crates/mtproto-helper
          cargo test

  manual-snapshot-regression:
    needs: classify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.kind == 'source'
    name: Manual Snapshot Access regression
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout dispatched pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Snapshot Access failure-injection tests
        run: cargo test --locked -p televybackup-snapshot-access

      - name: Preserve strict Snapshot Access error code
        run: cargo test --locked -p televy_backup_core strict_snapshot_read_errors_keep_the_snapshot_access_code

      - name: Preserve daemon broker error code
        run: cargo test --locked -p televybackupd brokered_source_reports_snapshot_access_failures_without_invalidating_config

      - name: Validate APFS acceptance contract
        run: bash .github/scripts/test-apfs-snapshot-validation.sh

  manual-apfs-real-acceptance:
    needs: classify
    if: >-
      github.event_name == 'pull_request' &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.kind == 'source' &&
      contains(github.event.pull_request.labels.*.name, 'apfs-acceptance')
    name: Labeled APFS snapshot acceptance
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout dispatched pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Verify hosted APFS prerequisites
        run: |
          set -euo pipefail
          command -v diskutil
          command -v hdiutil
          command -v jq
          command -v sqlite3
          command -v tmutil
          sudo -n true

      - name: Prepare hosted APFS Time Machine destination
        run: |
          set -euo pipefail
          tm_image="$RUNNER_TEMP/televybackup-apfs-tm.sparsebundle"
          tm_mount="$RUNNER_TEMP/televybackup-apfs-tm-volume"
          mkdir -p "$tm_mount"
          hdiutil create -quiet -size 20g -fs APFS -type SPARSEBUNDLE -volname TelevyBackupAPFSTM "$tm_image"
          hdiutil attach -quiet -nobrowse -mountpoint "$tm_mount" "$tm_image"
          sudo -n tmutil setdestination "$tm_mount" >/dev/null
          sudo -n tmutil enable >/dev/null
          sudo -n tmutil destinationinfo >/dev/null
          printf 'TELEVYBACKUP_CI_TM_IMAGE=%s\n' "$tm_image" >> "$GITHUB_ENV"
          printf 'TELEVYBACKUP_CI_TM_MOUNT=%s\n' "$tm_mount" >> "$GITHUB_ENV"

      - name: Build ad-hoc candidate
        env:
          TELEVYBACKUP_APP_VARIANT: prod
          TELEVYBACKUP_BUILD_MODE: development
          TELEVYBACKUP_CODESIGN_IDENTITY: '-'
          TELEVYBACKUP_APP_OUT_ROOT: ${{ runner.temp }}/televybackup-apfs-app
        run: bash scripts/macos/build-app.sh

      - name: Run APFS timepoint and long-read acceptance
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apfs-snapshot-evidence"
          bash scripts/macos/verify-apfs-snapshot-ci.sh \
            --app "$RUNNER_TEMP/televybackup-apfs-app/TelevyBackup.app" \
            --evidence-dir "$RUNNER_TEMP/apfs-snapshot-evidence"

      - name: Upload sanitized APFS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apfs-snapshot-hosted-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/apfs-snapshot-evidence/summary.json
            ${{ runner.temp }}/apfs-snapshot-evidence/a5.json
            ${{ runner.temp }}/apfs-snapshot-evidence/a6.json
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up hosted APFS Time Machine destination
        if: always()
        run: |
          set +e
          tm_mount="${TELEVYBACKUP_CI_TM_MOUNT:-$RUNNER_TEMP/televybackup-apfs-tm-volume}"
          sudo -n tmutil removedestination "$tm_mount" >/dev/null 2>&1 || true
          hdiutil detach "$tm_mount" -force >/dev/null 2>&1 || true

  macos-swift:
    needs: classify
    if: needs.classify.result == 'success'
    name: macOS Swift tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Swift unit/UI layout tests
        if: needs.classify.outputs.kind == 'source'
        run: bash scripts/macos/swift-unit-tests.sh
      - name: Verify prepared release source
        if: needs.classify.outputs.kind == 'prepared'
        run: python3 .github/scripts/release_chain.py verify-prepared --commit HEAD
