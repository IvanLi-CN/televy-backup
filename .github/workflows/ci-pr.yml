name: CI (PR)

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open same-repository PR to validate
        required: true
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  CI: true
  RUST_TOOLCHAIN: 1.91.0

jobs:
  classify:
    name: Classify CI preparation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - name: Checkout pull request head
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Verify workflow dispatch targets current pull request head
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/ci-pr.json"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg head_ref "${GITHUB_REF_NAME}" \
            --arg head_sha "${GITHUB_SHA}" \
            '.state == "open" and .base.ref == "main" and .head.repo.full_name == $repository and .head.ref == $head_ref and .head.sha == $head_sha' \
            "${RUNNER_TEMP}/ci-pr.json" >/dev/null

      - name: Checkout dispatched pull request head
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Classify VERSION preparation commit
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          if python3 .github/scripts/release_chain.py verify-prepared --commit HEAD >/dev/null 2>&1; then
            echo "kind=prepared" >> "$GITHUB_OUTPUT"
          else
            echo "kind=source" >> "$GITHUB_OUTPUT"
          fi

  quality:
    needs: classify
    if: needs.classify.result == 'success'
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: target/ci/pr/rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Verify prepared release source
        if: needs.classify.outputs.kind == 'prepared'
        run: python3 .github/scripts/release_chain.py verify-prepared --commit HEAD

      - name: Install system dependencies
        if: needs.classify.outputs.kind == 'source'
        run: |
          # GitHub's Ubuntu image may include a rotating Chrome repository. It
          # is unrelated to this Rust build and can make apt fail on stale CDN
          # metadata, so keep dependency resolution on the Ubuntu sources.
          chrome_sources="$(grep -lR 'dl.google.com/linux/chrome' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true)"
          if [[ -n "$chrome_sources" ]]; then
            while IFS= read -r source; do
              [[ -n "$source" ]] && sudo rm -f "$source"
            done <<< "$chrome_sources"
          fi
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libsqlite3-dev \
            pkg-config \
            curl

      - name: Set up Rust toolchain
        if: needs.classify.outputs.kind == 'source'
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Install Rust components
        if: needs.classify.outputs.kind == 'source'
        run: rustup component add rustfmt clippy

      - name: Release script contract tests
        if: needs.classify.outputs.kind == 'source'
        run: bash ./.github/scripts/test-release-scripts.sh

      - name: Release chain fixture tests
        if: needs.classify.outputs.kind == 'source'
        run: |
          bash ./.github/scripts/test-release-chain.sh
          bash ./.github/scripts/test-release-reservation.sh
          bash ./.github/scripts/test-release-failure-context.sh
          bash ./.github/scripts/test-release-preparation.sh
          bash ./.github/scripts/test-release-completion.sh
          bash ./.github/scripts/test-release-workflows.sh

      - name: APFS snapshot validation workflow contract
        if: needs.classify.outputs.kind == 'source'
        run: bash ./.github/scripts/test-apfs-snapshot-validation.sh

      - name: Homebrew Cask contract tests
        if: needs.classify.outputs.kind == 'source'
        run: bash ./.github/scripts/test-homebrew-cask.sh

      - name: Package script contract tests
        if: needs.classify.outputs.kind == 'source'
        run: bash ./.github/scripts/test-package-scripts.sh

      - name: Component identity fixture tests
        run: bash ./.github/scripts/test-component-identity.sh

      - name: Daemon service contract tests
        if: needs.classify.outputs.kind == 'source'
        run: bash ./.github/scripts/test-daemon-service.sh

      - name: Cache cargo directories
        if: needs.classify.outputs.kind == 'source'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/mtproto-helper/target
          key: ${{ runner.os }}-cargo-pr-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'crates/mtproto-helper/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pr-${{ env.RUST_TOOLCHAIN }}-
            ${{ runner.os }}-cargo-

      - name: Cargo fmt check
        if: needs.classify.outputs.kind == 'source'
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        if: needs.classify.outputs.kind == 'source'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo test
        if: needs.classify.outputs.kind == 'source'
        run: cargo test --all-features

      - name: Prove mount helper slow-start regression and repair
        if: needs.classify.outputs.kind == 'source'
        run: bash scripts/macos/test-mount-helper-startup-regression.sh

      - name: Cargo test (mtproto-helper)
        if: needs.classify.outputs.kind == 'source'
        run: |
          cd crates/mtproto-helper
          cargo test

  manual-snapshot-regression:
    needs: classify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.classify.result == 'success' &&
      needs.classify.outputs.kind == 'source'
    name: Manual Snapshot Access regression
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout dispatched pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Reproduce published mount helper installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fixture="${RUNNER_TEMP}/mount-helper-install-release"
          mkdir -p "${fixture}/download" "${fixture}/mount"
          gh release download v0.9.9-rc.118 --repo "${GITHUB_REPOSITORY}" \
            --pattern TelevyBackup-0.9.9-rc.118.dmg --dir "${fixture}/download"
          hdiutil attach -readonly -nobrowse -mountpoint "${fixture}/mount" \
            "${fixture}/download/TelevyBackup-0.9.9-rc.118.dmg"
          trap 'hdiutil detach "${fixture}/mount" >/dev/null' EXIT
          python3 scripts/macos/mount-helper-install-integration-test.py \
            --app "${fixture}/mount/TelevyBackup.app"
          cp -R "${fixture}/mount/TelevyBackup.app" "${fixture}/TelevyBackup.app"

      - name: Mount helper installation feedback regression
        run: |
          swiftc macos/TelevyBackupApp/SnapshotMountHelperInstallation.swift \
            macos/TelevyBackupAppTests/SnapshotMountHelperInstallationTests.swift \
            -o "${RUNNER_TEMP}/snapshot-mount-helper-installation-tests"
          "${RUNNER_TEMP}/snapshot-mount-helper-installation-tests"

      - name: Snapshot Access failure-injection tests
        run: cargo test --locked -p televybackup-snapshot-access

      - name: Candidate mount helper installer regression
        run: |
          set -euo pipefail
          cargo test --locked -p televybackup snapshot_mount_service::tests
          cargo build --locked -p televybackup -p televybackup-snapshot-access \
            --bin televybackup --bin televybackup-snapshot-mount-helper
          fixture="${RUNNER_TEMP}/mount-helper-install-release"
          cp target/debug/televybackup "${fixture}/TelevyBackup.app/Contents/MacOS/televybackup-cli"
          cp target/debug/televybackup-snapshot-mount-helper \
            "${fixture}/TelevyBackup.app/Contents/MacOS/televybackup-snapshot-mount-helper"
          codesign --force --sign - "${fixture}/TelevyBackup.app/Contents/MacOS/televybackup-cli"
          codesign --force --sign - "${fixture}/TelevyBackup.app/Contents/MacOS/televybackup-snapshot-mount-helper"
          python3 scripts/macos/mount-helper-install-integration-test.py \
            --app "${fixture}/TelevyBackup.app" --require-readiness --delay-startup

      - name: Stale mount recovery and unknown blocker fixture
        run: |
          python3 scripts/macos/test-snapshot-mount-recovery.py \
            --helper target/debug/televybackup-snapshot-mount-helper

      - name: Preserve strict Snapshot Access error code
        run: cargo test --locked -p televy_backup_core strict_snapshot_read_errors_keep_the_snapshot_access_code

      - name: Preserve daemon broker error code
        run: cargo test --locked -p televybackupd brokered_source_reports_snapshot_access_failures_without_invalidating_config

      - name: Snapshot timepoint and mount-health fixture tests
        run: |
          cargo test --locked -p televybackup-snapshot-access snapshot_timepoint_reads_pre_mutation_after_live_change
          cargo test --locked -p televybackup-snapshot-access long_read_fails_closed_after_mount_identity_loss

      - name: Validate APFS acceptance contract
        run: bash .github/scripts/test-apfs-snapshot-validation.sh

  macos-swift:
    needs: classify
    if: needs.classify.result == 'success'
    name: macOS Swift tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Prove helper readiness regression and repair
        if: needs.classify.outputs.kind == 'source'
        run: bash scripts/macos/test-helper-readiness-regression.sh
      - name: Prove service failure presentation regression
        if: needs.classify.outputs.kind == 'source'
        run: bash scripts/macos/test-backup-failure-presentation-regression.sh
      - name: Render synthetic backup failure views
        if: needs.classify.outputs.kind == 'source'
        run: bash scripts/macos/render-backup-failure-preview.sh "${RUNNER_TEMP}/backup-failure-preview"
      - name: Upload synthetic backup failure views
        if: needs.classify.outputs.kind == 'source'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backup-failure-preview
          path: ${{ runner.temp }}/backup-failure-preview/*.png
          if-no-files-found: error
      - name: Swift unit/UI layout tests
        if: needs.classify.outputs.kind == 'source'
        run: bash scripts/macos/swift-unit-tests.sh
      - name: Production main window layout regression
        if: needs.classify.outputs.kind == 'source'
        env:
          TELEVYBACKUP_CONFIG_DIR: /invalid-layout-env/config
          TELEVYBACKUP_DATA_DIR: /invalid-layout-env/data
          TELEVYBACKUP_LOG_DIR: /invalid-layout-env/logs
        run: bash scripts/macos/test-main-window-layout.sh "${RUNNER_TEMP}/main-window-layout"
      - name: Upload synthetic main window evidence
        if: always() && needs.classify.outputs.kind == 'source'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: main-window-layout
          path: ${{ runner.temp }}/main-window-layout/*.png
          if-no-files-found: ignore
      - name: Verify prepared release source
        if: needs.classify.outputs.kind == 'prepared'
        run: python3 .github/scripts/release_chain.py verify-prepared --commit HEAD
