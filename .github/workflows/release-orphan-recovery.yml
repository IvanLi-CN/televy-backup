name: Recover unbound release reservation

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version carried by the orphan reservation
        required: true
        type: string
      reservation_id:
        description: Reservation id carried by the claimed reservation
        required: true
        type: string
      release_target:
        description: Exact release target carried by the claim
        required: true
        type: string
      claim_key:
        description: Exact immutable claim key carried by the reservation
        required: true
        type: string
      boundary_token:
        description: Exact immutable boundary token carried by the reservation
        required: true
        type: string
      release_run_ids:
        description: Comma-separated successful Release Product run ids checked for artifacts
        required: true
        type: string
      reason:
        description: Bounded reason recorded in the append-only receipt
        required: false
        default: no-bound-identity
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-orphan-recovery-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  recover:
    name: Recover unbound reservation
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      RESERVATION_ID: ${{ inputs.reservation_id }}
      RELEASE_TARGET: ${{ inputs.release_target }}
      CLAIM_KEY: ${{ inputs.claim_key }}
      BOUNDARY_TOKEN: ${{ inputs.boundary_token }}
      RELEASE_RUN_IDS: ${{ inputs.release_run_ids }}
      RECOVERY_REASON: ${{ inputs.reason }}
    steps:
      - name: Resolve trusted main SHA
        id: trusted-main
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${main_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "sha=${main_sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted release policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.trusted-main.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable orphan facts
        id: facts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.trusted-main.outputs.sha }}"
          git fetch --force --tags origin
          python3 - "${RELEASE_VERSION}" "${RESERVATION_ID}" "${RELEASE_TARGET}" "${CLAIM_KEY}" "${BOUNDARY_TOKEN}" <<'PY'
          import re
          import sys
          sys.path.insert(0, '.github/scripts')
          import release_chain
          import release_reservation

          version, reservation_id, target, claim_key, boundary = sys.argv[1:]
          release_reservation.validate_version(version)
          if not release_reservation.IDENTITY_SEGMENT_RE.fullmatch(reservation_id):
              raise SystemExit('invalid reservation id')
          release_chain.parse_release_target(target)
          match = re.fullmatch(r'pr:([1-9][0-9]*):target:.+', claim_key)
          if not match or release_chain.manual_claim_key(match.group(1), target) != claim_key:
              raise SystemExit('claim key does not match release target')
          if not boundary or not release_reservation.IDENTITY_SEGMENT_RE.fullmatch(boundary):
              raise SystemExit('invalid boundary token')
          PY

          reservation_ref="refs/tags/release-reservation/v${RELEASE_VERSION}"
          orphan_ref="refs/tags/release-orphaned/v${RELEASE_VERSION}/${RESERVATION_ID}"
          reservation_target="$(git rev-parse "${reservation_ref}^{commit}")"
          python3 - "${RELEASE_VERSION}" "${RESERVATION_ID}" "${RELEASE_TARGET}" "${CLAIM_KEY}" "${BOUNDARY_TOKEN}" > "${RUNNER_TEMP}/reservation.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, '.github/scripts')
          import release_reservation

          version, reservation_id, target, claim_key, boundary = sys.argv[1:]
          value = release_reservation.verify_local_reservation_claim(
              reservation_ref_value=release_reservation.reservation_ref(version),
              version=version,
              reservation_id=reservation_id,
              owner='github-actions[bot]',
              claim_key=claim_key,
              boundary_token=boundary,
              release_target=target,
              policy=release_reservation.RELEASE_POLICY_ID,
          )
          print(json.dumps(value, sort_keys=True))
          PY
          source_sha="$(jq -r .sourceSha "${RUNNER_TEMP}/reservation.json")"
          git merge-base --is-ancestor "${source_sha}" "${{ steps.trusted-main.outputs.sha }}"

          http_status() {
            local response
            response="$(gh api "$1" --include 2>/dev/null || true)"
            awk 'toupper($0) ~ /^HTTP/ { code=$2 } END { gsub("\r", "", code); print code }' <<< "${response}"
          }
          tag_status="$(http_status "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${RELEASE_VERSION}")"
          release_status="$(http_status "repos/${GITHUB_REPOSITORY}/releases/tags/v${RELEASE_VERSION}")"
          test "${tag_status}" = 404
          test "${release_status}" = 404

          blocking_refs="$(git for-each-ref --format='%(refname)' \
            "refs/tags/release-decision/v${RELEASE_VERSION}" \
            "refs/tags/release-decision-reclaimed/v${RELEASE_VERSION}" \
            "refs/tags/release-reservation-reclaimed/v${RELEASE_VERSION}" \
            "refs/tags/release-bound/v${RELEASE_VERSION}" \
            "refs/tags/release-consumed/v${RELEASE_VERSION}" \
            "refs/tags/release-released/v${RELEASE_VERSION}" \
            "refs/tags/release-retired/v${RELEASE_VERSION}" \
            "refs/tags/release-orphaned/v${RELEASE_VERSION}" \
            "refs/tags/release-artifact-pending/v${RELEASE_VERSION}" \
            "refs/tags/release-artifact-attempts/v${RELEASE_VERSION}" \
            "refs/tags/release-artifacts/v${RELEASE_VERSION}" | awk -v allowed="${orphan_ref}" '$0 != allowed')"
          test -z "${blocking_refs}"

          runs_json='[]'
          IFS=',' read -r -a run_ids <<< "${RELEASE_RUN_IDS}"
          test "${#run_ids[@]}" -gt 0
          test "${#run_ids[@]}" -le 20
          for run_id in "${run_ids[@]}"; do
            [[ "${run_id}" =~ ^[1-9][0-9]*$ ]]
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            jq -e --arg repository "${GITHUB_REPOSITORY}" \
              '.status == "completed" and .conclusion == "success" and .head_branch == "main" and .path == ".github/workflows/release.yml" and .repository.full_name == $repository' \
              <<< "${run_json}" >/dev/null
            artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" | jq '[.artifacts[] | {id,name,expired}]')"
            test "$(printf '%s' "${artifacts_json}" | jq 'length')" = 0
            runs_json="$(jq --argjson run "${run_json}" --argjson artifacts "${artifacts_json}" \
              '. + [{id:($run.id|tostring),status:$run.status,conclusion:$run.conclusion,head_branch:$run.head_branch,workflow_path:$run.path,artifacts:$artifacts}]' <<< "${runs_json}")"
          done

          jq -n \
            --arg version "${RELEASE_VERSION}" \
            --arg main_sha "${{ steps.trusted-main.outputs.sha }}" \
            --arg tag "v${RELEASE_VERSION}" \
            --argjson runs "${runs_json}" \
            '{kind:"orphan-unbound",schema_version:1,version:$version,main_sha:$main_sha,product_tag:{ref:$tag,status:"absent"},github_release:{tag:$tag,status:"absent"},decision_refs:[],reclaimed_refs:[],bound_refs:[],consumed_refs:[],released_refs:[],retired_refs:[],artifact_refs:[],release_runs:$runs}' \
            > "${RUNNER_TEMP}/orphan-evidence.json"
          sha256sum "${RUNNER_TEMP}/orphan-evidence.json"

          printf '%s\n' "${reservation_ref} ${reservation_target}" > "${RUNNER_TEMP}/reservation-before.txt"
          {
            echo "reservation_ref=${reservation_ref}"
            echo "reservation_target=${reservation_target}"
            echo "orphan_ref=${orphan_ref}"
          } >> "$GITHUB_OUTPUT"

      - name: Append immutable orphan recovery receipt
        id: recover
        run: |
          set -euo pipefail
          python3 .github/scripts/release_reservation.py recover-orphan \
            --version "${RELEASE_VERSION}" \
            --reservation-id "${RESERVATION_ID}" \
            --owner github-actions[bot] \
            --claim-key "${CLAIM_KEY}" \
            --release-target "${RELEASE_TARGET}" \
            --boundary-token "${BOUNDARY_TOKEN}" \
            --reason "${RECOVERY_REASON}" \
            --evidence-json "${RUNNER_TEMP}/orphan-evidence.json" \
            --repository "${GITHUB_REPOSITORY}" \
            --token "${GH_TOKEN}" \
            --api-root "${GITHUB_API_URL}" \
            --output "${RUNNER_TEMP}/orphan-recovery.json"
          jq -e --arg version "${RELEASE_VERSION}" --arg reservation_id "${RESERVATION_ID}" \
            '.ref == ("refs/tags/release-orphaned/v" + $version + "/" + $reservation_id) and ."Orphan-Recovery-State" == "unbound" and ."Orphan-Provenance" == "immutable-orphan-unbound-recovery"' \
            "${RUNNER_TEMP}/orphan-recovery.json" >/dev/null
          orphan_sha="$(jq -r .target "${RUNNER_TEMP}/orphan-recovery.json")"
          orphan_ref="$(jq -r .ref "${RUNNER_TEMP}/orphan-recovery.json")"
          git fetch --force origin "${orphan_ref}:${orphan_ref}"
          test "$(git rev-parse "${orphan_ref}^{commit}")" = "${orphan_sha}"
          {
            echo "orphan_ref=${orphan_ref}"
            echo "orphan_sha=${orphan_sha}"
            echo "evidence_digest=$(jq -r '."Orphan-Evidence-Digest"' "${RUNNER_TEMP}/orphan-recovery.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Verify append-only recovery
        env:
          ORPHAN_REF: ${{ steps.recover.outputs.orphan_ref }}
          ORPHAN_SHA: ${{ steps.recover.outputs.orphan_sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "${{ steps.facts.outputs.reservation_ref }} $(git rev-parse "${{ steps.facts.outputs.reservation_ref }}^{commit}")" > "${RUNNER_TEMP}/reservation-after.txt"
          diff -u "${RUNNER_TEMP}/reservation-before.txt" "${RUNNER_TEMP}/reservation-after.txt"
          test "$(git rev-parse "${ORPHAN_REF}^{commit}")" = "${ORPHAN_SHA}"
          echo "### Orphan recovery receipt"
          printf '%s\n' "- ref: ${ORPHAN_REF}"
          printf '%s\n' "- receipt SHA: ${ORPHAN_SHA}"
          printf '%s\n' "- evidence digest: ${{ steps.recover.outputs.evidence_digest }}"
          {
            echo "## Orphan recovery"
            printf '%s\n' "- reservation: ${{ steps.facts.outputs.reservation_ref }}"
            printf '%s\n' "- receipt: ${ORPHAN_REF}"
            printf '%s\n' "- receipt SHA: ${ORPHAN_SHA}"
            printf '%s\n' "- evidence digest: ${{ steps.recover.outputs.evidence_digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
