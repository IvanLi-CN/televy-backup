name: macOS APFS snapshot acceptance

on:
  pull_request:
    branches: [main]
    types: [labeled]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or ref to validate; defaults to the triggering commit
        required: false
        type: string

concurrency:
  group: apfs-snapshot-acceptance-${{ github.ref }}-${{ inputs.source_ref || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  RUST_TOOLCHAIN: 1.91.0

jobs:
  contract:
    name: APFS validation contract
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'apfs-acceptance'))
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 2
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Snapshot Access regression tests
        run: cargo test --locked -p televybackup-snapshot-access
      - name: Strict error propagation regression tests
        run: cargo test --locked -p televy_backup_core strict_snapshot_read_errors_keep_the_snapshot_access_code
      - name: Daemon broker error regression tests
        run: cargo test --locked -p televybackupd brokered_source_reports_snapshot_access_failures_without_invalidating_config
      - name: Shell and workflow contract tests
        run: |
          bash -n scripts/macos/verify-apfs-snapshot-integration.sh
          bash -n scripts/macos/verify-apfs-snapshot-long-read.sh
          bash -n scripts/macos/verify-apfs-snapshot-ci.sh
          bash .github/scripts/test-apfs-snapshot-validation.sh

  runner-preflight:
    name: Dedicated APFS runner preflight
    if: >-
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require an online APFS runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
            | jq -e 'any(.runners[]; .status == "online" and (.busy | not) and any(.labels[]; .name == "televybackup-apfs"))' >/dev/null

  apfs:
    name: macOS APFS snapshot acceptance
    if: >-
      github.event_name == 'workflow_dispatch'
    needs: [contract, runner-preflight]
    runs-on: [self-hosted, macOS, televybackup-apfs]
    timeout-minutes: 45
    env:
      TELEVYBACKUP_APFS_APP_ROOT: ${{ vars.TELEVYBACKUP_APFS_APP_ROOT }}
      TELEVYBACKUP_APFS_CODESIGN_IDENTITY: ${{ vars.TELEVYBACKUP_APFS_CODESIGN_IDENTITY }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 2
      - name: Preflight dedicated runner
        run: |
          set -euo pipefail
          test -n "$TELEVYBACKUP_APFS_APP_ROOT"
          test -n "$TELEVYBACKUP_APFS_CODESIGN_IDENTITY"
          test "$TELEVYBACKUP_APFS_APP_ROOT" != "${TELEVYBACKUP_APFS_APP_ROOT#/}"
          test "$TELEVYBACKUP_APFS_APP_ROOT" != "$GITHUB_WORKSPACE"
          test "$TELEVYBACKUP_APFS_CODESIGN_IDENTITY" != "-"
          sudo -n true
          security find-identity -v -p codesigning \
            | grep -F "$TELEVYBACKUP_APFS_CODESIGN_IDENTITY"
          command -v diskutil
          command -v jq
          command -v sqlite3
          echo "Runner must have FDA pre-granted to the stable candidate app and mount helper paths."
      - name: Build signed candidate at the FDA-authorized path
        env:
          TELEVYBACKUP_APP_VARIANT: prod
          TELEVYBACKUP_BUILD_MODE: development
          TELEVYBACKUP_APP_OUT_ROOT: ${{ vars.TELEVYBACKUP_APFS_APP_ROOT }}
          TELEVYBACKUP_CODESIGN_IDENTITY: ${{ vars.TELEVYBACKUP_APFS_CODESIGN_IDENTITY }}
        run: bash scripts/macos/build-app.sh
      - name: Verify signed candidate identities
        run: |
          set -euo pipefail
          app="$TELEVYBACKUP_APFS_APP_ROOT/TelevyBackup.app"
          codesign --verify --deep --strict "$app"
          test "$(/usr/bin/plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" = "com.ivan.televybackup"
          codesign -dvvv "$app/Contents/Library/LoginItems/TelevyBackup Snapshot Access.app" 2>&1 \
            | grep -F "Identifier=com.ivan.televybackup.snapshot-access"
          codesign -dvvv "$app/Contents/MacOS/televybackup-snapshot-mount-helper" 2>&1 \
            | grep -F "Identifier=com.ivan.televybackup.snapshot-mount-helper"
      - name: Run sanitized APFS timepoint and long-read acceptance
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apfs-snapshot-evidence"
          bash scripts/macos/verify-apfs-snapshot-ci.sh \
            --app "$TELEVYBACKUP_APFS_APP_ROOT/TelevyBackup.app" \
            --evidence-dir "$RUNNER_TEMP/apfs-snapshot-evidence"
      - name: Upload sanitized APFS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apfs-snapshot-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/apfs-snapshot-evidence/summary.json
            ${{ runner.temp }}/apfs-snapshot-evidence/a5.json
            ${{ runner.temp }}/apfs-snapshot-evidence/a6.json
          if-no-files-found: error
          retention-days: 14

  hosted-apfs:
    name: Hosted macOS APFS snapshot acceptance
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'apfs-acceptance')
    needs: contract
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout labeled pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Verify hosted APFS prerequisites
        run: |
          set -euo pipefail
          command -v diskutil
          command -v jq
          command -v sqlite3
          sudo -n true
      - name: Build ad-hoc candidate
        env:
          TELEVYBACKUP_APP_VARIANT: prod
          TELEVYBACKUP_BUILD_MODE: development
          TELEVYBACKUP_CODESIGN_IDENTITY: -
          TELEVYBACKUP_APP_OUT_ROOT: ${{ runner.temp }}/televybackup-apfs-app
        run: bash scripts/macos/build-app.sh
      - name: Run APFS timepoint and long-read acceptance
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apfs-snapshot-evidence"
          bash scripts/macos/verify-apfs-snapshot-ci.sh \
            --app "$RUNNER_TEMP/televybackup-apfs-app/TelevyBackup.app" \
            --evidence-dir "$RUNNER_TEMP/apfs-snapshot-evidence"
      - name: Upload sanitized APFS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apfs-snapshot-hosted-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/apfs-snapshot-evidence/summary.json
            ${{ runner.temp }}/apfs-snapshot-evidence/a5.json
            ${{ runner.temp }}/apfs-snapshot-evidence/a6.json
          if-no-files-found: warn
          retention-days: 14
