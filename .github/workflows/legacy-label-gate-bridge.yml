name: Label Gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number for legacy check compatibility
        required: false
        type: string
      head_sha:
        description: Expected pull request head SHA for exact check compatibility
        required: false
        type: string

permissions:
  checks: write
  contents: read
  pull-requests: read

jobs:
  label-gate:
    name: Release intent label gate
    runs-on: ubuntu-latest
    steps:
      - name: Resolve trusted main SHA
        id: trusted-main
        if: github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "${main_sha}" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "sha=${main_sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted check publisher
        if: github.event_name != 'merge_group'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.trusted-main.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve current pull request
        id: pr
        if: github.event_name != 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PATH: ${{ github.event_path }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number || '' }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha || '' }}
        run: |
          set -euo pipefail
          pr_number="${INPUT_PR_NUMBER}"
          if [[ -z "${pr_number}" ]]; then
            pr_number="$(jq -r '.pull_request.number // empty' "${EVENT_PATH}")"
          fi
          [[ "${pr_number}" =~ ^[0-9]+$ ]]
          if [[ -n "${EXPECTED_HEAD_SHA}" ]]; then
            [[ "${EXPECTED_HEAD_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]
          fi
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > "${RUNNER_TEMP}/pull-request.json"
          jq -e \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg expected_head_sha "${EXPECTED_HEAD_SHA}" \
            '.state == "open" and .base.ref == "main" and .head.repo.full_name == $repository and (.head.sha | type == "string" and test("^[0-9a-fA-F]{40}$")) and ($expected_head_sha == "" or .head.sha == $expected_head_sha)' \
            "${RUNNER_TEMP}/pull-request.json" >/dev/null
          {
            echo "number=${pr_number}"
            echo "head_sha=$(jq -r '.head.sha' "${RUNNER_TEMP}/pull-request.json")"
          } >> "$GITHUB_OUTPUT"

      - name: Publish exact pull request head check
        if: always() && github.event_name != 'merge_group' && steps.pr.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/publish-pr-check.py \
            --repository "${GITHUB_REPOSITORY}" \
            --head-sha "${CHECK_HEAD_SHA}" \
            --name "Release intent label gate" \
            --conclusion success \
            --title "Release intent label gate" \
            --summary "Legacy compatibility check is satisfied; release labels are not release authority." \
            --details-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Confirm retired label route
        run: echo "Legacy label check bridge is active; release labels are not release authority."
