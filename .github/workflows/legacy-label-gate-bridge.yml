name: Label Gate

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number for legacy check compatibility
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  label-gate:
    name: Release intent label gate
    runs-on: ubuntu-latest
    steps:
      - name: Confirm retired label route
        run: echo "Legacy label check bridge is active; release labels are not release authority."
