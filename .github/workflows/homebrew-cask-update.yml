name: Update and Merge Homebrew Cask

on:
  workflow_run:
    workflows: [Release Product]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable product tag to retry, for example v0.9.8
        required: true
        type: string

concurrency:
  group: homebrew-cask-update
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  update:
    name: Update, validate, and merge Cask
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      UPDATE_BRANCH: automation/homebrew-cask

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve published stable Release
        id: release
        env:
          EVENT_PATH: ${{ github.event_path }}
          INPUT_TAG: ${{ inputs.tag || '' }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG}"
          if [[ "${GITHUB_EVENT_NAME}" == workflow_run ]]; then
            run_id="$(jq -r '.workflow_run.id' "${EVENT_PATH}")"
            run_attempt="$(jq -r '.workflow_run.run_attempt' "${EVENT_PATH}")"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?name=release-intent&per_page=100" > "${RUNNER_TEMP}/release-artifacts.json"
            artifact_url="$(jq -r '.artifacts[] | select(.name == "release-intent" and .expired == false) | .archive_download_url' "${RUNNER_TEMP}/release-artifacts.json" | head -n 1)"
            if [[ -z "${artifact_url}" ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Release Product completed without a release-intent artifact; no stable Cask update is needed"
              exit 0
            fi
            gh api "${artifact_url}" > "${RUNNER_TEMP}/release-intent.zip"
            unzip -p "${RUNNER_TEMP}/release-intent.zip" release-intent.json > "${RUNNER_TEMP}/release-intent.json"
            jq -e \
              --arg run_id "${run_id}" \
              --arg run_attempt "${run_attempt}" \
              '((.run_id | tostring) == $run_id) and ((.run_attempt | tostring) == $run_attempt)' \
              "${RUNNER_TEMP}/release-intent.json" >/dev/null
            channel="$(jq -r '.channel // empty' "${RUNNER_TEMP}/release-intent.json")"
            if [[ "${channel}" != prod ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Release channel is ${channel:-unknown}; Cask follows stable prod only"
              exit 0
            fi
            tag="$(jq -r '.tag // empty' "${RUNNER_TEMP}/release-intent.json")"
          fi
          [[ "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          release_json="${RUNNER_TEMP}/release.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > "${release_json}"
          jq -e '.draft == false and .prerelease == false and .tag_name == $tag' --arg tag "${tag}" "${release_json}" >/dev/null
          {
            echo "skip=false"
            echo "tag=${tag}"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Stop when the Release is not a stable Cask target
        if: steps.release.outputs.skip == 'true'
        run: exit 0

      - name: Download immutable Release metadata
        if: steps.release.outputs.skip != 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/televybackup-release"
          gh release download "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern SHA256SUMS \
            --pattern BUILD-MANIFEST.json \
            --dir "${RUNNER_TEMP}/televybackup-release" \
            --clobber

      - name: Render and verify Cask candidate
        if: steps.release.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/homebrew/cask_release.py render \
            --version "${VERSION}" \
            --checksums "${RUNNER_TEMP}/televybackup-release/SHA256SUMS" \
            --manifest "${RUNNER_TEMP}/televybackup-release/BUILD-MANIFEST.json" \
            --output "${RUNNER_TEMP}/televybackup.rb"
          python3 scripts/homebrew/cask_release.py verify-cask \
            --cask "${RUNNER_TEMP}/televybackup.rb" \
            --version "${VERSION}" \
            --checksums "${RUNNER_TEMP}/televybackup-release/SHA256SUMS" \
            --manifest "${RUNNER_TEMP}/televybackup-release/BUILD-MANIFEST.json"

      - name: Resolve or create same-repository automation branch
        if: steps.release.outputs.skip != 'true'
        id: branch
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          branch_sha=""
          if branch_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${UPDATE_BRANCH}" 2>/dev/null)"; then
            branch_sha="$(printf '%s' "${branch_json}" | jq -r '.object.sha')"
            compare_json="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${main_sha}...${branch_sha}")"
            jq -e 'all(.files[]?; .filename == "Casks/televybackup.rb")' <<< "${compare_json}" >/dev/null
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/heads/${UPDATE_BRANCH}" \
              -f "sha=${main_sha}" >/dev/null
            branch_sha="${main_sha}"
          fi
          {
            echo "main_sha=${main_sha}"
            echo "branch_sha=${branch_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Commit Cask update on automation branch
        if: steps.release.outputs.skip != 'true'
        id: commit
        env:
          BRANCH_SHA: ${{ steps.branch.outputs.branch_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          expected_content="$(cat "${RUNNER_TEMP}/televybackup.rb")"
          current_content=""
          if current_b64="$(gh api "repos/${GITHUB_REPOSITORY}/contents/Casks/televybackup.rb?ref=${UPDATE_BRANCH}" --jq '.content' 2>/dev/null)"; then
            current_content="$(printf '%s' "${current_b64}" | tr -d '\n' | base64 --decode)"
          fi
          if [[ "${current_content}" == "${expected_content}" ]]; then
            {
              echo "changed=false"
              echo "sha=${BRANCH_SHA}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - "${RUNNER_TEMP}/commit.json" "${GITHUB_REPOSITORY}" "${UPDATE_BRANCH}" "${BRANCH_SHA}" "${VERSION}" "${RUNNER_TEMP}/televybackup.rb" <<'PY'
          import base64
          import json
          import pathlib
          import sys

          output, repository, branch, parent, version, cask = sys.argv[1:]
          contents = base64.b64encode(pathlib.Path(cask).read_bytes()).decode("ascii")
          payload = {
              "query": "mutation CreateCaskCommit($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}",
              "variables": {
                  "input": {
                      "branch": {"repositoryNameWithOwner": repository, "branchName": branch},
                      "expectedHeadOid": parent,
                      "message": {"headline": f"chore(homebrew): update Cask to v{version}"},
                      "fileChanges": {"additions": [{"path": "Casks/televybackup.rb", "contents": contents}]},
                  }
              },
          }
          pathlib.Path(output).write_text(json.dumps(payload), encoding="utf-8")
          PY
          response="${RUNNER_TEMP}/commit-response.json"
          gh api graphql --input "${RUNNER_TEMP}/commit.json" > "${response}"
          jq -e '(.errors // []) | length == 0' "${response}" >/dev/null
          commit_sha="$(jq -r '.data.createCommitOnBranch.commit.oid // empty' "${response}")"
          test -n "${commit_sha}"
          {
            echo "changed=true"
            echo "sha=${commit_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update same-repository Cask PR
        if: steps.release.outputs.skip != 'true'
        id: pr
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          title="chore(homebrew): update Cask to v${VERSION}"
          body_file="${RUNNER_TEMP}/cask-pr-body.md"
          cat > "${body_file}" <<EOF
          Homebrew Cask update for the published stable Release [${TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}).

          This PR is generated, validated, and merged entirely in ${GITHUB_REPOSITORY}; it does not modify the Release or any other repository. The workflow uses only GitHub's built-in GITHUB_TOKEN.
          EOF
          pr_number="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --base main --head "${UPDATE_BRANCH}" --json number --jq '.[0].number // empty')"
          if [[ -z "${pr_number}" ]]; then
            if [[ "${{ steps.commit.outputs.changed }}" != true ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Cask already matches the published stable Release; no PR is needed"
              exit 0
            fi
            pr_url="$(gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${UPDATE_BRANCH}" --title "${title}" --body-file "${body_file}")"
            pr_number="${pr_url##*/}"
          else
            gh pr edit "${pr_number}" --repo "${GITHUB_REPOSITORY}" --title "${title}" --body-file "${body_file}" >/dev/null
          fi
          for label in type:major type:minor type:patch type:skip channel:prod channel:beta channel:rc channel:dev; do
            gh pr edit "${pr_number}" --repo "${GITHUB_REPOSITORY}" --remove-label "${label}" >/dev/null 2>&1 || true
          done
          gh pr edit "${pr_number}" --repo "${GITHUB_REPOSITORY}" --add-label type:docs >/dev/null
          labels="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${pr_number}/labels?per_page=100" --jq '[.[].name] | join(",")')"
          [[ ",${labels}," == *",type:docs,"* ]]
          [[ "${labels}" != *"channel:"* ]]
          {
            echo "skip=false"
            echo "number=${pr_number}"
          } >> "$GITHUB_OUTPUT"

      - name: Dispatch PR checks and Homebrew audit
        if: steps.release.outputs.skip != 'true' && steps.pr.outputs.skip != 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run ci-pr.yml --repo "${GITHUB_REPOSITORY}" --ref "${UPDATE_BRANCH}" --raw-field "pr_number=${PR_NUMBER}"
          gh workflow run package-ci.yml --repo "${GITHUB_REPOSITORY}" --ref "${UPDATE_BRANCH}" --raw-field "source_ref=${HEAD_SHA}"
          gh workflow run label-gate.yml --repo "${GITHUB_REPOSITORY}" --ref "${UPDATE_BRANCH}" --raw-field "pr_number=${PR_NUMBER}"
          gh workflow run release-completion.yml --repo "${GITHUB_REPOSITORY}" --ref "${UPDATE_BRANCH}" --raw-field "pr_number=${PR_NUMBER}"
          gh workflow run homebrew-cask.yml --repo "${GITHUB_REPOSITORY}" --ref "${UPDATE_BRANCH}" --raw-field "pr_number=${PR_NUMBER}"

      - name: Wait for exact Cask PR checks
        if: steps.release.outputs.skip != 'true' && steps.pr.outputs.skip != 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 3300))
          while :; do
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/cask-pr-current.json"
            jq -e \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg head_sha "${HEAD_SHA}" \
              '.state == "open" and .base.ref == "main" and .head.repo.full_name == $repository and .head.sha == $head_sha' \
              "${RUNNER_TEMP}/cask-pr-current.json" >/dev/null
            gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?filter=latest&per_page=100" > "${RUNNER_TEMP}/cask-checks.json"
            state="$(python3 - "${RUNNER_TEMP}/cask-checks.json" <<'PY'
          import json
          import sys

          required = {
              "Release intent label gate",
              "quality",
              "macOS Swift tests",
              "arm64 native package",
              "x86_64 native package",
              "Universal 2 assembly",
              "Release completion",
              "Homebrew Cask audit",
          }
          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          latest = {}
          for row in payload.get("check_runs", []):
              name = row.get("name")
              if not name:
                  continue
              timestamp = row.get("completed_at") or row.get("started_at") or ""
              if name not in latest or timestamp > latest[name][0]:
                  latest[name] = (timestamp, row)
          missing = sorted(name for name in required if name not in latest)
          pending = sorted(name for name in required if name in latest and latest[name][1].get("status") != "completed")
          failed = sorted(name for name in required if name in latest and latest[name][1].get("status") == "completed" and latest[name][1].get("conclusion") != "success")
          if failed:
              print("failed:" + ",".join(failed))
          elif missing or pending:
              print("pending:" + ",".join(missing + pending))
          else:
              print("ready")
          PY
          )"
            case "${state}" in
              ready) break ;;
              failed:*) echo "Cask PR checks failed: ${state#failed:}" >&2; exit 1 ;;
              pending:*)
                if (( SECONDS >= deadline )); then
                  echo "timed out waiting for Cask PR checks: ${state#pending:}" >&2
                  exit 1
                fi
                sleep 15
                ;;
              *) echo "unexpected Cask PR check state: ${state}" >&2; exit 1 ;;
            esac
          done

      - name: Merge validated Cask PR
        if: steps.release.outputs.skip != 'true' && steps.pr.outputs.skip != 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          gh pr merge "${PR_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --squash \
            --match-head-commit "${HEAD_SHA}" \
            --delete-branch
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > "${RUNNER_TEMP}/cask-pr-merged.json"
          jq -e --arg head_sha "${HEAD_SHA}" \
            '.state == "closed" and .merged == true and .head.sha == $head_sha' \
            "${RUNNER_TEMP}/cask-pr-merged.json" >/dev/null
