name: Manual APFS snapshot regression

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Commit or ref to validate; defaults to the triggering commit
        required: false
        type: string

concurrency:
  group: apfs-snapshot-manual-regression-${{ github.ref }}-${{ inputs.source_ref || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.91.0

jobs:
  regression:
    name: Snapshot access failure regression
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Snapshot Access failure-injection tests
        run: cargo test --locked -p televybackup-snapshot-access

      - name: Preserve strict Snapshot Access error code
        run: cargo test --locked -p televy_backup_core strict_snapshot_read_errors_keep_the_snapshot_access_code

      - name: Preserve daemon broker error code
        run: cargo test --locked -p televybackupd brokered_source_reports_snapshot_access_failures_without_invalidating_config

      - name: Validate APFS acceptance contract
        run: bash .github/scripts/test-apfs-snapshot-validation.sh
