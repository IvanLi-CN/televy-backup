name: Finder RC Acceptance Capture

on:
  workflow_dispatch:
    inputs:
      stable_run_id:
        description: Release Product run that owns the stable release-assets artifact
        required: true
        type: string
      artifact_name:
        description: Exact release-assets artifact name from stable_run_id
        required: true
        type: string
      stable_version:
        description: Stable product version, without the v prefix
        required: true
        type: string
      stable_source_commit:
        description: Stable product merge SHA bound to the release artifact
        required: true
        type: string
      rc2_tag:
        description: Published RC2 tag to receive the acceptance assets
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  capture:
    name: Capture macOS 15 Finder acceptance
    runs-on: macos-15
    environment:
      name: macos-release-acceptance
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      STABLE_RUN_ID: ${{ inputs.stable_run_id }}
      ARTIFACT_NAME: ${{ inputs.artifact_name }}
      STABLE_VERSION: ${{ inputs.stable_version }}
      STABLE_SOURCE_COMMIT: ${{ inputs.stable_source_commit }}
      RC2_TAG: ${{ inputs.rc2_tag }}
      TELEVYBACKUP_RUN_FINDER_ACCEPTANCE: "1"
      TELEVYBACKUP_FINDER_PRODUCER_COMMIT: ${{ inputs.stable_source_commit }}
      TELEVYBACKUP_FINDER_RECEIPT_SIGNING_KEY_MATERIAL: ${{ secrets.TELEVYBACKUP_FINDER_RECEIPT_SIGNING_KEY }}
      TELEVYBACKUP_FINDER_VISUAL_REVIEW: >-
        {"instruction_readable":true,"instruction_contrast":true,"arrow_visible":true,"arrow_direction_correct":true,"labels_visible":true,"no_occlusion":true}
    steps:
      - name: Checkout capture workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download stable release-assets artifact
        shell: bash
        run: |
          set -euo pipefail
          [[ "${STABLE_RUN_ID}" =~ ^[0-9]+$ ]]
          [[ "${STABLE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${STABLE_SOURCE_COMMIT}" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "${RC2_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]
          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STABLE_RUN_ID}/artifacts?per_page=100")"
          artifact_id="$(printf '%s' "${artifacts_json}" | jq -r --arg name "${ARTIFACT_NAME}" '
            [.artifacts[] | select(.name == $name and .expired == false)]
            | if length == 1 then .[0].id else error("expected exactly one matching release-assets artifact") end
          ')"
          [[ "${artifact_id}" =~ ^[0-9]+$ ]]
          archive="${RUNNER_TEMP}/release-assets.zip"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${archive}"
          unpack_dir="${RUNNER_TEMP}/release-assets-unpacked"
          mkdir -p "${unpack_dir}" release-assets
          unzip -q "${archive}" -d "${unpack_dir}"
          if [[ -d "${unpack_dir}/release-assets" ]]; then
            cp -R "${unpack_dir}/release-assets/." release-assets/
          else
            cp -R "${unpack_dir}/." release-assets/
          fi
          test -s "release-assets/TelevyBackup-${STABLE_VERSION}.dmg"
          test -s release-assets/BUILD-MANIFEST.json
          test -s release-assets/SHA256SUMS

      - name: Capture and upload macOS 15 Finder evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p acceptance
          signing_key="${RUNNER_TEMP}/finder-acceptance-signing-key.pem"
          umask 077
          printf '%s\n' "${TELEVYBACKUP_FINDER_RECEIPT_SIGNING_KEY_MATERIAL}" > "${signing_key}"
          trap 'rm -f "${signing_key}"' EXIT
          TELEVYBACKUP_FINDER_RECEIPT_SIGNING_KEY="${signing_key}" bash scripts/macos/finder-dmg-acceptance.sh \
            --dmg "release-assets/TelevyBackup-${STABLE_VERSION}.dmg" \
            --evidence-dir acceptance \
            --upload-rc2-tag "${RC2_TAG}"

      - name: Publish captured evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: finder-acceptance-macos-15-${{ github.run_id }}
          path: acceptance
          if-no-files-found: error
          retention-days: 30
