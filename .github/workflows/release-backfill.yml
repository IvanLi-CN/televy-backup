name: Release exact-tag backfill

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package without changing its source or version
        required: true
        type: string
      publish:
        description: Upload to the existing GitHub Release after validation (default is build-only)
        required: false
        default: false
        type: boolean

concurrency:
  group: release-backfill-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.meta.outputs.source_commit }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "invalid exact release tag" >&2; exit 2; }
          git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null || { echo "tag not found: $TAG" >&2; exit 1; }
          source_commit="$(git rev-parse "$TAG^{commit}")"
          git fetch origin main
          git merge-base --is-ancestor "$source_commit" origin/main || { echo "tag source is not on main" >&2; exit 1; }
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build-arm64:
    runs-on: macos-15
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 0
      - name: Overlay current packaging tooling
        run: |
          set -euo pipefail
          for file in scripts/macos/build-app.sh scripts/macos/package-release.sh packaging/INSTALL.md packaging/LICENSE.txt; do
            mkdir -p "$(dirname "$file")"
            git show "$GITHUB_SHA:$file" > "$file"
          done
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0
          targets: aarch64-apple-darwin
      - run: bash scripts/macos/package-release.sh --version "${{ needs.prepare.outputs.version }}" --arch arm64 --output-dir dist/arm64
      - uses: actions/upload-artifact@v4
        with:
          name: backfill-arm64
          path: dist/arm64

  build-x86_64:
    runs-on: macos-15-intel
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 0
      - name: Overlay current packaging tooling
        run: |
          set -euo pipefail
          for file in scripts/macos/build-app.sh scripts/macos/package-release.sh packaging/INSTALL.md packaging/LICENSE.txt; do
            mkdir -p "$(dirname "$file")"
            git show "$GITHUB_SHA:$file" > "$file"
          done
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.91.0
          targets: x86_64-apple-darwin
      - run: bash scripts/macos/package-release.sh --version "${{ needs.prepare.outputs.version }}" --arch x86_64 --output-dir dist/x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: backfill-x86_64
          path: dist/x86_64

  assemble:
    runs-on: macos-15
    needs: [prepare, build-arm64, build-x86_64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 0
      - name: Overlay current packaging tooling
        run: |
          set -euo pipefail
          for file in scripts/macos/assemble-universal.sh scripts/macos/verify-release-assets.sh scripts/macos/generate-release-manifest.sh; do
            mkdir -p "$(dirname "$file")"
            git show "$GITHUB_SHA:$file" > "$file"
          done
      - uses: actions/download-artifact@v4
        with:
          name: backfill-arm64
          path: dist/arm64
      - uses: actions/download-artifact@v4
        with:
          name: backfill-x86_64
          path: dist/x86_64
      - name: Assemble and verify
        env: { RUST_TOOLCHAIN: 1.91.0 }
        run: |
          set -euo pipefail
          mkdir -p dist/final
          arm_app="$(find dist/arm64 -maxdepth 1 -type d -name '*.app' -print -quit)"
          x86_app="$(find dist/x86_64 -maxdepth 1 -type d -name '*.app' -print -quit)"
          bash scripts/macos/assemble-universal.sh --version "${{ needs.prepare.outputs.version }}" --arm64-app "$arm_app" --x86_64-app "$x86_app" --output-dir dist/final
          cp dist/arm64/TelevyBackup-*-arm64.dmg dist/final/
          cp dist/x86_64/TelevyBackup-*-x86_64.dmg dist/final/
          cp dist/arm64/televybackup-tools-*-arm64.tar.gz dist/final/
          cp dist/x86_64/televybackup-tools-*-x86_64.tar.gz dist/final/
          bash scripts/macos/generate-release-manifest.sh --version "${{ needs.prepare.outputs.version }}" --asset-dir dist/final --source-commit "${{ needs.prepare.outputs.source_commit }}" --packaging-commit "$GITHUB_SHA" --output dist/final/BUILD-MANIFEST.json
          bash scripts/macos/verify-release-assets.sh --version "${{ needs.prepare.outputs.version }}" --asset-dir dist/final
      - uses: actions/upload-artifact@v4
        with:
          name: backfill-release-assets
          path: dist/final

  publish:
    runs-on: ubuntu-latest
    needs: [prepare, assemble]
    if: ${{ inputs.publish == true }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backfill-release-assets
          path: dist/final
      - name: Upload only hash-matching assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null
          remote="$(gh release view "$TAG" --json assets)"
          while IFS= read -r file; do
            name="$(basename "$file")"
            local_sha="$(sha256sum "$file" | awk '{print $1}')"
            remote_sha="$(REMOTE="$remote" NAME="$name" python3 -c 'import json,os; p=json.loads(os.environ["REMOTE"]); print(next((a.get("digest","").removeprefix("sha256:")) for a in p.get("assets",[]) if a.get("name")==os.environ["NAME"]),"")')"
            if [[ -n "$remote_sha" ]]; then
              [[ "$remote_sha" == "$local_sha" ]] || { echo "asset hash mismatch: $name" >&2; exit 1; }
            else
              gh release upload "$TAG" "$file"
            fi
          done < <(find dist/final -maxdepth 1 -type f -print)
          gh release edit "$TAG" --draft=false
